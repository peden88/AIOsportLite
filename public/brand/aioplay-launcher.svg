<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">AIOPlay launcher banner</title><desc id="desc">AIOPlay wordmark with AIO over a glowing play symbol.</desc>
<defs>
  <radialGradient id="bg" cx=".28" cy=".48" r=".92"><stop stop-color="#091a3a"/><stop offset=".45" stop-color="#060b18"/><stop offset="1" stop-color="#020307"/></radialGradient>
  <linearGradient id="play" x1=".08" y1=".05" x2=".95" y2=".92"><stop stop-color="#20e8ff"/><stop offset=".38" stop-color="#086cff"/><stop offset=".7" stop-color="#1537d6"/><stop offset="1" stop-color="#9b2cff"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#19defc"/><stop offset=".48" stop-color="#0781ff"/><stop offset="1" stop-color="#8b38ff"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<path d="M218 190c-20-13-46 2-46 27v286c0 25 26 40 46 27l254-143c22-12 22-42 0-54L218 190Z" fill="url(#play)" filter="url(#glow)"/>
<text x="292" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="158" font-weight="850" letter-spacing="-11" fill="#fff">AIO</text>
<text x="545" y="410" font-family="Inter,Arial,sans-serif" font-size="142" font-weight="800" letter-spacing="-7" fill="#fff">AIO</text>
<text x="770" y="410" font-family="Inter,Arial,sans-serif" font-size="142" font-weight="800" letter-spacing="-7" fill="url(#word)">Play</text>
</svg>