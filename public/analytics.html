<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOPlay — Analytics</title><link rel="icon" href="/aioplay-brand.webp"><style>
:root{--bg:#0a0e13;--panel:#11161d;--line:rgba(255,255,255,.08);--text:#f3f5f7;--dim:#9ca6af;--accent:#9aadb5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 10%,rgba(113,133,155,.12),transparent 34%),linear-gradient(135deg,#0a0e13,#11161d 52%,#171920);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 22px;background:rgba(10,14,19,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}header img{width:34px;height:34px;border-radius:8px}header h1{font-size:16px;margin:0}.spacer{flex:1}a{color:#c1cbd2;text-decoration:none}main{max-width:1180px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}select,button{background:#1a2129;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,.panel{background:rgba(17,22,29,.86);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 42px rgba(0,0,0,.15)}.metric{font-size:26px;font-weight:750}.label,.dim{color:var(--dim)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:0 0 12px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}th{color:var(--dim);font-size:11px;text-transform:uppercase}tbody tr:hover{background:rgba(255,255,255,.025)}.barrow{display:grid;grid-template-columns:90px 1fr 80px;gap:9px;align-items:center;margin:8px 0}.bar{height:8px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}.chart{height:150px;display:flex;align-items:end;gap:4px;padding-top:12px}.day{flex:1;min-width:5px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.75}.empty{padding:14px;color:var(--dim)}@media(max-width:760px){.panels{grid-template-columns:1fr}.wide{grid-column:auto}.cards{grid-template-columns:repeat(2,1fr)}header a.hide-mobile{display:none}.metric{font-size:22px}}</style><style id="admin-bottom-nav-style">body{padding-bottom:64px!important}.admin-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:4px;background:#0a0e13;border-top:1px solid rgba(255,255,255,.08)}.admin-bottom-nav a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 4px;border-radius:9px;color:#9ca6af;text-decoration:none;font-weight:700}.admin-bottom-nav a.active{background:#34404b;color:#f3f5f7}@media(max-width:650px){.admin-bottom-nav a{font-size:11px;min-height:46px}}</style></head><body>
<header><img src="/aioplay-brand.webp" alt=""><h1>Analytics</h1><div class="spacer"></div><a class="hide-mobile" href="/users">Users</a><a href="/dashboard">Dashboard</a><a href="/">AIOPlay</a></header>
<main><div class="toolbar"><select id="period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select><button id="refresh">Refresh</button><span class="dim" id="retention"></span></div>
<div class="cards" id="cards"></div><div class="panels">
<section class="panel wide"><h2>Watch time by day</h2><div class="chart" id="chart"></div></section>
<section class="panel"><h2>Top users</h2><div class="tablewrap"><table><thead><tr><th>User</th><th>Watch time</th><th>Plays</th><th>Titles</th><th>Logins</th><th>Last active</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="panel"><h2>Top content</h2><div class="tablewrap"><table><thead><tr><th>Title</th><th>Watch time</th><th>Plays</th><th>Viewers</th></tr></thead><tbody id="titles"></tbody></table></div></section>
<section class="panel"><h2>Devices / clients</h2><div id="devices"></div></section>
<section class="panel"><h2>Current activity</h2><div id="streams"></div></section>
</div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=n=>{n=Number(n)||0;const s=Math.round(n/1000);return s>=3600?Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m':s>=60?Math.floor(s/60)+'m '+s%60+'s':s+'s'},when=n=>n?new Date(n).toLocaleString():'—';
const STORE='liveSportsAdminToken';let token='';try{token=localStorage.getItem(STORE)||''}catch{}const auth=()=>token?{'x-admin-token':token}:{};
function metric(label,value){return '<div class="card"><div class="label">'+label+'</div><div class="metric">'+value+'</div></div>'}
async function load(){const r=await fetch('/api/v1/admin/analytics?days='+$('period').value,{cache:'no-store',headers:auth()});if(!r.ok){$('cards').innerHTML='<div class="empty">Analytics unavailable ('+r.status+'). Open Dashboard first if ADMIN_TOKEN authentication is required.</div>';return}const d=await r.json(),t=d.totals;
$('retention').textContent='Detailed event retention: '+d.retentionDays+' days';
$('cards').innerHTML=metric('Watch time',fmt(t.watchMs))+metric('Plays',t.plays)+metric('Titles viewed',t.uniqueTitles)+metric('Detail views',t.detailsViews)+metric('Active 7d',t.active7)+metric('Active 30d',t.active30)+metric('Logins',t.logins)+metric('Failed logins',t.failedLogins)+metric('Source switches',t.streamSwitches);
$('users').innerHTML=d.users.map(u=>'<tr><td><b>'+esc(u.displayName||u.username)+'</b><div class="dim">@'+esc(u.username)+'</div></td><td>'+fmt(u.watchMs)+'</td><td>'+u.plays+'</td><td>'+u.uniqueTitles+'</td><td>'+u.logins+'</td><td>'+when(u.lastActive)+'</td></tr>').join('');
$('titles').innerHTML=d.titles.slice(0,30).map(x=>'<tr><td><b>'+esc(x.title||x.contentId)+'</b><div class="dim">'+esc(x.contentType)+'</div></td><td>'+fmt(x.watchMs)+'</td><td>'+x.plays+'</td><td>'+x.viewers+'</td></tr>').join('');
const max=Math.max(1,...d.daily.map(x=>x.watchMs));$('chart').innerHTML=d.daily.map(x=>'<i class="day" title="'+esc(x.date)+' · '+fmt(x.watchMs)+'" style="height:'+Math.max(2,Math.round(x.watchMs/max*100))+'%"></i>').join('')||'<div class="empty">No watch activity yet.</div>';
const dm=Math.max(1,...d.devices.map(x=>x.plays));$('devices').innerHTML=d.devices.map(x=>'<div class="barrow"><span>'+esc(x.name)+'</span><div class="bar"><i style="width:'+Math.round(x.plays/dm*100)+'%"></i></div><b>'+x.plays+'</b></div>').join('')||'<div class="empty">No playback devices yet.</div>';
$('streams').innerHTML=(d.activeStreams||[]).map(s=>'<div style="padding:9px 0;border-top:1px solid var(--line)"><b>'+esc(s.displayName||s.username)+'</b><div>'+esc(s.seriesTitle||s.title||s.contentId)+'</div><div class="dim">'+esc(s.deviceName||s.client)+' · started '+when(s.startedAt)+'</div></div>').join('')||'<div class="empty">No active streams.</div>'}
$('refresh').onclick=load;$('period').onchange=load;load();setInterval(load,60000);
</script><nav class="admin-bottom-nav" aria-label="Admin console"><a href="/services">Services</a><a href="/analytics" class="active">Analytics</a><a href="/users">Users</a><a href="/dashboard">Dashboard</a><a href="/dashboard#collections">Collections editor</a></nav></body></html>
