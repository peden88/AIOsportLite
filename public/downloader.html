<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d14"><title>AIOPlay Downloader</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0a0d14;color:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 50px}header{position:sticky;top:0;background:#0a0d14f0;z-index:3;display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #293143;flex-wrap:wrap}h1{font-size:1.3rem;margin:0;white-space:nowrap}input,select,button{font:inherit}input,select{background:#171d2a;color:white;border:1px solid #394357;border-radius:12px;padding:12px}#search{flex:1;min-width:170px}button{cursor:pointer;color:#fff;border:1px solid #344057;background:#1c2940;border-radius:12px;padding:10px 13px}button.primary{background:#1463dc;border-color:#287bf5}button:disabled{opacity:.55}main{max-width:1500px;margin:auto}.rail{margin:22px 0}.rail h2{font-size:1.05rem}.tiles{display:flex;gap:12px;overflow:auto;padding:5px 0 12px}.tile{flex:0 0 145px;text-align:left;background:transparent;border:0;padding:0}.tile img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222b3b;border-radius:10px}.tile span{display:block;margin-top:7px;font-size:.86rem;overflow-wrap:anywhere}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px}.results .tile{width:100%}.status{color:#b2c1d5;padding:14px 0}dialog{background:#111825;color:#fff;border:1px solid #3a4961;border-radius:18px;width:min(94vw,760px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#000b}dialog .head{display:flex;justify-content:space-between;align-items:center;gap:10px}dialog h2{margin:0 0 14px}.details{display:flex;gap:20px;flex-wrap:wrap}.details img{width:150px;max-width:35%;height:fit-content;border-radius:12px}.details article{flex:1;min-width:210px}.episode{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #263248}.source{display:block;width:100%;text-align:left;margin:12px 0;background:#1a2436;white-space:pre-wrap;overflow-wrap:anywhere}.source strong,.source span{display:block;white-space:pre-wrap}.source span{color:#c2d1e6;margin-top:8px}.close{background:transparent}.hide{display:none!important}@media(max-width:600px){.tile{flex-basis:115px}header{gap:8px}h1{width:100%}}
</style></head><body><main><header><h1>⬇ AIOPlay Downloader</h1><input id="search" type="search" placeholder="Search movies, series, anime…" autocomplete="off" aria-label="Search titles"><select id="type" aria-label="Search type"><option value="">All</option><option value="movie">Movies</option><option value="series">Series</option></select><button id="clear">Clear</button><button id="signout">Sign out</button></header><p id="status" class="status" role="status"></p><section id="home"></section><section id="results" class="results hide" aria-label="Search results"></section></main>
<dialog id="details"><div class="head"><h2 id="detailTitle"></h2><button class="close" data-close="details">✕ Close</button></div><div class="details"><img id="poster" alt=""><article><p id="summary"></p><button id="movieDownload" class="primary hide">Download movie</button><div id="episodes"></div></article></div></dialog>
<dialog id="picker"><div class="head"><h2>Choose download source</h2><button class="close" data-close="picker">✕ Close</button></div><p id="pickerStatus" role="status"></p><div id="sources"></div></dialog>
<script src="/downloader.js" defer></script></body></html>
