<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOPlay — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/brand/aioplay-mark.svg">
<link rel="apple-touch-icon" href="/brand/aioplay-mark.svg">
<style>
  :root { --bg:#09090b; --panel:#151518; --line:#29292f; --text:#f4f4f5; --dim:#a1a1aa; --accent:#1668ff; --danger:#ff8d90; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(22,104,255,.16), transparent 65%),
      linear-gradient(180deg, #0d0d10 0%, var(--bg) 100%);
    color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  .box {
    width:100%; max-width:410px; background:rgba(21,21,24,.96);
    border:1px solid var(--line); border-radius:18px; padding:30px 28px;
    box-shadow:0 28px 70px rgba(0,0,0,.55);
  }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .brand img { width:52px; height:52px; border-radius:12px; object-fit:cover; }
  h1 { font-size:22px; margin:0 0 2px; font-weight:700; letter-spacing:-.02em; }
  .brand p { margin:0; color:var(--dim); font-size:13px; }
  .field { margin-top:15px; }
  label { display:block; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); font-weight:650; margin-bottom:7px; }
  input {
    width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:10px;
    background:#1f1f24; color:var(--text); border:1px solid var(--line);
  }
  input:focus { outline:none; border-color:#4b73bd; box-shadow:0 0 0 3px rgba(22,104,255,.12); }
  button {
    width:100%; margin-top:20px; font:inherit; font-size:15px; font-weight:700;
    padding:12px 14px; border-radius:10px; cursor:pointer; border:none;
    background:var(--accent); color:#fff;
  }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  #msg { margin-top:14px; min-height:21px; font-size:14px; color:var(--danger); }
  .foot { margin-top:16px; color:var(--dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<form class="box" id="form" autocomplete="on">
  <div class="brand">
    <img src="/brand/aioplay-mark.svg" alt="">
    <div>
      <h1>AIOPlay</h1>
      <p>Sign in to continue</p>
    </div>
  </div>

  <div class="field">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>

  <button type="submit" id="go">Sign in</button>
  <div id="msg" role="alert" aria-live="polite"></div>
  <div class="foot">Your account is managed by this AIOPlay server.</div>
</form>

<script>
const form = document.getElementById('form');
const username = document.getElementById('username');
const password = document.getElementById('password');
const go = document.getElementById('go');
const msg = document.getElementById('msg');

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!username.value.trim() || !password.value) return;

  go.disabled = true;
  msg.textContent = '';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username.value.trim(),
        password: password.value,
        deviceName: 'Web browser'
      })
    });
    const body = await res.json().catch(() => ({}));

    if (res.ok && body.authenticated) {
      location.replace('/');
      return;
    }

    msg.textContent = res.status === 429
      ? 'Too many attempts. Try again in a few minutes.'
      : (body.error || 'Username or password was not accepted.');
  } catch (err) {
    msg.textContent = 'Cannot reach the server. Check your connection and try again.';
  }

  go.disabled = false;
  password.select();
});
</script>
</body>
</html>
