      if (!Array.isArray(metas) || metas.length === 0) {
        setGridState('Nothing to show here right now.');
        return;
      }

      updateHero(metas[0]);
      prefetchNearVisibleArtwork(metas);

      let lastSearchCatalogKey = '';
      for (const [metaIndex, meta] of metas.entries()) {
        if (meta && meta._searchCatalog) {
          const searchCatalogKey = String(meta._searchCatalog.type || '') + ':' + String(meta._searchCatalog.id || '');
          if (searchCatalogKey !== lastSearchCatalogKey) {
            lastSearchCatalogKey = searchCatalogKey;
            const heading = document.createElement('div');
            heading.className = 'search-row-heading';
            const label = document.createElement('span');
            label.textContent = String(meta._searchCatalog.name || 'Results');
            const suffix = document.createElement('small');
            suffix.textContent = String(meta._searchCatalog.type || '');
            heading.append(label, suffix);
            host.appendChild(heading);
          }
        }
        const card = document.createElement('div');
        card.className = 'card' + (currentMode === 'sports' ? ' live-card' : '');
        card.dataset.contentId = String(meta.id || '');
        card.dataset.contentKey = cardIdentity(meta);

        card.tabIndex = 0;
        card.addEventListener('mouseenter', () => {
          rememberCard(card, meta);
          if (currentMode !== 'sports') {
            loadMetaFor(meta).then(prefetchMetaArtwork).catch(() => {});
          }
        });
        card.addEventListener('focus', () => {
          const coarseLive = currentMode === 'sports' &&
            window.matchMedia?.('(hover:none), (pointer:coarse)')?.matches === true;
          if (coarseLive) {
            lastActiveCard = card;
          } else {
            rememberCard(card, meta);
            persistUiState();
          }
        });
        card.addEventListener('pointerdown', event => {
          lastActiveCard = card;
          if (currentMode !== 'sports' && event.pointerType !== 'mouse') {
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
              longPressedCards.add(card);
              showQuickActions(card, meta);
            }, 560);
          }
        });
        ['pointerup','pointercancel','pointerleave'].forEach(eventName => {
          card.addEventListener(eventName, () => clearTimeout(longPressTimer));
        });
        card.addEventListener('contextmenu', event => {
          if (currentMode === 'sports') return;
          event.preventDefault();
          showQuickActions(card, meta);
        });
        card.onkeydown = event => {
          if (event.target !== card) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            card.click();
            return;
          }
          if (focusCardInDirection(card, event.key)) {
            event.preventDefault();
          }
        };
        card.addEventListener('click', event => {
          if (!longPressedCards.has(card)) return;
          longPressedCards.delete(card);
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);

        if (currentMode === 'sports') {
          card.onclick = () => fetchAndPlay(meta.id, 'sport_event', '', null, card);
        } else {
          card.classList.add('vod-card');
          const vodType = String(meta.type || currentVodType || 'movie').toLowerCase();
          if (currentMode === 'continue' && meta._progress) {
            card.onclick = () => {
              const row = meta._progress;
              return fetchAndPlay(
                row.videoId || row.contentId,
                row.contentType === 'series' ? 'episode' : 'movie',
                row.contentType === 'series' ? 'series' : 'movie',
                row,
                card
              );
            };
          } else {
            card.onclick = vodType === 'series'
              ? () => openSeries(meta, card)
              : () => openMovie(meta, card);
          }
        }

        const posterBox = document.createElement('div');
        posterBox.className = 'poster-container';
        if (currentMode === 'sports') {
          const eager = metaIndex < 10;
          const priority = metaIndex < 4 ? 'high' : undefined;
          posterBox.appendChild(makeImage(
            meta.background || meta.poster,
            'background',
            '',
            { loading:eager ? 'eager' : 'lazy', fetchPriority:priority }
          ));
          posterBox.appendChild(makeImage(
            meta.poster,
            'poster',
            meta.name || '',
            { loading:eager ? 'eager' : 'lazy', fetchPriority:priority }
          ));
        } else {
          posterBox.appendChild(makeImage(meta.poster || meta.background, 'poster', meta.name || ''));
        }

        if (currentMode === 'sports' && meta.logo && meta.logo !== meta.poster) {
          posterBox.appendChild(makeImage(
            meta.logo,
            'logo',
            '',
            { loading:metaIndex < 10 ? 'eager' : 'lazy' }
          ));
        }

        const name = String(meta.name || '');
        if (currentMode === 'sports' && name.includes('🔴')) {
          const badge = document.createElement('div');
          badge.className = 'live-badge';
          badge.textContent = 'LIVE';
          posterBox.appendChild(badge);
        }

        if (currentMode !== 'sports') {
          if (meta._progress?.upNext || meta._progress?.source === 'aioplay_up_next') {
            const upNext = document.createElement('div');
            upNext.className = 'up-next-badge';
            upNext.textContent = 'UP NEXT';
            posterBox.appendChild(upNext);
          }

          const watchRow = meta._progress || (
            normalizedVodType(meta) === 'movie'
              ? cachedMovieProgress(meta.id)
              : cachedSeriesProgress(meta.id)
          );
          const watchPct = Number(watchRow?.progressPercent || 0);
          if (isInWebLibrary(meta)) {
            const saved = document.createElement('div');
            saved.className = 'up-next-badge';
            saved.textContent = 'LIBRARY';
            posterBox.appendChild(saved);
          }
          if (isWebWatched(meta) || (normalizedVodType(meta) === 'movie' && watchPct >= 90)) {
            const watched = document.createElement('div');
            watched.className = 'watched-badge';
            watched.title = 'Watched';
            watched.textContent = '✓';
            posterBox.appendChild(watched);
          }

          const quick = document.createElement('button');
          quick.type = 'button';
          quick.className = 'card-quick-trigger';
          quick.setAttribute('aria-label', 'Title actions');
          quick.textContent = '⋯';
          quick.onclick = event => {
            event.preventDefault();
            event.stopPropagation();
            showQuickActions(quick, meta);
          };
          posterBox.appendChild(quick);
        }

        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = name.replace('🔴 [LIVE] ', '');
        const metaLine = document.createElement('div');
        metaLine.className = 'card-meta-line';
        cardMetadataLabels(meta).forEach(label => {
          const span = document.createElement('span');
          span.textContent = label;
          metaLine.appendChild(span);
        });

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = String(meta.description || '');
        info.append(title);
        if (currentMode !== 'sports' && metaLine.childElementCount) {
          info.appendChild(metaLine);
        }
        info.appendChild(desc);

        const progressRow = meta._progress || (
          currentMode !== 'sports' && normalizedVodType(meta) === 'movie'
            ? cachedMovieProgress(meta.id)
            : null
        );
        if (progressRow) {
          if (meta._progress) {
            const continuity = continuityLabel(meta._progress);
            if (continuity) {
              const badge = document.createElement('div');
              badge.className = 'continuity-badge';
              badge.textContent = continuity;
              info.appendChild(badge);
            }
          }
          const pct = Number(progressRow.progressPercent);
          const fallbackPct = Number(progressRow.duration) > 0
            ? (Number(progressRow.position || 0) / Number(progressRow.duration)) * 100
            : 0;
          const resolvedPct = Math.max(0, Math.min(100, Number.isFinite(pct) ? pct : fallbackPct));
          if (resolvedPct > 0 && resolvedPct < 90) {
            const track = document.createElement('div');
            track.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = 'progress-fill';
            fill.style.width = resolvedPct + '%';
            track.appendChild(fill);
            info.appendChild(track);
          }
        }

        card.append(posterBox, info);
        host.appendChild(card);
        observeCardMetadata(card, meta);

        if (
          String(savedUiState()?.focusedKey || '') === card.dataset.contentKey ||
          (
            !savedUiState()?.focusedKey &&
            String(savedUiState()?.focusedId || '') === card.dataset.contentId
          )
        ) {
          lastActiveCard = card;
        }
      }
      finishGridTransition();
    }

    function progressIdentityKey(row) {
      const type = String(row?.contentType || '').toLowerCase();
      const series = type === 'series' || type === 'tv' || type === 'episode';
      if (!series) return 'movie|' + String(row?.contentId || '');
      const season = row?.season == null ? null : String(row.season);
      const episode = row?.episode == null ? null : String(row.episode);
      const videoId = String(row?.videoId || '');
      if (season !== null && episode !== null) {
        return 'series|' + String(row?.contentId || '') + '|' + season + '|' + episode;
      }
      return 'series|' + String(row?.contentId || '') + '|video|' + videoId;
    }

    function cachedMovieProgress(contentId) {
      return sharedProgressItems.find(row =>
        String(row.contentType || '').toLowerCase() === 'movie' &&
        String(row.contentId || '') === String(contentId || '')
      ) || null;
    }

    function cachedSeriesProgress(contentId) {
      return sharedProgressItems
        .filter(row =>
          ['series','tv','episode'].includes(String(row.contentType || '').toLowerCase()) &&
          String(row.contentId || '') === String(contentId || '')
        )
        .sort((a, b) => Number(b.lastWatched || 0) - Number(a.lastWatched || 0))[0] || null;
    }

    function cachedEpisodeProgress(meta, video) {
      const contentId = String(meta?.id || '');
      const videoId = String(video?.id || '');
      const season = video?.season == null ? null : Number(video.season);
      const episode = video?.episode == null ? null : Number(video.episode);
      return sharedProgressItems.find(row => {
        const type = String(row.contentType || '').toLowerCase();
        if (type !== 'series' && type !== 'tv' && type !== 'episode') return false;
        if (String(row.contentId || '') !== contentId) return false;
        if (season != null && episode != null) {
          return Number(row.season) === season && Number(row.episode) === episode;
        }
        return String(row.videoId || '') === videoId;
      }) || null;
    }

    function episodeIsWatched(meta, video) {
      const progress = cachedEpisodeProgress(meta, video);
      if (Number(progress?.progressPercent || 0) >= 90) return true;
      return sharedWatchState.some(row =>
        String(row.id) === String(meta?.id || '') &&
        ['series','tv','episode'].includes(String(row.type || '').toLowerCase()) &&
        Number(row.season) === Number(video?.season) &&
        Number(row.episode) === Number(video?.episode) &&
        row.watched
      );
    }

    async function setEpisodeWatched(meta, video, watched) {
      const id = String(meta?.id || '');
      const season = Number(video?.season);
      const episode = Number(video?.episode);
      if (!id || !Number.isFinite(season) || !Number.isFinite(episode)) return false;

      const res = await fetch('/api/v1/watch-state', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ id, type:'series', season, episode, watched })
      });
      if (!res.ok) return false;

      sharedWatchState = sharedWatchState.filter(row => !(
        String(row.id) === id &&
        ['series','tv','episode'].includes(String(row.type || '').toLowerCase()) &&
        Number(row.season) === season &&
        Number(row.episode) === episode
      ));
      sharedWatchState.push({ id, type:'series', season, episode, watched, updatedAt:Date.now() });

      const progress = progressContextForEpisode(meta, video);
      await updateProgressRow(progress, watched ? 100 : 0);
      return true;
    }

    function setDownloadPreparing(visible) {
      let toast = document.getElementById('downloadPreparingToast');
      if (visible) {
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'downloadPreparingToast';
          toast.className = 'download-preparing-toast';
          toast.setAttribute('role', 'status');
          toast.setAttribute('aria-live', 'polite');
          toast.innerHTML = '<span class="download-preparing-spinner" aria-hidden="true"></span><span>Starting Download…</span>';
          document.body.appendChild(toast);
        }
        requestAnimationFrame(() => toast.classList.add('visible'));
      } else if (toast) {
        toast.classList.remove('visible');
        setTimeout(() => { if (!toast.classList.contains('visible')) toast.remove(); }, 180);
      }
    }

    function formatDownloadSize(bytes) {
      const n = Number(bytes);
      if (!Number.isFinite(n) || n <= 0) return 'Size unknown';
      const gb = n / 1073741824;
      return gb >= 1 ? gb.toFixed(gb >= 10 ? 1 : 2) + ' GB' : (n / 1048576).toFixed(0) + ' MB';
    }

    function chooseDownloadCandidate(candidates) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'download-picker-overlay';
        overlay.innerHTML = '<section class="download-picker-sheet" role="dialog" aria-modal="true" aria-label="Choose download">' +
          '<div class="download-picker-head"><div><h3>Choose Download</h3><p>Largest files first</p></div><button class="download-picker-close" aria-label="Cancel">×</button></div>' +
          '<div class="download-picker-list"></div></section>';
        const list = overlay.querySelector('.download-picker-list');
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          overlay.remove();
          resolve(value);
        };
        overlay.querySelector('.download-picker-close').onclick = () => finish(null);
        overlay.addEventListener('click', event => { if (event.target === overlay) finish(null); });
        candidates.forEach(candidate => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'download-option';
          const tags = [candidate.resolution, candidate.quality, candidate.codec, candidate.visual, candidate.audio].filter(Boolean).join('  |  ') || 'Direct media';
          button.innerHTML = '<span class="download-option-size"></span><span class="download-option-meta"><span class="download-option-tags"></span></span><span class="download-option-arrow">›</span>';
          button.querySelector('.download-option-size').textContent = formatDownloadSize(candidate.size);
          button.querySelector('.download-option-tags').textContent = tags;
          button.onclick = () => finish(candidate);
          list.appendChild(button);
        });
        document.body.appendChild(overlay);
        overlay.querySelector('.download-option')?.focus();
      });
    }

    function chooseSeriesDownloadEpisode(meta, videos, season) {
      const selectedSeason = Number(season);
      const episodes = (Array.isArray(videos) ? videos : [])
        .filter(video => video?.id && (Number(video.season) || 0) === selectedSeason)
        .sort((a,b) => (Number(a.episode) || 0) - (Number(b.episode) || 0));
      if (!episodes.length) return Promise.resolve(null);

      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'download-picker-overlay';
        overlay.innerHTML =
          '<section class="download-picker-sheet" role="dialog" aria-modal="true" aria-label="Choose episode to download">' +
            '<div class="download-picker-head"><div><h3>Choose episode</h3><p></p></div>' +
            '<button type="button" class="download-picker-close" aria-label="Close">×</button></div>' +
            '<div class="download-picker-list"></div>' +
          '</section>';
        const seasonName = selectedSeason > 0 ? ('Season ' + selectedSeason) : 'Specials';
        overlay.querySelector('.download-picker-head p').textContent =
          (meta?.name || 'Series') + ' · ' + seasonName;
        const list = overlay.querySelector('.download-picker-list');
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          overlay.remove();
          resolve(value);
        };
        overlay.querySelector('.download-picker-close').onclick = () => finish(null);
        overlay.addEventListener('click', event => { if (event.target === overlay) finish(null); });
        episodes.forEach((video,index) => {
          const ep = Number(video.episode) || index + 1;
          const code = selectedSeason > 0
            ? ('S' + String(selectedSeason).padStart(2,'0') + 'E' + String(ep).padStart(2,'0'))
            : ('E' + String(ep).padStart(2,'0'));
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'download-option episode-download-option';
          button.innerHTML =
            '<span class="episode-download-code"></span>' +
            '<span class="episode-download-separator">|</span>' +
            '<span class="episode-download-name"></span>' +
            '<span class="download-option-arrow">›</span>';
          button.querySelector('.episode-download-code').textContent = code;
          const suppliedTitle = String(video.title || video.name || '').trim();
          const genericEpisode = 'Episode ' + ep;
          const titleIsGeneric = suppliedTitle.toLowerCase() === genericEpisode.toLowerCase();
          button.querySelector('.episode-download-name').textContent =
            genericEpisode + ((!suppliedTitle || titleIsGeneric) ? '' : ('  “' + suppliedTitle + '”'));
          button.onclick = () => finish(video);
          list.appendChild(button);
        });
        document.body.appendChild(overlay);
        overlay.querySelector('.download-option')?.focus();
      });
    }

    function configureSeriesDownloadAction(meta, videos) {
      const actions = document.getElementById('detailsActions');
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      if (!actions || !seasonControl || !seasonSelect) return;
      let button = document.getElementById('detailsSeriesDownload');
      if (!button) {
        button = document.createElement('button');
        button.type = 'button';
        button.id = 'detailsSeriesDownload';
        button.textContent = 'Download';
        actions.insertBefore(button, seasonControl);
      }
      button.onclick = async () => {
        const season = Number(seasonSelect.value || currentDetailsSeason || 0);
        const video = await chooseSeriesDownloadEpisode(currentDetailsMeta || meta, videos, season);
        if (video) await downloadVod(currentDetailsMeta || meta, video);
      };
    }

    async function downloadVod(meta, video = null) {
      const isEpisode = !!video;
      const id = isEpisode ? video.id : meta.id;
      const contentType = isEpisode ? 'episode' : 'movie';
      const stremioType = isEpisode ? 'series' : 'movie';
      const cleanDownloadTitle = value => String(value || '')
        .replace(/[\\/:*?"<>|]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      const title = cleanDownloadTitle(meta.name || meta.title || (isEpisode ? 'Series' : 'Movie'));
      const filename = isEpisode
        ? (title + ' - S' + String(video.season || 0).padStart(2,'0') + 'E' + String(video.episode || 0).padStart(2,'0'))
        : (() => {
            const release = String(meta.year || meta.releaseInfo || '');
            const yearMatch = release.match(/(?:^|\D)((?:19|20)\d{2})(?:\D|$)/);
            const year = yearMatch ? yearMatch[1] : '';
            return title + (year ? ' (' + year + ')' : '');
          })();
      setDownloadPreparing(true);
      // Give Safari one paint before stream discovery begins so the user gets
      // immediate feedback even when the following request resolves quickly.
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      try {
        const playRes = await fetch('/api/v1/play', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            contentType, id, stremioType,
            title:filename,
            parentId:isEpisode ? (meta.id || '') : '',
            parentName:isEpisode ? (meta.name || '') : '',
            season:isEpisode ? video.season : null,
            episode:isEpisode ? video.episode : null,
            episodeTitle:isEpisode ? (video.title || video.name || '') : ''
          })
        });
        const play = await playRes.json().catch(() => ({}));
        if (!playRes.ok || !play.sessionId) throw new Error(play.error || 'No downloadable stream was found.');

        const optionsRes = await fetch('/api/v1/playback/' + encodeURIComponent(play.sessionId) + '/download-options');
        const optionsData = await optionsRes.json().catch(() => ({}));
        if (!optionsRes.ok) throw new Error(optionsData.error || 'Download choices could not be prepared.');
        const candidates = Array.isArray(optionsData.candidates) ? optionsData.candidates : [];
        if (!candidates.length) {
          await fetch('/api/v1/playback/' + encodeURIComponent(play.sessionId), { method:'DELETE' }).catch(() => {});
          throw new Error('No directly downloadable files were found for this title.');
        }
        setDownloadPreparing(false);
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const candidate = await chooseDownloadCandidate(candidates);
        if (!candidate) {
          await fetch('/api/v1/playback/' + encodeURIComponent(play.sessionId), { method:'DELETE' }).catch(() => {});
          return;
        }
        setDownloadPreparing(true);

        const res = await fetch('/api/v1/playback/' + encodeURIComponent(play.sessionId) + '/download', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ filename, candidateIndex:candidate.index })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) {
          await fetch('/api/v1/playback/' + encodeURIComponent(play.sessionId), { method:'DELETE' }).catch(() => {});
          throw new Error(data.error || 'This source is not downloadable.');
        }
        setDownloadPreparing(false);
        const a = document.createElement('a');
        a.href = data.url;
        a.download = '';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        setDownloadPreparing(false);
        alert(err.message || 'Download could not be started.');
      }
    }

    function hideEpisodeStateMenu() {
      const menu = document.getElementById('episodeStateMenu');
      if (!menu) return;
      menu.hidden = true;
      menu.innerHTML = '';
    }

    function showEpisodeStateMenu(anchor, meta, video, rerender) {
      const menu = document.getElementById('episodeStateMenu');
      if (!menu) return;
      hideEpisodeStateMenu();
      const watched = episodeIsWatched(meta, video);
      const button = document.createElement('button');
      button.type = 'button';
      button.role = 'menuitem';
      button.textContent = watched ? 'Mark episode unwatched' : 'Mark episode watched';
      button.onclick = async event => {
        event.stopPropagation();
        hideEpisodeStateMenu();
        if (await setEpisodeWatched(meta, video, !watched)) rerender();
      };
      menu.appendChild(button);
      const download = document.createElement('button');
      download.type = 'button';
      download.role = 'menuitem';
      download.textContent = 'Download episode';
      download.onclick = async event => {
        event.stopPropagation();
        hideEpisodeStateMenu();
        await downloadVod(meta, video);
      };
      menu.appendChild(download);
      const rect = anchor.getBoundingClientRect();
      menu.style.left = Math.max(10, Math.min(innerWidth - 190, rect.left)) + 'px';
      menu.style.top = Math.max(10, Math.min(innerHeight - 70, rect.bottom + 6)) + 'px';
      menu.hidden = false;
      requestAnimationFrame(() => button.focus());
    }

    function progressContextForMovie(meta) {
      const existing = cachedMovieProgress(meta.id);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'movie',
        name: meta.name || existing?.name || 'Movie',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: meta.id,
        season: null,
        episode: null,
        episodeTitle: null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    function progressContextForEpisode(meta, video) {
      const existing = cachedEpisodeProgress(meta, video);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'series',
        name: meta.name || existing?.name || 'Series',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: video.id,
        season: Number.isFinite(Number(video.season)) ? Number(video.season) : null,
        episode: Number.isFinite(Number(video.episode)) ? Number(video.episode) : null,
        episodeTitle: video.title || video.name || existing?.episodeTitle || null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    async function syncCurrentProgress(force = false, completed = false) {
      const row = currentProgressContext;
      if (!row) return;
      const video = document.getElementById('video');
      const now = Date.now();
      if (!force && now - lastProgressSyncAt < 10000) return;

      const durationMs = Number.isFinite(video.duration) && video.duration > 0
        ? Math.round(video.duration * 1000)
        : Number(row.duration || 0);
      let positionMs = Number.isFinite(video.currentTime) && video.currentTime > 0
        ? Math.round(video.currentTime * 1000)
        : Number(row.position || 0);

      if (completed && durationMs > 0) positionMs = durationMs;
      if (positionMs <= 0 && Number(row.position || 0) <= 0) return;

      const next = {
        ...row,
        position: Math.max(0, positionMs),
        duration: Math.max(0, durationMs),
        progressPercent: completed
          ? 100
          : (durationMs > 0 ? Math.max(0, Math.min(100, (positionMs / durationMs) * 100)) : Number(row.progressPercent || 0)),
        lastWatched: now,
        source: 'aioplay_web'
      };
      currentProgressContext = next;
      lastProgressSyncAt = now;
      const nextKey = progressIdentityKey(next);
      const existingIndex = sharedProgressItems.findIndex(row => progressIdentityKey(row) === nextKey);
      if (existingIndex >= 0) sharedProgressItems[existingIndex] = next;
      else sharedProgressItems.unshift(next);

      try {
        await fetch('/api/v1/progress', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: next }),
          keepalive: force
        });
      } catch (_) {}
    }

    function applyResumePosition(video) {
      const row = currentProgressContext;
      if (!row || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const resumeSeconds = Number(row.position || 0) / 1000;
      if (resumeSeconds <= 0) return;
      if (resumeSeconds >= video.duration * 0.90) return;
      if (Math.abs(video.currentTime - resumeSeconds) > 2) {
        try { video.currentTime = Math.min(resumeSeconds, Math.max(0, video.duration - 2)); } catch (_) {}
      }
    }

    const perfMarks = [];
    function perfStart(name) {
      const mark = { name, started:performance.now() };
      perfMarks.push(mark);
      if (perfMarks.length > 30) perfMarks.shift();
      return mark;
    }
    function perfEnd(mark) {
      if (!mark) return;
      mark.ms = Math.round((performance.now() - mark.started) * 10) / 10;
      if (localStorage.getItem('aioplay.debugPerformance') === '1') {
        console.debug('[AIOPlay perf]', mark.name, mark.ms + 'ms');
      }
    }

    const prefetchedArtwork = new Set();
    function prefetchImage(url) {
      const safe = safeImageUrl(url);
      if (!safe || prefetchedArtwork.has(safe)) return;
      prefetchedArtwork.add(safe);
      const img = new Image();
      img.decoding = 'async';
      img.src = safe;
    }
    function prefetchMetaArtwork(meta) {
      if (!meta) return;
      [meta.poster, meta.background, meta.backdrop, meta.backdropUrl,
       meta.logo, meta.titleLogo, meta.titleArt, meta.clearLogo].forEach(prefetchImage);
    }
    function prefetchNearVisibleArtwork(metas) {
      if (!Array.isArray(metas)) return;
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (connection?.saveData || /(^|-)2g$/.test(String(connection?.effectiveType || ''))) return;
      const limit = window.matchMedia?.('(max-width:700px)')?.matches ? 8 : 14;
      metas.slice(0, limit).forEach(prefetchMetaArtwork);
    }

    function setDetailsBackdrop(meta) {
      const backdrop = document.getElementById('detailsBackdrop');
      if (!backdrop) return;

      const primary = safeImageUrl(
        meta?.background ||
        meta?.backdrop ||
        meta?.backdropUrl
      );
      const fallback = safeImageUrl(meta?.poster);
      const artwork = primary || fallback;
      const token = ++detailsBackdropToken;

      if (!artwork) {
        backdrop.classList.remove('is-visible', 'poster-fallback');
        backdrop.style.backgroundImage = '';
        return;
      }

      const preload = new Image();
      preload.onload = () => {
        if (token !== detailsBackdropToken) return;
        backdrop.style.backgroundImage =
          'url("' + artwork.replace(/"/g, '%22') + '")';
        backdrop.classList.toggle('poster-fallback', !primary);
        backdrop.classList.add('is-visible');
      };
      preload.onerror = () => {
        // Retain the previous decoded artwork rather than flashing a blank shell.
        if (token !== detailsBackdropToken) return;
      };
      preload.src = artwork;
    }

    function mountedViewMatchesSnapshot(snapshot) {
      if (!snapshot || snapshot.mode !== currentMode) return false;

      const expected = snapshot.catalog || null;
      const mounted = currentCatalogState || null;
      if (!!expected !== !!mounted) return false;
      if (expected && mounted) {
        if (String(expected.kind || '') !== String(mounted.kind || '')) return false;
        if (String(expected.id || '') !== String(mounted.id || '')) return false;
        if (String(expected.type || '') !== String(mounted.type || '')) return false;
      }

      const currentSearch = document.getElementById('searchInput')?.value || '';
      if (String(snapshot.search || '') !== String(currentSearch)) return false;
      if (String(snapshot.searchType || '') !== String(searchType || '')) return false;
      return grid().childElementCount > 0;
    }

    function configureMovieHeroAction(meta) {
      const slot = document.getElementById('detailsHeroAction');

      const label = document.getElementById('detailsMoviePlayLabel');
      if (!slot || !play || !label || !meta?.id) return;

      const progress = cachedMovieProgress(meta.id);

        Number(progress.progressPercent || 0) < 90
      );

      slot.hidden = false;

      play.setAttribute('aria-label', resume ? 'Resume movie' : 'Play movie');
      play.title = resume ? 'Resume' : 'Play';

        resume
          ? progress
          : progressContextForMovie(currentDetailsMeta || meta),
        document.getElementById('detailsPoster')
      );

    function seriesHeroTarget(meta, videos) {
      const ordered = Array.isArray(videos) ? videos.filter(v => v?.id) : [];
      if (!ordered.length) return null;

      const rows = ordered.map(video => ({
        video,
        progress:cachedEpisodeProgress(meta, video)
      }));
      const partial = rows
        .filter(row => {
          const pct = Number(row.progress?.progressPercent || 0);
          return pct > 0 && pct < 90;
        })
        .sort((a, b) => Number(b.progress?.lastWatched || 0) - Number(a.progress?.lastWatched || 0))[0];
      if (partial) return { ...partial, mode:'resume' };

      const hasWatched = rows.some(row => Number(row.progress?.progressPercent || 0) >= 90);
      const next = rows.find(row => Number(row.progress?.progressPercent || 0) < 90);
      if (next) return { ...next, mode:hasWatched ? 'next' : 'play' };

      // Entire available run is watched: replay the first episode rather than
      // hiding the primary action.
      return { ...rows[0], mode:'replay' };
    }

    function configureSeriesHeroAction(meta, videos) {
      const slot = document.getElementById('detailsHeroAction');
      const play = document.getElementById('detailsMoviePlay');
      const label = document.getElementById('detailsMoviePlayLabel');
      const target = seriesHeroTarget(meta, videos);
      if (!slot || !play || !label || !target) return;

      const { video, mode } = target;
      const season = Number(video.season) || 0;
      const episode = Number(video.episode) || 0;
      const code = season > 0 && episode > 0
        ? ('S' + String(season).padStart(2, '0') + 'E' + String(episode).padStart(2, '0'))
        : '';
      const action = mode === 'resume' ? 'Resume' : mode === 'next' ? 'Next Episode' : mode === 'replay' ? 'Replay' : 'Play';

      slot.hidden = false;
      label.textContent = code ? (action + ' · ' + code) : action;
      play.setAttribute('aria-label', code ? (action + ' ' + code) : action);
      play.title = code ? (action + ' ' + code) : action;
      play.onclick = async () => {
        currentDetailsEpisodeId = String(video.id);
        currentDetailsSeason = season;
        await fetchAndPlay(
          video.id,
          'episode',
          'series',
          progressContextForEpisode(meta, video),
          document.getElementById('detailsPoster')
        );
      };
    }

      perfEnd(perf);

      document.getElementById('detailsDescription').textContent = currentDetailsMeta.description || preview.description || '';

    async function openSeries(preview, sourceElement = null) {
      const perf = perfStart('details:series');
      prefetchMetaArtwork(preview);
      const previousDetailsId = currentDetailsMeta?.id || currentDetailsMeta?.contentId || '';
      if (String(previousDetailsId) !== String(preview.id || '')) {
        currentDetailsSeason = null;
        currentDetailsEpisodeId = '';
      }
      const type = 'series';
      const cacheKey = type + '|' + preview.id;
      const list = document.getElementById('episodeList');
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      const source = sourceElement?.querySelector?.('.poster-container') || sourceElement;
      await withSharedTransition(
        source,
        async () => prepareDetailsShell(preview, 'series'),
        () => document.getElementById('detailsPoster')
      );
      persistUiState({ push:true, overlay:'details' });
      const poster = document.getElementById('detailsPoster');
      list.innerHTML = '';
      beginEpisodeSkeleton(list);

      try {
        let meta = vodMetaCache.get(cacheKey) || null;
        if (!meta) {
          const res = await fetch('/api/v1/vod/meta/series/' + encodeURIComponent(preview.id));
          const body = await res.json();
          if (!res.ok || !body.meta) throw new Error(body.error || 'Metadata failed');
          meta = body.meta;
          vodMetaCache.set(cacheKey, meta);
        }
        currentDetailsMeta = { ...preview, ...meta, type:'series' };
        prefetchMetaArtwork(currentDetailsMeta);
        finishEpisodeSkeleton(list);
        perfEnd(perf);
        document.getElementById('detailsTitle').textContent = meta.name || preview.name || 'Series';
        document.getElementById('detailsDescription').textContent = meta.description || preview.description || '';
        setDetailsTitleArt(currentDetailsMeta);
        setDetailsBackdrop(currentDetailsMeta);
        fillDetailsMeta(currentDetailsMeta);
        setProgressiveImage(poster, meta.poster || preview.poster);

        const videos = Array.isArray(meta.videos) ? meta.videos.filter(v => v && v.id) : [];
        videos.sort((a, b) =>
          (Number(a.season) || 0) - (Number(b.season) || 0) ||
          (Number(a.episode) || 0) - (Number(b.episode) || 0)
        );

        configureSeriesHeroAction(currentDetailsMeta, videos);
      configureMovieDownloadAction(currentDetailsMeta);
        appendDetailsAccountActions(currentDetailsMeta);

        if (!videos.length) {
          list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available in metadata for this title.</div>';
          return;
        }

        const seasons = [...new Set(videos.map(video => Number(video.season) || 0))].sort((a, b) => a - b);
        const defaultSeason = seasons.find(season => season > 0) ?? seasons[0];

        for (const season of seasons) {
          const option = document.createElement('option');
          option.value = String(season);
          option.textContent = season > 0 ? ('Season ' + season) : 'Specials';
          seasonSelect.appendChild(option);
        }

        configureSeriesDownloadAction(currentDetailsMeta, videos);

        const renderSeason = season => {
          list.innerHTML = '';
          const episodeControls = document.getElementById('episodeScrollControls');
          if (episodeControls) episodeControls.hidden = true;
          const selected = videos.filter(video => (Number(video.season) || 0) === season);

          if (!selected.length) {
            list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available for this season.</div>';
            return;
          }

          const nextVideo = selected.find(video => !episodeIsWatched(meta, video)) || null;

          selected.forEach((video, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'episode-btn';
            button.dataset.videoId = String(video.id);

            const watchedProgress = cachedEpisodeProgress(meta, video);
            const progressPercent = Number(watchedProgress?.progressPercent || 0);
            const manuallyOrAutomaticallyWatched = episodeIsWatched(meta, video);
            if (manuallyOrAutomaticallyWatched) button.classList.add('is-watched');
            if (nextVideo && String(nextVideo.id) === String(video.id)) button.classList.add('is-next');

            const ep = Number(video.episode) || 0;
            const seasonNumber = Number(video.season) || season;
            const episodeTitle = video.title || video.name || ('Episode ' + (ep || index + 1));
            const code = ep ? ('E' + ep) : ('EP ' + (index + 1));
            button.setAttribute(
              'aria-label',
              (seasonNumber > 0 ? ('Season ' + seasonNumber + ', ') : '') +
              code + ', ' + episodeTitle
            );

            const thumb = document.createElement('div');
            thumb.className = 'episode-thumb';
            const thumbnailUrl =
              video.thumbnail ||
              video.background ||
              video.poster ||
              video.image ||
              meta.background ||
              meta.backdrop ||
              meta.poster;
            thumb.appendChild(makeImage(
              thumbnailUrl,
              'episode-image',
              episodeTitle,
              {
                loading:index < 4 ? 'eager' : 'lazy',
                fetchPriority:index < 2 ? 'high' : undefined
              }
            ));

            const number = document.createElement('span');
            number.className = 'episode-number';
            number.textContent = code;
            thumb.appendChild(number);

            if (manuallyOrAutomaticallyWatched) {
              const watched = document.createElement('span');
              watched.className = 'episode-watched';
              watched.title = 'Watched';
              watched.textContent = '✓';
              thumb.appendChild(watched);
            } else if (progressPercent > 0) {
              const track = document.createElement('div');
              track.className = 'episode-progress-track';
              const fill = document.createElement('div');
              fill.className = 'episode-progress-fill';
              fill.style.width = Math.max(0, Math.min(100, progressPercent)) + '%';
              track.appendChild(fill);
              thumb.appendChild(track);
            }

            if (nextVideo && String(nextVideo.id) === String(video.id)) {
              const nextBadge = document.createElement('span');
              nextBadge.className = 'episode-next';
              nextBadge.textContent = 'NEXT';
              thumb.appendChild(nextBadge);
            }

            const copy = document.createElement('div');
            copy.className = 'episode-copy';

            const title = document.createElement('div');
            title.className = 'episode-title';
            title.textContent = code + ' · ' + episodeTitle;
            copy.appendChild(title);

            const rawAirDate = video.released || video.releaseDate || video.airDate || video.aired || video.firstAired || video.first_air_date || null;
            const airTime = rawAirDate ? Date.parse(rawAirDate) : NaN;
            const hasAirDate = Number.isFinite(airTime);
            const notAvailable = hasAirDate && airTime > Date.now();
            if (hasAirDate) {
              const air = document.createElement('div');
              air.className = 'episode-airdate';
              air.textContent = new Intl.DateTimeFormat(undefined, {
                day:'numeric', month:'short', year:'numeric'

              if (notAvailable) {

                air.appendChild(unavailable);
                button.classList.add('is-unavailable');
                button.setAttribute('aria-disabled', 'true');
              }
              copy.appendChild(air);
            }

                        const overviewText = String(video.overview || video.description || '').trim();
            if (overviewText) {
              const overview = document.createElement('div');
              overview.className = 'episode-overview';
              overview.textContent = overviewText;
              copy.appendChild(overview);
            }

            button.append(thumb, copy);

            const more = document.createElement('button');
            more.type = 'button';
            more.className = 'episode-more';
            more.setAttribute('aria-label', 'Episode actions for ' + code);
            more.title = 'Episode actions';
            more.textContent = '•••';
            more.addEventListener('pointerdown', event => event.stopPropagation());
            more.onclick = event => {
              event.preventDefault();
              event.stopPropagation();
              showEpisodeStateMenu(more, meta, video, () => renderSeason(season));
            };
            thumb.appendChild(more);

            button.addEventListener('keydown', event => {
              if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
              const sibling = event.key === 'ArrowLeft'
                ? button.previousElementSibling
                : button.nextElementSibling;
              if (!(sibling instanceof HTMLElement)) return;
              event.preventDefault();
              sibling.focus({ preventScroll:true });
              sibling.scrollIntoView({
                block:'nearest',
                inline:'center',
                behavior:'smooth'
              });
            });

            let episodeLongPress = null;
            button.addEventListener('pointerdown', event => {
              if (event.pointerType === 'mouse') return;
              clearTimeout(episodeLongPress);
              episodeLongPress = setTimeout(() => {
                button.dataset.longPressed = '1';
                showEpisodeStateMenu(button, meta, video, () => renderSeason(season));
              }, 560);
            });
            ['pointerup','pointercancel','pointerleave'].forEach(name => {
              button.addEventListener(name, () => clearTimeout(episodeLongPress));
            });
            button.addEventListener('contextmenu', event => {
              event.preventDefault();
              showEpisodeStateMenu(button, meta, video, () => renderSeason(season));
            });

            button.onclick = async event => {
              if (button.classList.contains('is-unavailable')) {
                event.preventDefault();
                return;
              }
              if (button.dataset.longPressed === '1') {
                delete button.dataset.longPressed;
                event.preventDefault();
                return;
              }
              currentDetailsEpisodeId = String(video.id);
              currentDetailsSeason = Number(video.season) || 0;
              await fetchAndPlay(
                video.id,
                'episode',
                'series',
                progressContextForEpisode(meta, video),
                thumb
              );
            };

            list.appendChild(button);
          });
          setupEpisodeRail(list);

          restoreDetailsEpisodeFocus();
        };

        const selectedSeason = currentDetailsSeason != null && seasons.includes(Number(currentDetailsSeason))
          ? Number(currentDetailsSeason)
          : defaultSeason;
        seasonSelect.value = String(selectedSeason);
        seasonSelect.onchange = () => {
          currentDetailsSeason = Number(seasonSelect.value) || 0;
          renderSeason(currentDetailsSeason);
          persistUiState({ overlay:'details' });
        };
        seasonControl.style.display = 'flex';
        seasonControl.classList.add('is-sticky');
        renderSeason(selectedSeason);
        restoreDetailsEpisodeFocus();
      } catch (err) {
        console.error(err);
        finishEpisodeSkeleton(list);
        perfEnd(perf);
        seasonControl.style.display = 'none';
        list.innerHTML = '<div class="content-state-inner"><div class="content-state-copy">Could not load episodes.</div><button type="button" class="content-state-action" id="retryEpisodes">Try again</button></div>';
        document.getElementById('retryEpisodes')?.addEventListener('click', () => openSeries(preview, sourceElement));
      }

    let detailsDismissPromise = null;

    function reducedMotionActive() {

    const signOut = document.getElementById('signOutBtn');
    const killStreams = document.getElementById('killStreamsBtn');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope:'/' }).catch(() => {});
    }
    try {
      const gate = await (await fetch('/api/site/auth')).json();
      if (gate.authenticated && killStreams) {
        killStreams.style.display = 'inline-flex';
        killStreams.addEventListener('click', async () => {
          if (!confirm('Stop all active streams for this account?')) return;
          try {
            const res = await fetch('/api/v1/playback', { method:'DELETE' });
            const data = await res.json().catch(() => ({}));
            alert('Stopped ' + Number(data.stopped || 0) + ' active stream' + (Number(data.stopped || 0) === 1 ? '.' : 's.'));
          } catch (_) {
            alert('Active streams could not be stopped.');
          }
        });
      }
      if (gate.authenticated && signOut) {
        signOut.style.display = 'inline-flex';
        signOut.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
          location.href = '/login';
        });
      }
      const isAdmin = !!(gate.user && gate.user.role === 'admin');
      currentUserIsAdmin = isAdmin;
      document.querySelectorAll('.admin-only').forEach(el => {
        if (isAdmin) {
          const visibleDisplay = el.classList.contains('control-separator')
            ? 'block'
            : (el.tagName === 'A' ? 'inline-flex' : 'flex');
          el.style.setProperty('display', visibleDisplay, 'important');
        } else {
          el.style.setProperty('display', 'none', 'important');
        }
      });
    } catch (_) {
      document.querySelectorAll('.admin-only').forEach(el => { el.style.display = 'none'; });
    }
  })();
</script>
</body>
</html>
