<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AIOPlay</title>
  <link rel="icon" type="image/webp" href="/aioplay-brand.webp">
  <link rel="apple-touch-icon" href="/aioplay-brand.webp">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(28, 28, 30, 0.4);
      --card-border: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent:#1668ff;
      --accent-cyan:#36d8ff;
      --accent-violet:#7857ff;
      --accent-gradient:linear-gradient(135deg,var(--accent-cyan) 0%,var(--accent) 48%,var(--accent-violet) 100%);
      --accent-glow:rgba(22,104,255,.32);
      --glass:rgba(15,15,17,.7);
    }
    * { box-sizing:border-box; }
    html {
      min-height:100%;
      min-height:100dvh;
      background-color:#414a7f;
      background-image:
        linear-gradient(
          135deg,
          #355f7f 0%,
          #2f4d7f 48%,
          #414a7f 100%
        );
      background-repeat:no-repeat;
      background-size:100% 100%;
    }
    body {
      font-family:'Inter',sans-serif;
      background:transparent;
      color:var(--text);
      margin:0;
      padding:0 0 env(safe-area-inset-bottom, 0px);
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
    }
    .top-header {
      position:relative;
      z-index:40;
      padding:16px 20px 9px;
      background:rgba(9,9,11,.34);
      backdrop-filter:blur(12px);
    }
    header {
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(15,15,17,.46);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      padding:7px 20px;
      border-top:1px solid rgba(255,255,255,.025);
      border-bottom:1px solid rgba(255,255,255,.035);
      box-shadow:none;
    }
    .header-row {
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      width:100%;
      max-width:1180px;
      margin:0 auto;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .admin-only { display:none !important; }
    .brand { display: flex; align-items: center; }
    .brand img { width: 48px; height: 48px; border-radius: 11px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 12px rgba(22, 104, 255, 0.3); }
    .header-search {
      width: 100%; min-width: 0; max-width: none;
      padding: 11px 18px; border-radius: 30px; font-family: 'Inter', sans-serif;
      font-size: 14px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border); color: #fff; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .header-search::placeholder { color: var(--text-muted); }
    .header-search:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
    .control-bar {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      margin:0 auto;
      width:100%;
      max-width:1180px;
      min-height:34px;
      flex-wrap:nowrap;
      overflow:visible;
    }
    .admin-toolbar { display:flex; justify-content:center; align-items:center; gap:6px; margin:0; flex-wrap:nowrap; }
    .admin-toolbar a {
      min-height:34px;
    }
    .admin-toolbar .admin-action {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 12px !important;
      border-radius:18px !important;
      color:#eef5ff !important;
      background:
        linear-gradient(rgba(19,19,25,.94),rgba(19,19,25,.94)) padding-box,
        var(--accent-gradient) border-box !important;
      border:2px solid transparent !important;
      box-shadow:none !important;
      font-size:13px;
      line-height:1;
    }
    .admin-toolbar .admin-action:hover,
    .admin-toolbar .admin-action:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box !important;
      color:#fff !important;
      outline:none;
    }
    .admin-icon-button {
      display:grid !important;
      place-items:center;
      width:34px;
      height:34px;
      min-height:34px !important;
      padding:0 !important;
      line-height:0;
      flex:0 0 34px;
      color:#eef5ff !important;
      background:
        linear-gradient(rgba(19,19,25,.94),rgba(19,19,25,.94)) padding-box,
        var(--accent-gradient) border-box !important;
      border:2px solid transparent !important;
    }
    .admin-icon-button svg {
      display:block;
      width:17px;
      height:17px;
      margin:0;
      transform:none;
    }
    .control-separator {
      width:1px;
      height:24px;
      flex:0 0 1px;
      background:linear-gradient(to bottom, transparent, rgba(255,255,255,.28), transparent);
      margin:0 2px;
    }
    .catalog-rail {
      width:100%;
      max-width:1180px;
      margin:6px auto 0;
      min-width:0;
    }
    .catalog-rail.is-empty {
      display:none;
      margin:0;
    }
    main { padding:14px 20px 40px; max-width:1180px; margin:0 auto; }
    
    .mode-tabs { display:flex; justify-content:center; align-items:center; gap:6px; margin:0; width:auto; flex-wrap:nowrap; }
    .mode-tab {
      padding:7px 16px; min-height:34px; border-radius:20px;
      background:
        linear-gradient(rgba(31,31,37,.96),rgba(31,31,37,.96)) padding-box,
        var(--accent-gradient) border-box;
      border:2px solid transparent;
      color:#eef3ff; cursor:pointer; font-weight:700; white-space:nowrap;
      font-size:13px; line-height:1; transition:filter .16s,transform .16s,color .16s;
    }
    .mode-tab:hover, .mode-tab:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; outline:none; filter:brightness(1.06);
    }
    .mode-tab.active {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; border-color:transparent; box-shadow:0 4px 18px rgba(22,104,255,.2);
    }
    .player-select {
      display:none;
      height:34px;
      min-height:34px;
      min-width:0;
      max-width:118px;
      padding:0 24px 0 10px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.18);
      background:#141418;
      color:#e8e8ec;
      font-family:'Inter',sans-serif;
      font-size:12px;
      font-weight:700;
      line-height:normal;
      outline:none;
      cursor:pointer;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .player-select option { color:#e8e8ec; background:#141418; font:inherit; }
    .player-select:focus { border-color:var(--accent); }
    .player-choice-overlay {
      display:none;
      position:fixed;
      inset:0;
      z-index:130;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(12px);
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .player-choice-sheet {
      width:min(430px,100%);
      background:#15151a;
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      padding:22px;
      box-shadow:0 24px 70px rgba(0,0,0,.55);
    }
    .player-choice-sheet h3 { margin:0 0 6px; font:800 22px/1.2 'Outfit',sans-serif; }
    .player-choice-sheet p { margin:0 0 16px; color:var(--text-muted); font-size:13px; }
    .player-choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .player-choice-grid button {
      min-height:46px;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
    .player-choice-grid button:hover { border-color:var(--accent); background:rgba(22,104,255,.16); }
    .player-choice-grid .wide { grid-column:1/-1; }
    .tabs {
      display:flex; gap:10px; margin:0; overflow-x:auto; overflow-y:hidden;
      padding:2px 0 3px; white-space:nowrap; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; overscroll-behavior-inline:contain;
      scroll-padding-inline:16px;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      padding:10px 20px; border-radius:20px;
      background:
        linear-gradient(rgba(31,31,37,.96),rgba(31,31,37,.96)) padding-box,
        var(--accent-gradient) border-box;
      border:2px solid transparent; color:#eef3ff; cursor:pointer; font-weight:700;
      transition:filter .16s,transform .16s,color .16s; white-space:nowrap;
    }
    .tab:hover, .tab:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; outline:none; filter:brightness(1.06);
    }
    .tab.active {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; border-color:transparent; box-shadow:0 4px 18px rgba(22,104,255,.2);
    }
    
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; width:100%; }
    .content-state {
      grid-column:1 / -1;
      min-height:calc(100dvh - 245px);
      display:grid;
      place-items:center;
      padding:28px 20px 90px;
      text-align:center;
      color:var(--text-muted);
      font:600 1.5rem/1.35 'Inter',sans-serif;
      letter-spacing:-.01em;
    }
    .content-state.error { color:#d6e3ff; }
    @supports not (height:100dvh) {
      .content-state { min-height:calc(100vh - 245px); }
    }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow); z-index: 10; }
    .poster-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
    .vod-card {
      background:transparent; border:0; border-radius:0; overflow:visible;
      display:flex; flex-direction:column; gap:8px;
    }
    .vod-card:hover { transform:none; box-shadow:none; border-color:transparent; }
    .vod-card .poster-container {
      aspect-ratio:2/3; border-radius:12px; border:3px solid transparent;
      background:var(--card-bg); box-shadow:0 7px 20px rgba(0,0,0,.24);
      transition:border-color .16s, transform .16s, box-shadow .16s;
    }
    .vod-card:hover .poster-container, .vod-card:focus-visible .poster-container {
      border-color:var(--accent); transform:scale(1.02);
      box-shadow:0 10px 28px rgba(0,0,0,.38);
    }
    .vod-card:hover .poster { transform:none; }
    .vod-card:focus-visible { outline:none; }
    .vod-card .background { display:none; }
    .vod-card .poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; padding:0; }
    .vod-card .info {
      position:static; padding:0 3px; background:none; min-height:38px;
    }
    .vod-card:hover .info { padding:0 3px; }
    .vod-card .desc { display:block; margin-top:3px; font-size:.74rem; color:var(--text-muted); line-height:1.25; }
    .vod-card .title {
      font-size:1rem; margin:0; color:var(--text); text-shadow:none;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;
    }
    .progress-track { width:100%; height:3px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12); margin-top:6px; }
    .progress-fill { height:100%; background:var(--accent); border-radius:inherit; }
    .background { width: 100%; height: 100%; object-fit: cover; filter: blur(20px) brightness(0.5); transform: scale(1.2); transition: all 0.4s; }
    .card:hover .background { filter: blur(15px) brightness(0.7); transform: scale(1.1); }
    .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; padding: 10px; transition: transform 0.4s; }
    .card:hover .poster { transform: scale(1.05); }
    .logo { position: absolute; top: 15px; left: 15px; width: 48px; height: 48px; z-index: 3; border-radius: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); object-fit: contain; padding: 6px; border: 1px solid rgba(255,255,255,0.1); }
    .live-badge { position: absolute; top: 15px; right: 15px; z-index: 3; background: var(--accent); color: white; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(22, 104, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0); } }
    .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 20px 20px 20px; z-index: 3; background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 60%, transparent 100%); transition: all 0.4s; }
    .card:hover .info { padding-bottom: 25px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .desc { font-size: 0.85rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    
    #player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 100; flex-direction: column; }
    .player-brand { position:absolute; top:24px; left:28px; z-index:102; display:flex; align-items:center; gap:10px; padding:7px 12px 7px 8px; border-radius:14px; background:rgba(8,10,18,.58); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(14px); font:800 15px/1 'Outfit',sans-serif; letter-spacing:.01em; box-shadow:0 8px 28px rgba(0,0,0,.28); pointer-events:none; }
    .player-brand img { width:32px; height:32px; border-radius:8px; display:block; }
    .player-brand span { background:linear-gradient(90deg,#fff 10%,#36d8ff 62%,#7857ff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #close-btn { position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 30px; cursor: pointer; z-index: 101; font-weight: 600; }
    #video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    video { width: 100%; max-width: 1400px; max-height: 85vh; border-radius: 16px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }    
    .loader { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    #playback-message { display:none; position:absolute; max-width:520px; padding:20px 24px; text-align:center; color:var(--text-muted); }
    #playback-message strong { display:block; color:var(--text); font-size:1.05rem; margin-bottom:6px; }
    body.details-open > .top-header,
    body.details-open > header,
    body.details-open > main {
      opacity:.28;
      transition:opacity .22s cubic-bezier(.2,.72,.22,1);
    }
    #details-overlay {
      display:none;
      position:fixed;
      inset:0;
      z-index:90;
      min-height:100dvh;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      overflow:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding:48px 20px calc(48px + env(safe-area-inset-bottom, 0px));
      opacity:1;
      transition:opacity .16s cubic-bezier(.22,.68,.24,1);
    }
    #details-overlay.details-fading {
      opacity:0;
      pointer-events:none;
    }
    #details-overlay.details-fading .details-shell {
      transform:translate3d(0,0,0);
    }
    .details-shell {
      position:relative;
      isolation:isolate;
      overflow:hidden;
      max-width:1050px;
      margin:0 auto;
      background:rgba(18,18,22,.985);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:24px;
      box-shadow:0 24px 80px rgba(0,0,0,.42);
      transform:translate3d(0,0,0);
      transition:transform .18s ease,opacity .18s ease;
    }
    .details-shell.details-dragging {
      transition:none !important;
      will-change:transform;
    }
    .details-shell.details-snap-back {
      transition:transform .18s cubic-bezier(.22,.72,.26,1) !important;
    }
    .details-shell.details-dismissing {
      transition:
        transform .16s cubic-bezier(.35,.02,.72,.24),
        opacity .16s ease !important;
      transform:translate3d(0,18vh,0) !important;
      opacity:.72;
    }
    .details-shell > :not(.details-backdrop) {
      position:relative;
      z-index:1;
    }
    .details-backdrop {
      position:absolute;
      inset:0;
      z-index:0;
      opacity:0;
      background-position:center 24%;
      background-size:cover;
      background-repeat:no-repeat;
      filter:saturate(.82) contrast(1.04);
      transform:scale(1.025);
      transition:opacity .24s ease;
      pointer-events:none;
    }
    .details-backdrop.is-visible { opacity:.76; }
    .details-backdrop.poster-fallback {
      background-position:center 30%;
      filter:blur(7px) saturate(.74) brightness(.92);
      transform:scale(1.08);
    }
    .details-backdrop::after {
      content:'';
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg,rgba(8,11,15,.92) 0%,rgba(8,11,15,.74) 42%,rgba(8,11,15,.58) 100%),
        linear-gradient(180deg,rgba(8,11,15,.18) 0%,rgba(8,11,15,.62) 56%,rgba(8,11,15,.96) 100%);
    }
    .details-head {
      display:grid;
      grid-template-columns:180px minmax(0,1fr) auto;
      gap:24px;
      align-items:start;
    }
    .details-copy { min-width:0; }
    .details-hero-action {
      min-width:104px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      padding-top:54px;
    }
    .details-hero-action[hidden] { display:none !important; }
    .details-play-orb {
      position:relative;
      width:70px;
      height:70px;
      padding:0;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      cursor:pointer;
      overflow:visible;
      background:transparent url('assets/aioplay-movie-play-orb.png') center/contain no-repeat;
      box-shadow:none;
      transition:transform .15s ease,filter .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .details-play-orb::before,
    .details-play-orb::after { content:none; }
    .details-play-orb svg { display:none; }
    .details-play-orb:hover,
    .details-play-orb:focus-visible {
      outline:none;
      transform:scale(1.045);
      filter:brightness(1.06) saturate(1.04) drop-shadow(0 0 9px rgba(17,226,172,.24));
    }
    .details-play-orb:active {
      transform:scale(.965);
      filter:brightness(.97);
    }
        .details-play-label {
      color:rgba(245,248,246,.86);
      font:800 .70rem/1 'Inter',sans-serif;
      letter-spacing:.02em;
      text-align:center;
    }
    .details-poster {
      width:180px;
      aspect-ratio:2/3;
      object-fit:cover;
      border-radius:12px;
      background:#202027;
    }
    .details-title-art {
      display:block;
      width:min(360px,72%);
      max-width:100%;
      height:auto;
      max-height:82px;
      object-fit:contain;
      object-position:left center;
      margin:0 0 12px;
      background:transparent;
      border-radius:0;
      filter:drop-shadow(0 8px 22px rgba(0,0,0,.34));
    }
    .details-title-art[hidden] { display:none !important; }
    .details-head h2 { margin:0 0 10px; font:800 28px/1.15 'Outfit',sans-serif; }
    .details-copy.has-title-art h2 {
      font-size:20px;
      line-height:1.2;
      color:rgba(245,247,248,.84);
      margin-bottom:10px;
    }
    .details-head p { color:var(--text-muted); margin:0; white-space:pre-line; }
    .details-close { float:right; background:#292930; color:#fff; border:0; border-radius:10px; padding:9px 13px; cursor:pointer; }
    .season-control { display:none; margin-top:22px; align-items:center; gap:10px; }
    .season-control label { color:var(--text-muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .season-select {
      min-height:38px;
      padding:0 34px 0 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:#1c1c22;
      color:#fff;
      font-family:'Inter',sans-serif;
      font-size:13px;
      font-weight:700;
      line-height:normal;
      outline:none;
    }
    .season-select:focus { border-color:var(--accent); }
    .episode-list {
      margin-top:14px;
      display:flex;
      gap:12px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:3px 2px 9px;
      scroll-snap-type:x proximity;
      scroll-padding-inline:2px;
      overscroll-behavior-inline:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      touch-action:pan-x pan-y;
    }
    .episode-list::-webkit-scrollbar { display:none; }

    .episode-btn {
      flex:0 0 clamp(220px,31vw,290px);
      min-width:0;
      padding:0;
      overflow:hidden;
      scroll-snap-align:start;
      text-align:left;

  <script>
    let hls = null;
    let bootstrap = null;
    let currentItems = [];
    let currentMode = 'sports';
    let currentVodType = '';
    let currentPlaybackSession = null;
    let playbackHeartbeatTimer = null;
    let currentPlaybackKind = 'sport_event';
    let playbackGeneration = 0;
    let requestingFallback = false;
    let pendingVodPlayback = null;
    let searchTimer = null;
    let gridTransitionTimer = null;
    let currentProgressContext = null;
    let lastProgressSyncAt = 0;
    let sharedProgressItems = [];
    let currentPlaybackMeta = null;
    let heroTimer = null;
    let heroPrefetchTimer = null;
    let playerHudTimer = null;
    let lastActiveCard = null;
    let currentCatalogState = null;
    let currentDetailsMeta = null;
    let currentNextEpisode = null;
    let playerReturnToDetails = false;
    let restoringUiState = false;
    let longPressTimer = null;
    let heroRenderToken = 0;
    let searchType = '';
    let currentDetailsEpisodeId = '';
    let currentDetailsSeason = null;
    let detailsBackdropToken = 0;
    const longPressedCards = new WeakSet();
    const vodMetaCache = new Map();
    const visibleMetadataObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => {
          entries.forEach(async entry => {
            if (!entry.isIntersecting) return;
            const card = entry.target;
            visibleMetadataObserver.unobserve(card);
            const meta = card._aioplayMeta;
            if (!meta || currentMode === 'sports') return;
            const full = await loadMetaFor(meta);
            if (full && document.body.contains(card)) {
              hydrateCardMetadata(card, { ...meta, ...full });
            }
          });
        }, { rootMargin:'220px 0px' })
      : null;
    const UI_STATE_KEY = 'aioplay.webUiState.v2';
    const RECENT_SEARCHES_KEY = 'aioplay.recentSearches.v1';
    const MOTION_KEY = 'aioplay.reducedMotion';

    const grid = () => document.getElementById('grid');
    const tabs = () => document.getElementById('tabs');
    const VOD_PLAYER_KEY = 'aioplay.vodPlayer';
    const STREXO_TEMPLATE_KEY = 'aioplay.strexoTemplate';
    const CUSTOM_TEMPLATE_KEY = 'aioplay.customPlayerTemplate';

    function setCatalogRailVisible(visible) {
      const rail = document.querySelector('.catalog-rail');
      if (!rail) return;
      rail.classList.toggle('is-empty', !visible);
    }

    function setGridState(message, error = false, retry = null) {
      const host = grid();
      host.className = 'grid';
      host.innerHTML = '';

      const state = document.createElement('div');
      state.className = 'content-state' + (error ? ' error' : '');

      const inner = document.createElement('div');
      inner.className = 'content-state-inner';

      const brand = document.createElement('img');
      brand.className = 'content-state-brand';
      brand.src = '/aioplay-brand.webp';
      brand.alt = '';

      const title = document.createElement('div');
      title.className = 'content-state-title';
      title.textContent = error ? 'AIOPlay hit a problem' : 'AIOPlay';

      const copy = document.createElement('div');
      copy.className = 'content-state-copy';
      copy.textContent = message;

      inner.append(brand, title, copy);
      if (typeof retry === 'function') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'content-state-action';
        button.textContent = 'Try again';
        button.onclick = retry;
        inner.appendChild(button);
      }
      state.appendChild(inner);
      host.appendChild(state);
    }

    function showGridSkeleton({ posterMode = true, count = null } = {}) {
      const host = grid();
      host.innerHTML = '';
      host.className = 'grid ' + (posterMode ? 'vod-grid' : 'live-grid') + ' is-entering';
      const desired = count || (posterMode ? 12 : 8);
      for (let i = 0; i < desired; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        const poster = document.createElement('div');
        poster.className = 'skeleton-poster';
        const line = document.createElement('div');
        line.className = 'skeleton-line';
        const shortLine = document.createElement('div');
        shortLine.className = 'skeleton-line short';
        card.append(poster, line, shortLine);
        host.appendChild(card);
      }
    }

    function beginGridTransition({ posterMode = true } = {}) {
      const host = grid();
      clearTimeout(gridTransitionTimer);
      if (host.querySelector('.skeleton-card')) return;

      if (host.children.length && !host.querySelector('.content-state')) {
        host.classList.add('is-transitioning');
        gridTransitionTimer = setTimeout(() => {
          gridTransitionTimer = null;
          showGridSkeleton({ posterMode });
        }, 90);
      } else {
        showGridSkeleton({ posterMode });
      }
    }

    function finishGridTransition() {
      clearTimeout(gridTransitionTimer);
      gridTransitionTimer = null;
      const host = grid();
      host.classList.remove('is-transitioning');
      host.classList.add('is-entering');
      setTimeout(() => host.classList.remove('is-entering'), 260);
    }

    function vodPlayerPreference() {
      const value = localStorage.getItem(VOD_PLAYER_KEY) || 'internal';
      return ['internal', 'ask', 'vlc', 'outplayer', 'strexo', 'custom'].includes(value)
        ? value
        : 'internal';
    }

    function ensurePlayerTemplate(kind) {
      const key = kind === 'strexo' ? STREXO_TEMPLATE_KEY : CUSTOM_TEMPLATE_KEY;
      const existing = localStorage.getItem(key);
      if (existing && existing.includes('{url}')) return existing;
      const label = kind === 'strexo' ? 'Strexo' : 'custom player';
      const suggested = kind === 'strexo' ? 'strexo://play?url={url}' : 'player://play?url={url}';
      const value = window.prompt(
        'Enter the ' + label + ' URL template. Use {url} where the encoded playback URL should go.',
        suggested
      );
      if (!value || !value.includes('{url}')) return '';
      localStorage.setItem(key, value.trim());
      return value.trim();
    }

    function initVodPlayerControl() {
      const select = document.getElementById('vodPlayerSelect');
      if (!select) return;
      select.value = vodPlayerPreference();
      select.addEventListener('change', () => {
        let value = select.value;
        if ((value === 'strexo' || value === 'custom') && !ensurePlayerTemplate(value)) {
          value = 'ask';
          select.value = value;
        }
        localStorage.setItem(VOD_PLAYER_KEY, value);
      });
    }

    function buildExternalPlayerUrl(kind, streamUrl) {
      const encoded = encodeURIComponent(streamUrl);
      if (kind === 'vlc') {
        return 'vlc-x-callback://x-callback-url/stream?url=' + encoded;
      }
      if (kind === 'outplayer') {
        return 'outplayer://x-callback-url/play?url=' + encoded;
      }
      if (kind === 'strexo' || kind === 'custom') {
        const template = ensurePlayerTemplate(kind);
        if (!template) return '';
        return template
          .replaceAll('{url}', encoded)
          .replaceAll('{rawUrl}', streamUrl);
      }
      return streamUrl;
    }

    function triggerExternalPlayer(kind, streamUrl) {
      const playerUrl = buildExternalPlayerUrl(kind, streamUrl);
      if (!playerUrl) return false;
      const anchor = document.createElement('a');
      anchor.href = playerUrl;
      anchor.rel = 'noopener';
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      return true;
    }

    function setVodPlayerControlsVisible(visible) {
      document.querySelectorAll('.vod-player-control').forEach(el => {
        el.style.display = visible ? 'block' : 'none';
      });
    }

    function applyMotionPreference() {
      const stored = localStorage.getItem(MOTION_KEY);
      const systemReduce = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;
      const reduced = stored === 'reduce' || (stored == null && systemReduce);
      const forcedFull = stored === 'full';

      document.documentElement.classList.toggle('reduce-motion', reduced);
      document.documentElement.classList.toggle('force-motion', forcedFull);

      const button = document.getElementById('motionToggle');
      if (button) {
        button.setAttribute('aria-pressed', reduced ? 'true' : 'false');
        button.title = reduced ? 'Reduced motion on' : 'Reduced motion off';
      }
      if (reduced) stopHeroPreview();
    }

    function toggleMotionPreference() {
      const currentlyReduced = document.documentElement.classList.contains('reduce-motion');
      localStorage.setItem(MOTION_KEY, currentlyReduced ? 'full' : 'reduce');
      applyMotionPreference();
    }

    function initDetailsSwipeDismiss() {
      const overlay = document.getElementById('details-overlay');
      const shell = overlay?.querySelector('.details-shell');
      if (!overlay || !shell || shell.dataset.swipeDismissReady === '1') return;
      shell.dataset.swipeDismissReady = '1';

      let tracking = false;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let startAt = 0;

      const resetVisual = () => {
        shell.classList.remove('details-dragging', 'details-dismissing');
        shell.classList.add('details-snap-back');
        shell.style.transform = 'translate3d(0,0,0)';
        shell.style.opacity = '';
        setTimeout(() => shell.classList.remove('details-snap-back'), 190);
      };

      shell.addEventListener('touchstart', event => {
        if (overlay.style.display !== 'block') return;
        if (overlay.scrollTop > 2) return;
        if (event.touches.length !== 1) return;

        // Don't steal horizontal episode swipes or interactions with controls.
        if (event.target.closest?.('button,select,input,textarea,a,.episode-list')) return;

        const touch = event.touches[0];
        tracking = true;
        dragging = false;
        startX = touch.clientX;
        startY = touch.clientY;
        lastY = startY;
        startAt = performance.now();
        shell.classList.remove('details-snap-back', 'details-dismissing');
      }, { passive:true });

      shell.addEventListener('touchmove', event => {
        if (!tracking || event.touches.length !== 1) return;

        const touch = event.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        lastY = touch.clientY;

        if (!dragging) {
          if (dy < 8) {
            if (dy < -6) tracking = false;
            return;
          }
          if (Math.abs(dx) > Math.abs(dy) * .72) {
            tracking = false;
            return;
          }
          if (overlay.scrollTop > 2) {
            tracking = false;
            return;
          }
          dragging = true;
          shell.classList.add('details-dragging');
        }

        // Once this is clearly a downward sheet gesture, keep Safari from
        // rubber-banding the page underneath it.
        event.preventDefault();
        const translated = Math.min(260, Math.max(0, dy * .72));
        shell.style.transform = 'translate3d(0,' + translated + 'px,0)';
      }, { passive:false });

      const finish = cancelled => {
        if (!tracking && !dragging) return;

        const elapsed = Math.max(1, performance.now() - startAt);
        const dy = Math.max(0, lastY - startY);
        const velocity = dy / elapsed;
        const shouldDismiss = !cancelled && dragging && (dy >= 105 || velocity >= .62);

        tracking = false;

        if (!dragging) return;
        dragging = false;
        shell.classList.remove('details-dragging');

        if (!shouldDismiss) {
          resetVisual();
          return;
        }

        shell.style.transform = 'translate3d(0,' + Math.min(180, dy * .72) + 'px,0)';
        closeDetailsFromUi();
      };

      shell.addEventListener('touchend', () => finish(false), { passive:true });
      shell.addEventListener('touchcancel', () => finish(true), { passive:true });

      overlay.addEventListener('click', event => {
        if (event.target === overlay) {
          closeDetailsFromUi();
        }
      });
    }

    function initCatalogRailGestures() {
      const rail = tabs();
      if (!rail || rail.dataset.gesturesReady === '1') return;
      rail.dataset.gesturesReady = '1';

      let dragging = false;
      let moved = false;
      let startX = 0;
      let startScroll = 0;
      rail.addEventListener('pointerdown', event => {
        if (event.pointerType === 'touch') return;
        dragging = true;
        moved = false;
        startX = event.clientX;
        startScroll = rail.scrollLeft;
        rail.classList.add('is-dragging');
        rail.setPointerCapture?.(event.pointerId);
      });
      rail.addEventListener('pointermove', event => {
        if (!dragging) return;
        const delta = event.clientX - startX;
        if (Math.abs(delta) > 5) moved = true;
        rail.scrollLeft = startScroll - delta;
      });
      const stop = event => {
        dragging = false;
        rail.classList.remove('is-dragging');
        try { rail.releasePointerCapture?.(event.pointerId); } catch (_) {}
      };
      rail.addEventListener('pointerup', stop);
      rail.addEventListener('pointercancel', stop);
      rail.addEventListener('click', event => {
        if (!moved) return;
        moved = false;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
      rail.addEventListener('wheel', event => {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        if (rail.scrollWidth <= rail.clientWidth) return;
        event.preventDefault();
        rail.scrollLeft += event.deltaY;
      }, { passive:false });
    }

    function updateMobileBottomNavState() {
      const nav = document.getElementById('mobileBottomNav');
      if (!nav) return;

      const search = document.getElementById('searchInput');
      const searchActive = !!(
        search &&
        (document.activeElement === search || search.value.trim())
      );

      nav.querySelectorAll('[data-mobile-mode]').forEach(button => {
        button.classList.toggle(
          'active',
          !searchActive && button.dataset.mobileMode === currentMode
        );
      });

      const searchButton = document.getElementById('mobileSearchNav');
      if (searchButton) searchButton.classList.toggle('active', searchActive);
    }

    function configureMobileBottomNav() {
      const nav = document.getElementById('mobileBottomNav');
      if (!nav || nav.dataset.ready === '1') {
        updateMobileBottomNavState();
        return;
      }
      nav.dataset.ready = '1';

      const sportsEnabled = !!bootstrap?.services?.sports?.enabled;
      const vodEnabled = !!bootstrap?.services?.vod?.enabled;
      const continueEnabled = !!(vodEnabled && bootstrap?.accountUser);

      const visibility = {
        sports:sportsEnabled,
        vod:vodEnabled,
        continue:continueEnabled
      };
      nav.querySelectorAll('[data-mobile-mode]').forEach(button => {
        button.hidden = !visibility[button.dataset.mobileMode];
        button.addEventListener('click', async () => {
          const mode = button.dataset.mobileMode;
          document.body.classList.remove('mobile-header-collapsed');

          if (currentMode === mode) {
            window.scrollTo({
              top:0,
              behavior:reducedMotionActive() ? 'auto' : 'smooth'
            });
            updateMobileBottomNavState();
            return;
          }
          await loadMode(mode, { push:true });
          window.scrollTo({ top:0, behavior:'auto' });
          updateMobileBottomNavState();
        });
      });

      const searchButton = document.getElementById('mobileSearchNav');
      if (searchButton) {
        searchButton.hidden = !vodEnabled;
        searchButton.addEventListener('click', async () => {
          document.body.classList.remove('mobile-header-collapsed');
          if (currentMode !== 'vod' && vodEnabled) {
            await loadMode('vod', { push:true });
          }
          window.scrollTo({
            top:0,
            behavior:reducedMotionActive() ? 'auto' : 'smooth'
          });
          setTimeout(() => {
            document.getElementById('searchInput')?.focus();
            updateMobileBottomNavState();
          }, reducedMotionActive() ? 0 : 180);
        });
      }

      const search = document.getElementById('searchInput');
      search?.addEventListener('focus', updateMobileBottomNavState);
      search?.addEventListener('blur', () =>
        setTimeout(updateMobileBottomNavState, 0)
      );
      search?.addEventListener('input', updateMobileBottomNavState);
      updateMobileBottomNavState();
    }

    function initMobileScrollNavigation() {
      if (document.body.dataset.mobileScrollNavReady === '1') return;
      document.body.dataset.mobileScrollNavReady = '1';

      let lastY = Math.max(0, window.scrollY || 0);
      let ticking = false;

      const apply = () => {
        ticking = false;
        if (!window.matchMedia?.('(max-width:650px)')?.matches) {
          document.body.classList.remove('mobile-header-collapsed');
          lastY = Math.max(0, window.scrollY || 0);
          return;
        }

        const y = Math.max(0, window.scrollY || 0);
        const delta = y - lastY;
        const searchFocused = document.activeElement === document.getElementById('searchInput');
        const overlayOpen =
          document.getElementById('details-overlay')?.style.display === 'block' ||
          document.getElementById('player-overlay')?.style.display === 'flex';

        if (y < 72 || searchFocused || overlayOpen) {
          document.body.classList.remove('mobile-header-collapsed');
        } else if (delta > 10 && y > 120) {
          document.body.classList.add('mobile-header-collapsed');
        } else if (delta < -8) {
          document.body.classList.remove('mobile-header-collapsed');
        }

        lastY = y;
      };

      window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(apply);
      }, { passive:true });

      window.addEventListener('resize', apply, { passive:true });
    }

    function safeImageUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const u = new URL(raw, location.origin);
        return ['http:', 'https:'].includes(u.protocol) ? u.toString() : '';
      } catch (_) {
        return '';
      }
    }

    function normalizedVodType(meta) {
      const raw = String(meta?.type || currentVodType || '').toLowerCase();
      if (raw === 'series' || raw === 'tv' || raw === 'episode') return 'series';
      if (raw === 'movie') return 'movie';
      return '';
    }

    function vodMetaTarget(meta) {
      const type = normalizedVodType(meta);
      if (!type) return null;
      const id = type === 'series'
        ? (
            meta?._progress?.contentId ||
            meta?.parentId ||
            meta?.contentId ||
            meta?.id
          )
        : (meta?.contentId || meta?.id);
      return id ? { type, id:String(id) } : null;
    }

    function heroLabels(meta) {
      const labels = [];
      if (currentMode === 'sports') {
        labels.push('LIVE');
      } else if (meta?._progress && meta._progress.season != null && meta._progress.episode != null) {
        labels.push(
          'S' + String(meta._progress.season).padStart(2, '0') +
          'E' + String(meta._progress.episode).padStart(2, '0')
        );
      } else {
        const release = meta?.releaseInfo || meta?.year;
        if (release) labels.push(String(release));
        const rating = Number(meta?.imdbRating ?? meta?.rating);
        if (Number.isFinite(rating) && rating > 0) labels.push('★ ' + rating.toFixed(1));
        if (meta?.runtime) labels.push(String(meta.runtime));
        const genres = Array.isArray(meta?.genres) ? meta.genres : [];
        labels.push(...genres.filter(Boolean).slice(0, 2).map(String));
      }
      return labels.slice(0, 5);
    }

    function directPreviewUrl(meta) {
      const candidates = [
        meta?.preview,
        meta?.previewUrl,
        meta?.trailer,
        ...(Array.isArray(meta?.trailers)
          ? meta.trailers.flatMap(row =>
              typeof row === 'string'
                ? [row]
                : [row?.url, row?.source, row?.video].filter(Boolean)
            )
          : [])
      ].map(safeImageUrl).filter(Boolean);

      return candidates.find(url => /\.(?:mp4|webm|ogg)(?:$|[?#])/i.test(url)) || '';
    }

    function stopHeroPreview() {
      const preview = document.getElementById('appHeroPreview');
      if (!preview) return;
      preview.classList.remove('is-visible');
      try { preview.pause(); } catch (_) {}
      preview.removeAttribute('src');
      preview.load();
    }

    function updateHero(meta) {
      if (!meta) return;
      const hero = document.getElementById('appHero');
      if (!hero) return;
      const token = ++heroRenderToken;
      const artwork = safeImageUrl(meta.background || meta.backdrop || meta.poster);
      if (!artwork) {
        hero.style.backgroundImage = '';
        hero.classList.remove('is-visible');
        stopHeroPreview();
        return;
      }

      const preload = new Image();
      preload.onload = () => {
        if (token !== heroRenderToken) return;
        hero.style.backgroundImage = 'url("' + artwork.replace(/"/g, '%22') + '")';
        hero.classList.add('is-visible');
      };
      preload.src = artwork;

      stopHeroPreview();
      const previewUrl = directPreviewUrl(meta);
      if (previewUrl && !document.documentElement.classList.contains('reduce-motion')) {
        setTimeout(() => {
          if (token !== heroRenderToken) return;
          const preview = document.getElementById('appHeroPreview');
          if (!preview) return;
          preview.src = previewUrl;
          preview.play().then(() => preview.classList.add('is-visible')).catch(() => {});
        }, 850);
      }
    }

    function scheduleHero(meta) {
      clearTimeout(heroTimer);
      clearTimeout(heroPrefetchTimer);

      const coarseLive = currentMode === 'sports' &&
        window.matchMedia?.('(hover:none), (pointer:coarse)')?.matches === true;
      if (coarseLive) return;

      heroTimer = setTimeout(() => updateHero(meta), 150);

      const target = vodMetaTarget(meta);
      if (!target || currentMode === 'sports') return;
      heroPrefetchTimer = setTimeout(async () => {
        const full = await loadMetaFor(meta);
        if (!full) return;
        if (lastActiveCard?.dataset?.contentId === String(meta.id || '')) {
          const merged = { ...meta, ...full };
          updateHero(merged);
          hydrateCardMetadata(lastActiveCard, merged);
        }
      }, 360);
    }

    function rememberCard(card, meta) {
      lastActiveCard = card;
      card.dataset.contentId = String(meta?.id || '');
      scheduleHero(meta);
    }

    function restoreLastCardFocus() {
      requestAnimationFrame(() => {
        if (lastActiveCard && document.body.contains(lastActiveCard)) {
          try { lastActiveCard.focus({ preventScroll: true }); } catch (_) { lastActiveCard.focus(); }
        }
      });
    }

    function cardIdentity(meta) {
      return [
        String(meta?.type || currentVodType || ''),
        String(meta?.id || '')
      ].join('|');
    }

    function cardMetadataLabels(meta) {
      if (!meta) return [];
      if (meta._progress) {
        const row = meta._progress;
        const labels = [];
        if (row.season != null && row.episode != null) {
          labels.push(
            'S' + String(row.season).padStart(2, '0') +
            'E' + String(row.episode).padStart(2, '0')
          );
        }
        const pct = Number(row.progressPercent);
        if (Number.isFinite(pct) && pct > 0 && pct < 90) {
          labels.push(Math.round(pct) + '% watched');
        }
        return labels;
      }
      const labels = [];
      const release = meta.releaseInfo || meta.year;
      if (release) labels.push(String(release));
      const rating = Number(meta.imdbRating ?? meta.rating);
      if (Number.isFinite(rating) && rating > 0) labels.push('★ ' + rating.toFixed(1));
      if (meta.runtime) labels.push(String(meta.runtime));
      const genres = Array.isArray(meta.genres) ? meta.genres : [];
      labels.push(...genres.filter(Boolean).slice(0, 2).map(String));
      return labels.slice(0, 5);
    }

    function hydrateCardMetadata(card, meta) {
      if (!card || !meta) return;
      const line = card.querySelector('.card-meta-line');
      if (line) {
        line.innerHTML = '';
        cardMetadataLabels(meta).forEach(label => {
          const span = document.createElement('span');
          span.textContent = label;
          line.appendChild(span);
        });
      }
      const desc = card.querySelector('.desc');
      if (desc && !desc.textContent.trim() && meta.description) {
        desc.textContent = String(meta.description);
      }
    }

    function observeCardMetadata(card, meta) {
      if (!card || !meta || currentMode === 'sports') return;
      card._aioplayMeta = meta;
      if (visibleMetadataObserver) {
        visibleMetadataObserver.observe(card);
      } else {
        setTimeout(async () => {
          const full = await loadMetaFor(meta);
          if (full && document.body.contains(card)) {
            hydrateCardMetadata(card, { ...meta, ...full });
          }
        }, 0);
      }
    }

    function continuityLabel(row) {
      if (!row) return '';
      if (row.upNext || row.source === 'aioplay_up_next') {
        const origin = String(row.continuitySource || '');
        if (origin.includes('tv')) return 'Up next · from TV';
        if (origin.includes('web')) return 'Up next · from Web';
        return 'Up next';
      }
      const source = String(row.source || '');
      if (source.includes('tv')) return 'Continue from TV';
      if (source.includes('web')) return 'Continue from Web';
      return 'Continue on AIOPlay';
    }

    function currentUiSnapshot() {
      return {
        mode: currentMode,
        catalog: currentCatalogState,
        search: document.getElementById('searchInput')?.value || '',
        searchType,
        scrollY: Math.max(0, Math.round(window.scrollY || 0)),
        focusedId: lastActiveCard?.dataset?.contentId || '',
        focusedKey: lastActiveCard?.dataset?.contentKey || '',
        updatedAt: Date.now()
      };
    }

    function persistUiState({ push = false, overlay = '' } = {}) {
      if (restoringUiState) return;
      const snapshot = { ...currentUiSnapshot(), overlay };
      try { localStorage.setItem(UI_STATE_KEY, JSON.stringify(snapshot)); } catch (_) {}
      const method = push ? 'pushState' : 'replaceState';
      try { history[method]({ aioplay: snapshot }, '', location.href); } catch (_) {}
    }

    function savedUiState() {
      const fromHistory = history.state && history.state.aioplay;
      if (fromHistory && typeof fromHistory === 'object') return fromHistory;
      try {
        const parsed = JSON.parse(localStorage.getItem(UI_STATE_KEY) || 'null');
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (_) {
        return null;
      }
    }

    function recentSearches() {
      try {
        const parsed = JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY) || '[]');
        return Array.isArray(parsed)
          ? parsed.map(String).map(value => value.trim()).filter(Boolean).slice(0, 6)
          : [];
      } catch (_) {
        return [];
      }
    }

    function rememberSearch(query) {
      const clean = String(query || '').trim();
      if (clean.length < 2) return;
      const values = [clean, ...recentSearches().filter(value =>
        value.toLowerCase() !== clean.toLowerCase()
      )].slice(0, 6);
      try { localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(values)); } catch (_) {}
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const host = document.getElementById('recentSearches');
      if (!host) return;
      host.innerHTML = '';
      const values = recentSearches();
      if (!values.length) return;
      const label = document.createElement('span');
      label.className = 'recent-search-label';
      label.textContent = 'Recent';
      host.appendChild(label);
      values.forEach(value => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'recent-search';
        button.textContent = value;
        button.onclick = () => {
          const input = document.getElementById('searchInput');
          input.value = value;
          applySearch(value);
          input.focus();
        };
        host.appendChild(button);
      });
    }

    function setSearchContextVisible(visible, title = '') {
      const panel = document.getElementById('searchContext');
      if (!panel) return;
      panel.hidden = !visible;
      if (title) document.getElementById('searchContextTitle').textContent = title;
      if (visible) renderRecentSearches();
    }

    function setSearchType(type, { rerun = true } = {}) {
      searchType = ['movie','series'].includes(String(type || '')) ? String(type) : '';
      document.querySelectorAll('.search-filter').forEach(button => {
        button.classList.toggle('active', button.dataset.searchType === searchType);
      });
      if (rerun) {
        const input = document.getElementById('searchInput');
        if (input?.value.trim()) applySearch(input.value);
      }
    }

    function progressMatchScore(meta) {
      const type = String(meta?.type || '').toLowerCase();
      if (type === 'movie') return cachedMovieProgress(meta.id) ? 2 : 0;
      if (type === 'series' || type === 'tv') return cachedSeriesProgress(meta.id) ? 2 : 0;
      return 0;
    }

    function restoreGridPosition(snapshot) {
      if (!snapshot) return;
      requestAnimationFrame(() => {
        const key = String(snapshot.focusedKey || '');
        const id = String(snapshot.focusedId || '');
        const target = [...document.querySelectorAll('.card')].find(card =>
          (key && card.dataset.contentKey === key) ||
          (!key && id && card.dataset.contentId === id)
        );
        if (target) {
          lastActiveCard = target;
          try { target.focus({ preventScroll: true }); } catch (_) {}
        }
        if (Number.isFinite(Number(snapshot.scrollY))) {
          window.scrollTo({ top: Number(snapshot.scrollY), behavior: 'instant' });
        }
      });
    }

    async function withSharedTransition(sourceElement, update, targetElementGetter) {
      const source = sourceElement instanceof Element ? sourceElement : null;
      if (!document.startViewTransition) {
        await update();
        return;
      }

      if (source) source.style.viewTransitionName = 'aioplay-poster';
      let target = null;
      try {
        const transition = document.startViewTransition(async () => {
          await update();
          target = typeof targetElementGetter === 'function'
            ? targetElementGetter()
            : null;
          if (target instanceof Element) {
            target.style.viewTransitionName = 'aioplay-poster';
          }
        });
        await transition.finished.catch(() => {});
      } finally {
        if (source) source.style.viewTransitionName = '';
        if (target instanceof Element) target.style.viewTransitionName = '';
      }
    }

    function hideQuickActions() {
      const menu = document.getElementById('quickActions');
      if (!menu) return;
      menu.hidden = true;
      menu.innerHTML = '';
    }

    async function updateProgressRow(row, progressPercent) {
      if (!bootstrap?.accountUser || !row) return false;
      const next = {
        contentId: row.contentId,
        contentType: row.contentType,
        name: row.name,
        poster: row.poster || null,
        backdrop: row.backdrop || row.background || null,
        logo: row.logo || null,
        videoId: row.videoId || row.contentId,
        season: row.season ?? null,
        episode: row.episode ?? null,
        episodeTitle: row.episodeTitle || null,
        position: progressPercent >= 90 ? Math.max(1, Number(row.duration || 1)) : 0,
        duration: Math.max(1, Number(row.duration || 1)),
        lastWatched: Date.now(),
        progressPercent,
        source: 'aioplay_web'
      };
      const res = await fetch('/api/v1/progress', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ item: next })
      });
      if (!res.ok) return false;
      const key = progressIdentityKey(next);
      const index = sharedProgressItems.findIndex(item => progressIdentityKey(item) === key);
      if (index >= 0) sharedProgressItems[index] = next;
      else sharedProgressItems.unshift(next);
      return true;
    }

    async function loadMetaFor(meta) {
      const target = vodMetaTarget(meta);
      if (!target) return null;
      const key = target.type + '|' + target.id;
      if (vodMetaCache.has(key)) return vodMetaCache.get(key);
      try {
        const res = await fetch(
          '/api/v1/vod/meta/' + encodeURIComponent(target.type) + '/' + encodeURIComponent(target.id)
        );
        const body = await res.json();
        if (!res.ok || !body.meta) return null;
        vodMetaCache.set(key, body.meta);
        return body.meta;
      } catch (_) {
        return null;
      }
    }

    function findNextVideo(meta, row) {
      const videos = Array.isArray(meta?.videos)
        ? [...meta.videos]
            .filter(video => video && video.id)
            .sort((a, b) =>
              (Number(a.season) || 0) - (Number(b.season) || 0) ||
              (Number(a.episode) || 0) - (Number(b.episode) || 0)
            )
        : [];
      if (!videos.length || !row) return null;
      const index = videos.findIndex(video =>
        String(video.id) === String(row.videoId || '') ||
        (
          row.season != null && row.episode != null &&
          Number(video.season) === Number(row.season) &&
          Number(video.episode) === Number(row.episode)
        )
      );
      return index >= 0 ? (videos[index + 1] || null) : null;
    }

    async function quickActionNextEpisode(meta) {
      const row = meta?._progress ||
        cachedSeriesProgress(meta?.parentId || meta?.id) ||
        cachedEpisodeProgress(meta, meta);
      const parentId = row?.contentId || meta?.parentId || meta?.id;
      if (!parentId) return null;
      const seriesPreview = {
        id: parentId,
        type: 'series',
        name: row?.name || meta?.name || 'Series'
      };
      const fullMeta = await loadMetaFor(seriesPreview);
      const next = findNextVideo(fullMeta, row);
      if (!fullMeta || !next) return null;
      return {
        meta: fullMeta,
        video: next,
        progress: progressContextForEpisode(fullMeta, next)
      };
    }

    function positionQuickActions(anchor, menu) {
      const rect = anchor.getBoundingClientRect();
      const width = 210;
      const left = Math.min(
        window.innerWidth - width - 10,
        Math.max(10, rect.right - width)
      );
      const top = Math.min(
        window.innerHeight - 260,
        Math.max(10, rect.bottom + 6)
      );
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    async function showQuickActions(anchor, meta) {
      if (currentMode === 'sports') return;
      const menu = document.getElementById('quickActions');
      if (!menu) return;
      hideQuickActions();

      const row = meta?._progress || (
        normalizedVodType(meta) === 'movie'
          ? cachedMovieProgress(meta.id)
          : normalizedVodType(meta) === 'series'
            ? cachedSeriesProgress(meta.id)
            : null
      );
      const actions = [];
      if (row && Number(row.progressPercent || 0) > 0 && Number(row.progressPercent || 0) < 90) {
        actions.push(['Resume', async () => {
          if (row.contentType === 'series') {
            await fetchAndPlay(row.videoId, 'episode', 'series', row, anchor.closest('.card'));
          } else {
            await fetchAndPlay(meta.id, 'movie', 'movie', row, anchor.closest('.card'));
          }
        }]);
        actions.push(['Restart', async () => {
          const restart = { ...row, position:0, progressPercent:0 };
          if (row.contentType === 'series') {
            await fetchAndPlay(row.videoId, 'episode', 'series', restart, anchor.closest('.card'));
          } else {
            await fetchAndPlay(meta.id, 'movie', 'movie', restart, anchor.closest('.card'));
          }
        }]);
      } else {
        actions.push(['Play', async () => {
          if (meta?._progress?.contentType === 'series') {
            const row = meta._progress;
            await fetchAndPlay(row.videoId, 'episode', 'series', row, anchor.closest('.card'));
          } else if (normalizedVodType(meta) === 'series') {
            await openSeries(meta, anchor.closest('.card'));
          } else {
            await fetchAndPlay(meta.id, 'movie', 'movie', progressContextForMovie(meta), anchor.closest('.card'));
          }
        }]);
      }

      actions.push(['Details', async () => {
        if (normalizedVodType(meta) === 'series' || meta?._progress?.contentType === 'series') {
          const preview = meta?._progress?.contentType === 'series'
            ? {
                ...meta,
                id: meta._progress.contentId,
                type:'series',
                name:meta._progress.name || meta.name
              }
            : meta;
          await openSeries(preview, anchor.closest('.card'));
        } else {
          await openMovie(meta, anchor.closest('.card'));
        }
      }]);

      if (meta?._progress?.contentType === 'series' || normalizedVodType(meta) === 'series') {
        const next = await quickActionNextEpisode(meta);
        if (next) {
          actions.push(['Next episode', async () => {
            await fetchAndPlay(
              next.video.id,
              'episode',
              'series',
              next.progress,
              anchor.closest('.card')
            );
          }]);
        }
      }

      if (row && Number(row.progressPercent || 0) >= 90) {
        actions.push(['Mark unwatched', async () => {
          await updateProgressRow(row, 0);
          if (currentMode === 'continue') await loadContinueWatching();
        }]);
      } else {
        const writable = row || (
          normalizedVodType(meta) === 'movie'
            ? progressContextForMovie(meta)
            : null
        );
        if (writable) {
          actions.push(['Mark watched', async () => {
            await updateProgressRow(writable, 100);
            if (currentMode === 'continue') await loadContinueWatching();
          }]);
        }
      }

      actions.forEach(([label, action]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.role = 'menuitem';
        button.textContent = label;
        button.onclick = async event => {
          event.stopPropagation();
          hideQuickActions();
          await action();
        };
        menu.appendChild(button);
      });

      menu.hidden = false;
      positionQuickActions(anchor, menu);
      requestAnimationFrame(() => menu.querySelector('button')?.focus());
    }

    function setPlayerPresentation(meta, contentType) {
      currentPlaybackMeta = meta || {};
      const backdrop = document.getElementById('playerBackdrop');
      const logo = document.getElementById('playerHudLogo');
      const title = document.getElementById('playerHudTitle');
      const subtitle = document.getElementById('playerHudSubtitle');
      const chips = document.getElementById('playerHudChips');
      const switchButton = document.getElementById('playerSwitchSource');
      if (!backdrop || !logo || !title || !subtitle || !chips || !switchButton) return;

      const artwork = safeImageUrl(meta?.backdrop || meta?.background || meta?.poster);
      backdrop.style.backgroundImage = artwork ? 'url("' + artwork.replace(/"/g, '%22') + '")' : '';

      const logoUrl = safeImageUrl(meta?.logo);
      if (logoUrl) {
        logo.src = logoUrl;
        logo.style.display = 'block';
      } else {
        logo.removeAttribute('src');
        logo.style.display = 'none';
      }

      const isEpisode = contentType === 'episode' || String(meta?.contentType || '').toLowerCase() === 'series';
      title.textContent = isEpisode
        ? String(meta?.name || meta?.parentName || 'AIOPlay')
        : String(meta?.name || meta?.title || 'AIOPlay');

      const season = meta?.season;
      const episode = meta?.episode;
      const code = season != null && episode != null
        ? 'S' + String(season).padStart(2, '0') + 'E' + String(episode).padStart(2, '0')
        : '';
      const epTitle = String(meta?.episodeTitle || '');
      subtitle.textContent = isEpisode
        ? [code, epTitle].filter(Boolean).join(' · ')
        : String(meta?.description || '');

      chips.innerHTML = '';
      const labels = [];
      if (contentType === 'sport_event' || contentType === 'live_channel' || contentType === 'sport') {
        labels.push('LIVE');
      }
      if (meta?.releaseInfo || meta?.year) labels.push(String(meta.releaseInfo || meta.year));
      if (meta?.runtime) labels.push(String(meta.runtime));
      labels.slice(0, 4).forEach(label => {
        const chip = document.createElement('span');
        chip.className = 'player-hud-chip';
        chip.textContent = label;
        chips.appendChild(chip);
      });
      switchButton.disabled = !currentPlaybackSession;
    }

    function showPlayerHud(sticky = false) {
      const hud = document.getElementById('playerHud');
      if (!hud) return;
      hud.classList.remove('is-idle');
      clearTimeout(playerHudTimer);
      if (!sticky) {
        playerHudTimer = setTimeout(() => {
          const video = document.getElementById('video');
          if (video && !video.paused && document.getElementById('loader')?.style.display === 'none') {
            hud.classList.add('is-idle');
          }
        }, 3200);
      }
    }

    function formatPlaybackTime(seconds) {
      const safe = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      return hours > 0
        ? hours + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0')
        : mins + ':' + String(secs).padStart(2, '0');
    }

    function markerTime(value) {
      if (value == null) return null;
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) return null;
      return number > 100000 ? number / 1000 : number;
    }

    function playbackMarkers(meta) {
      if (!meta || typeof meta !== 'object') return [];
      const markers = [];
      const push = (kind, start, label = '') => {
        const seconds = markerTime(start);
        if (seconds == null) return;
        markers.push({ kind, start:seconds, label:label || kind });
      };

      const inspect = row => {
        if (!row || typeof row !== 'object') return;
        const rawKind = String(row.kind || row.type || row.name || row.title || '').toLowerCase();
        const kind = rawKind.includes('intro') || rawKind.includes('opening')
          ? 'intro'
          : rawKind.includes('recap')
            ? 'recap'
            : rawKind.includes('outro') || rawKind.includes('ending') || rawKind.includes('credits')
              ? 'outro'
              : '';
        if (!kind) return;
        push(kind, row.start ?? row.startTime ?? row.startMs ?? row.time, row.title || row.name);
      };

      ['chapters','markers','segments','skipSegments'].forEach(key => {
        if (Array.isArray(meta[key])) meta[key].forEach(inspect);
      });
      ['intro','recap','outro','opening','ending'].forEach(key => {
        const value = meta[key];
        if (value && typeof value === 'object') {
          push(
            key === 'opening' ? 'intro' : key === 'ending' ? 'outro' : key,
            value.start ?? value.startTime ?? value.startMs,
            value.label || key
          );
        }
      });
      return markers;
    }

    function updatePlayerTimeline(video = document.getElementById('video')) {
      if (!video) return;
      const duration = Number(video.duration);
      const current = Number(video.currentTime || 0);
      const fill = document.getElementById('playerTimelineFill');
      const currentLabel = document.getElementById('playerTimelineCurrent');
      const remainingLabel = document.getElementById('playerTimelineRemaining');
      if (fill) {
        fill.style.width = Number.isFinite(duration) && duration > 0
          ? Math.max(0, Math.min(100, current / duration * 100)) + '%'
          : '0%';
      }
      if (currentLabel) currentLabel.textContent = formatPlaybackTime(current);
      if (remainingLabel) remainingLabel.textContent =
        '−' + formatPlaybackTime(Number.isFinite(duration) ? Math.max(0, duration - current) : 0);
    }

    function renderPlayerTimelineMarkers(video = document.getElementById('video')) {
      const host = document.getElementById('playerTimelineMarkers');
      if (!host) return;
      host.innerHTML = '';
      const duration = Number(video?.duration);
      if (!Number.isFinite(duration) || duration <= 0) return;
      playbackMarkers(currentPlaybackMeta).forEach(marker => {
        if (marker.start < 0 || marker.start > duration) return;
        const node = document.createElement('span');
        node.className = 'player-timeline-marker';
        node.dataset.kind = marker.kind;
        node.title = marker.label;
        node.style.left = (marker.start / duration * 100) + '%';
        host.appendChild(node);
      });
    }

    function minimizePlayer() {
      const overlay = document.getElementById('player-overlay');
      if (!overlay || overlay.style.display !== 'flex') return;
      overlay.classList.add('mini');
      document.getElementById('miniPlayerBar').hidden = false;
      showPlayerHud(false);

    function expandPlayer() {
      const overlay = document.getElementById('player-overlay');
      if (!overlay) return;
      overlay.classList.remove('mini');
      document.getElementById('miniPlayerBar').hidden = true;
      showPlayerHud(true);
    }

    function setupEpisodeRail(rail) {
      if (!rail || rail.dataset.railReady === '1') return;
      rail.dataset.railReady = '1';

      // Touch uses native momentum scrolling. Mouse wheels/trackpads are mapped
      // horizontally so the rail feels natural on desktop too.
      rail.addEventListener('wheel', event => {
        if (rail.scrollWidth <= rail.clientWidth) return;
        const dominant = Math.abs(event.deltaX) > Math.abs(event.deltaY)
          ? event.deltaX
          : event.deltaY;
        if (!dominant) return;
        event.preventDefault();
        rail.scrollLeft += dominant;
      }, { passive:false });
    }

    function restoreDetailsEpisodeFocus() {
      if (!currentDetailsEpisodeId) return;
      requestAnimationFrame(() => {
        const target = [...document.querySelectorAll('.episode-btn')].find(button =>
          button.dataset.videoId === String(currentDetailsEpisodeId)
        );
        if (target) {
          target.focus({ preventScroll:true });
          target.scrollIntoView({
            block:'nearest',
            inline:'center',
            behavior:'auto'
          });
        }
      });
    }

    async function prepareNextEpisode(progressContext) {
      currentNextEpisode = null;
      const button = document.getElementById('playerNextUp');
      if (button) button.hidden = true;
      if (!progressContext || progressContext.contentType !== 'series') return;

      const preview = {
        id: progressContext.contentId,
        type:'series',
        name:progressContext.name
      };
      const meta = await loadMetaFor(preview);
      if (meta) {
        const currentVideo = Array.isArray(meta.videos)
          ? meta.videos.find(video =>
              String(video?.id || '') === String(progressContext.videoId || '') ||
              (
                progressContext.season != null && progressContext.episode != null &&
                Number(video?.season) === Number(progressContext.season) &&
                Number(video?.episode) === Number(progressContext.episode)
              )
            )
          : null;
        if (currentVideo) {
          currentPlaybackMeta = { ...(currentPlaybackMeta || {}), ...currentVideo };
          renderPlayerTimelineMarkers(document.getElementById('video'));
        }
      }
      const next = findNextVideo(meta, progressContext);
      if (!meta || !next) return;

      currentNextEpisode = {
        meta,
        video:next,
        progress:progressContextForEpisode(meta, next)
      };
      document.getElementById('playerNextTitle').textContent =
        meta.name || progressContext.name || 'Next episode';
      const code = next.season != null && next.episode != null
        ? 'S' + String(next.season).padStart(2, '0') +
          'E' + String(next.episode).padStart(2, '0')
        : '';
      document.getElementById('playerNextMeta').textContent =
        [code, next.title || next.name || ''].filter(Boolean).join(' · ');
    }

    function updateNextUpVisibility(video) {
      const button = document.getElementById('playerNextUp');
      if (!button || !currentNextEpisode || !video) {
        if (button) button.hidden = true;
        return;
      }
      if (!Number.isFinite(video.duration) || video.duration <= 0) {
        button.hidden = true;
        return;
      }
      const remaining = Math.max(0, video.duration - Number(video.currentTime || 0));
      const fraction = Number(video.currentTime || 0) / video.duration;
      button.hidden = !(remaining <= 180 || fraction >= 0.85);
    }

    function setActiveTab(el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) {
        el.classList.add('active');

    async function initContent() {
      try {
        bootstrap = await (await fetch('/api/v1/bootstrap')).json();
        try {
          const account = await (await fetch('/api/v1/account')).json();
          bootstrap.accountUser = account && account.user ? account.user : null;
          if (bootstrap.accountUser) {
            const progressResponse = await fetch('/api/v1/progress', { cache: 'no-store' });
            if (progressResponse.ok) {
              const progressBody = await progressResponse.json();
              sharedProgressItems = Array.isArray(progressBody.items) ? progressBody.items : [];
            }
          }
        } catch (_) {
          bootstrap.accountUser = null;
          sharedProgressItems = [];
        }
        buildModes();
        const sports = bootstrap.services && bootstrap.services.sports && bootstrap.services.sports.enabled;
        const vod = bootstrap.services && bootstrap.services.vod && bootstrap.services.vod.enabled;
        const snapshot = savedUiState();
        const requestedMode = snapshot?.mode;
        const validMode = requestedMode === 'continue'
          ? !!(vod && bootstrap.accountUser)
          : requestedMode === 'vod'
            ? !!vod
            : requestedMode === 'sports'
              ? !!sports
              : false;
        const initialMode = validMode
          ? requestedMode
          : (sports ? 'sports' : (vod ? 'vod' : ''));

        if (initialMode) {
          restoringUiState = true;
          setSearchType(snapshot?.searchType || '', { rerun:false });
          await loadMode(initialMode, { snapshot, push:false });
          const search = document.getElementById('searchInput');
          if (snapshot?.search) {
            search.value = snapshot.search;
            await applySearch(snapshot.search, { persist:false });
          }
          restoreGridPosition(snapshot);
          restoringUiState = false;
          persistUiState();
        } else {
          setGridState('No content services are enabled.');
        }
      } catch (err) {
        console.error('Failed to bootstrap app', err);
        setGridState('Could not load the application.', true, () => location.reload());
      }
    }

    function buildModes() {
      const host = document.getElementById('modeTabs');

        ? ''
        : '<div style="color:var(--text-muted);">Loading catalogs...</div>';

      } else if (mode === 'continue') {
        await loadContinueWatching({ push:false });

    async function loadSportsTabs(snapshot = null) {
      setCatalogRailVisible(true);
      try {
        const data = await (await fetch('/api/v1/sports/catalogs')).json();
        tabs().innerHTML = '';
        let first = null;
        let restore = null;
        for (const catalog of data.catalogs || []) {
          if (catalog.type !== 'tv') continue;
          const tab = document.createElement('div');
          tab.className = 'tab';
          tab.textContent = String(catalog.name || catalog.id).replace('nuvio ', '').replace('Nuvio ', '');
          tab.onclick = () => loadSportsCatalog(catalog.id, tab, { push:true });
          tabs().appendChild(tab);
          const pair = { catalog, tab };
          if (!first) first = pair;
          if (snapshot?.catalog?.id === catalog.id) restore = pair;
        }
        const target = restore || first;
        if (target) await loadSportsCatalog(target.catalog.id, target.tab, { push:false });
      } catch (err) {
        console.error(err);
        tabs().innerHTML = '<div style="color:var(--accent);">Failed to load sports catalogs.</div>';
        setGridState('Could not load the Live catalog list.', true, () => loadSportsTabs());

    async function loadVodTabs(snapshot = null) {
      setCatalogRailVisible(true);
      try {
        const data = await (await fetch('/api/v1/vod/catalogs')).json();
        tabs().innerHTML = '';

        let first = null;
        let restore = null;
        for (const catalog of data.catalogs || []) {
          const tab = document.createElement('div');
          tab.className = 'tab';
          tab.textContent = catalog.name || catalog.id;
          tab.onclick = () => loadVodCatalog(catalog, tab, { push:true });

          if (
            snapshot?.catalog?.id === catalog.id &&
            (!snapshot.catalog.type || snapshot.catalog.type === catalog.type)
          ) {

      } catch (err) {

        tabs().innerHTML = '<div style="color:var(--accent);">Failed to load VOD catalogs.</div>';
        setGridState('Could not load the VOD catalog list.', true, () => loadVodTabs());

    async function loadContinueWatching({ push = true } = {}) {
      setCatalogRailVisible(false);
      currentCatalogState = { kind:'continue', id:'continue', type:'' };
      tabs().innerHTML = '';
      currentVodType = '';
      beginGridTransition({ posterMode:true });
      try {
        const res = await fetch('/api/v1/progress?continue=1', { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Progress failed');

        const continueRows = Array.isArray(data.items) ? data.items : [];
        for (const row of continueRows) {
          const key = progressIdentityKey(row);
          const index = sharedProgressItems.findIndex(existing => progressIdentityKey(existing) === key);
          if (index >= 0) sharedProgressItems[index] = row;
          else sharedProgressItems.push(row);
        }

        currentItems = continueRows.map(row => ({
          id: row.videoId || row.contentId,
          type: row.contentType === 'series' ? 'episode' : 'movie',
          name: row.name || 'Untitled',
          description: row.contentType === 'series'
            ? [
                row.season != null && row.episode != null ? ('S' + row.season + ' E' + row.episode) : '',
                row.episodeTitle || ''
              ].filter(Boolean).join(' · ')
            : '',
          poster: row.poster,
          background: row.backdrop,
          logo: row.logo,
          _progress: row
        }));
        renderGrid(currentItems);
        if (push && !restoringUiState) persistUiState({ push:true });
      } catch (err) {
        console.error(err);
        currentItems = [];
        setGridState('Could not load Continue Watching.', true, () => loadContinueWatching({ push:false }));
      }
    }
