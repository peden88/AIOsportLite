<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIOSport Lite</title>
  <link rel="icon" type="image/png" href="/logo-v2.png">
  <link rel="apple-touch-icon" href="/logo-v2.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(28, 28, 30, 0.4);
      --card-border: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #1668ff;
      --accent-glow: rgba(22, 104, 255, 0.32);
      --glass: rgba(15, 15, 17, 0.7);
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 50; background: var(--glass); backdrop-filter: blur(16px); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 15px; }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 900; }
    .brand span { background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 12px rgba(22, 104, 255, 0.3); }
    /* Up here rather than beside the tabs, where it took 200px off a row that
       already scrolls -- the last tab sat underneath it and looked cut off. The
       tab strip now gets the full width and this gets the space the header has
       going spare. */
    .header-search {
      flex: 1 1 180px; min-width: 140px; max-width: 420px;
      padding: 10px 18px; border-radius: 30px; font-family: 'Inter', sans-serif;
      font-size: 14px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border); color: #fff; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .header-search::placeholder { color: var(--text-muted); }
    .header-search:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
    main { padding: 40px; max-width: 1600px; margin: 0 auto; }
    @media (max-width: 768px) {
      header { padding: 15px 20px; flex-direction: column; align-items: flex-start; }
      main { padding: 20px; }
      /* Stacked header: the search gets its own full-width line rather than a
         420px cap that would leave it stranded against the left edge. */
      .header-search { width: 100%; max-width: none; flex: none; order: 3; }
      .header-actions { width: 100%; }
      .header-actions a { flex: 1; justify-content: center; text-align: center; }
    }
    
    .tabs { display: flex; gap: 15px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
    .tab { padding: 10px 20px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-muted); cursor: pointer; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    .tab:hover { background: rgba(255,255,255,0.1); color: white; }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 15px var(--accent-glow); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow); z-index: 10; }
    .poster-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
    .background { width: 100%; height: 100%; object-fit: cover; filter: blur(20px) brightness(0.5); transform: scale(1.2); transition: all 0.4s; }
    .card:hover .background { filter: blur(15px) brightness(0.7); transform: scale(1.1); }
    .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; padding: 10px; transition: transform 0.4s; }
    .card:hover .poster { transform: scale(1.05); }
    .logo { position: absolute; top: 15px; left: 15px; width: 48px; height: 48px; z-index: 3; border-radius: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); object-fit: contain; padding: 6px; border: 1px solid rgba(255,255,255,0.1); }
    .live-badge { position: absolute; top: 15px; right: 15px; z-index: 3; background: var(--accent); color: white; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(22, 104, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0); } }
    .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 20px 20px 20px; z-index: 3; background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 60%, transparent 100%); transition: all 0.4s; }
    .card:hover .info { padding-bottom: 25px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .desc { font-size: 0.85rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    
    #player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 100; flex-direction: column; }
    #close-btn { position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 30px; cursor: pointer; z-index: 101; font-weight: 600; }
    #video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    video { width: 100%; max-width: 1400px; max-height: 85vh; border-radius: 16px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    
    #source-selector { display: none; position: absolute; z-index: 102; background: rgba(20,20,20,0.9); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); flex-direction: column; gap: 10px; }
    .source-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .source-btn:hover { background: var(--accent); }
    
    .loader { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/logo-v2.png" alt="AIOSport Lite">
      <span>AIOSport Lite</span>
    </div>
    <input type="text" id="searchInput" class="header-search" placeholder="Search matches…" aria-label="Search matches">
    <div class="header-actions">
      <a href="https://ko-fi.com/mlp20" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 94, 91, 0.15); border: 1px solid rgba(255, 94, 91, 0.3); color: #FF5E5B; padding: 8px 16px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 13px; transition: all 0.2s;">
        <svg height="14" viewBox="0 0 24 24" width="14" fill="currentColor"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.966-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.966 1.909.822 1.838 3.197.723 4.314z"/></svg>
        Tip on Ko-fi
      </a>
      <a href="https://github.com/peden88/AIOsportLite" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 8px 16px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 13px; transition: all 0.2s;">
        <svg height="14" viewBox="0 0 16 16" width="14" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        GitHub
      </a>
      <button type="button" id="signOutBtn" title="Sign out of this browser" aria-label="Sign out" style="display: none; align-items: center; justify-content: center; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; cursor: pointer; padding: 0;">
        <svg height="17" width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
      <a href="/dashboard" title="Dashboard — caches, warming and health" aria-label="Dashboard" style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; text-decoration: none; transition: all 0.2s;">
        <svg height="17" width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
      <a href="/configure" style="background: var(--accent); color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 700; font-family: 'Outfit', sans-serif; transition: all 0.2s; box-shadow: 0 4px 15px var(--accent-glow);">Configure Addon</a>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs">
      <div style="color:var(--text-muted);">Loading catalogs...</div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <div id="player-overlay">
    <button id="close-btn" onclick="closePlayer()">Close Player</button>
    
    <div id="source-selector">
      <h3 style="margin-top:0; color:white; font-family:'Outfit',sans-serif;">Select Stream Source</h3>
      <div id="source-buttons" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <div id="video-container">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div>Loading stream...</div>
      </div>
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    let hls = null;
    let currentMatches = [];

    async function loadTabs() {
      try {
        const res = await fetch('/manifest.json');
        const manifest = await res.json();
        const tabsContainer = document.getElementById('tabs');
        tabsContainer.innerHTML = '';
        
        let firstCatalog = null;
        let firstTab = null;

        manifest.catalogs.forEach((catalog) => {
          // Skip non-TV catalogs or internal ones
          if (catalog.type !== 'tv' || catalog.id === 'nuvio_sports_teams') return;
          
          if (!firstCatalog) firstCatalog = catalog.id;
          
          const tab = document.createElement('div');
          tab.className = 'tab';
          tab.innerText = catalog.name.replace('nuvio ', '').replace('Nuvio ', '');
          tab.onclick = () => loadCatalog(catalog.id, tab);
          tabsContainer.appendChild(tab);
          
          if (!firstTab) firstTab = tab;
        });

        if (firstCatalog && firstTab) {
          loadCatalog(firstCatalog, firstTab);
        }
      } catch (err) {
        console.error('Failed to load manifest', err);
        document.getElementById('tabs').innerHTML = '<div style="color:var(--accent);">Failed to load catalogs. Ensure server is running.</div>';
      }
    }

    async function loadCatalog(catalogId, tabElement) {
      if (tabElement) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tabElement.classList.add('active');
      }

      const grid = document.getElementById('grid');
      grid.innerHTML = '<div style="color:var(--text-muted);">Fetching matches...</div>';
      document.getElementById('searchInput').value = ''; // Reset search on tab change
      
      try {
        const res = await fetch(`/catalog/tv/${catalogId}.json`);
        const data = await res.json();
        currentMatches = data.metas || [];
        renderGrid(currentMatches);
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div style="color:var(--accent);">Failed to load catalog. Ensure the Nuvio addon is running.</div>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = currentMatches.filter(meta => 
        meta.name.toLowerCase().includes(query) || 
        (meta.description && meta.description.toLowerCase().includes(query))
      );
      renderGrid(filtered);
    });

    function renderGrid(metas) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      if (!metas || metas.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted);">No live matches found matching your criteria right now.</div>';
        return;
      }

      metas.forEach(meta => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => fetchAndPlay(meta.id);
        
        const isLive = meta.name.includes('🔴');
        const cleanName = meta.name.replace('🔴 [LIVE] ', '');
        
        card.innerHTML = `
          <div class="poster-container">
            <img class="background" src="${meta.background}" onerror="this.style.display='none'" loading="lazy">
            <img class="poster" src="${meta.poster}" onerror="this.src='https://raw.githubusercontent.com/stremio/stremio-addon-sdk/master/docs/api/images/stremio-logo.png'" loading="lazy">
            ${meta.logo && meta.logo !== meta.poster ? `<img class="logo" src="${meta.logo}">` : ''}
            ${isLive ? '<div class="live-badge">LIVE</div>' : ''}
          </div>
          <div class="info">
            <div class="title">${cleanName}</div>
            <div class="desc">${(meta.description || '').replace(/\n/g, '<br>')}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function fetchAndPlay(id) {
      document.getElementById('player-overlay').style.display = 'flex';
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('source-selector').style.display = 'none';
      const video = document.getElementById('video');
      video.style.opacity = '0';
      
      try {
        const res = await fetch(`/stream/tv/${id}.json`);
        const data = await res.json();
        
        if (!data.streams || data.streams.length === 0) {
          alert('No streams found for this match.');
          closePlayer();
          return;
        }

        if (data.streams.length === 1) {
          playStreamUrl(data.streams[0].url, data.streams[0]);
        } else {
          document.getElementById('loader').style.display = 'none';
          const selector = document.getElementById('source-selector');
          const btnContainer = document.getElementById('source-buttons');
          btnContainer.innerHTML = '';
          
          data.streams.forEach(stream => {
            const btn = document.createElement('button');
            btn.className = 'source-btn';
            btn.innerText = stream.title;
            btn.onclick = () => {
              selector.style.display = 'none';
              document.getElementById('loader').style.display = 'flex';
              playStreamUrl(stream.url, stream);
            };
            btnContainer.appendChild(btn);
          });
          
          selector.style.display = 'flex';
        }
      } catch (err) {
        console.error(err);
        alert('Error resolving stream.');
        closePlayer();
      }
    }

    function playStreamUrl(url, streamObj = null) {
      if (streamObj && streamObj.externalUrl) {
        window.open(streamObj.externalUrl, '_blank');
        closePlayer();
        return;
      }
      
      const video = document.getElementById('video');
      document.getElementById('loader').style.display = 'none';
      video.style.opacity = '1';

      if (!url) {
        alert('This stream cannot be played in the browser directly.');
        closePlayer();
        return;
      }

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e=>console.log(e)));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(e=>console.log(e));
      }
    }

    function closePlayer() {
      document.getElementById('player-overlay').style.display = 'none';
      document.getElementById('source-selector').style.display = 'none';
      const video = document.getElementById('video');
      video.pause();
      video.src = '';
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    loadTabs();
  </script>
<script>
  // Sign out is only meaningful when this server asks for a password. Without
  // one there is nothing to sign out of, so the button stays hidden rather than
  // offering an action that does nothing.
  (async () => {
    const btn = document.getElementById('signOutBtn');
    if (!btn) return;
    try {
      const gate = await (await fetch('/api/site/auth')).json();
      if (!gate.keyRequired) return;
      btn.style.display = 'inline-flex';
      btn.addEventListener('click', async () => {
        try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
        location.href = '/login';
      });
    } catch (_) {
      // If the check fails the button simply stays hidden.
    }
  })();
</script>
</body>
</html>
