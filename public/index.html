<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AIOPlay</title>
  <link rel="icon" type="image/webp" href="/aioplay-brand.webp">
  <link rel="apple-touch-icon" href="/aioplay-brand.webp">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(28, 28, 30, 0.4);
      --card-border: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent:#1668ff;
      --accent-cyan:#36d8ff;
      --accent-violet:#7857ff;
      --accent-gradient:linear-gradient(135deg,var(--accent-cyan) 0%,var(--accent) 48%,var(--accent-violet) 100%);
      --accent-glow:rgba(22,104,255,.32);
      --glass:rgba(15,15,17,.7);
    }
    * { box-sizing:border-box; }
    html {
      min-height:100%;
      min-height:100dvh;
      background-color:#414a7f;
      background-image:
        linear-gradient(
          135deg,
          #355f7f 0%,
          #2f4d7f 48%,
          #414a7f 100%
        );
      background-repeat:no-repeat;
      background-size:100% 100%;
    }
    body {
      font-family:'Inter',sans-serif;
      background:transparent;
      color:var(--text);
      margin:0;
      padding:0 0 env(safe-area-inset-bottom, 0px);
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
    }
    .top-header {
      position:relative;
      z-index:40;
      padding:16px 20px 9px;
      background:rgba(9,9,11,.34);
      backdrop-filter:blur(12px);
    }
    header {
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(15,15,17,.46);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      padding:7px 20px;
      border-top:1px solid rgba(255,255,255,.025);
      border-bottom:1px solid rgba(255,255,255,.035);
      box-shadow:none;
    }
    .header-row {
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      width:100%;
      max-width:1180px;
      margin:0 auto;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .brand { display: flex; align-items: center; }
    .brand img { width: 48px; height: 48px; border-radius: 11px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 12px rgba(22, 104, 255, 0.3); }
    .header-search {
      width: 100%; min-width: 0; max-width: none;
      padding: 11px 18px; border-radius: 30px; font-family: 'Inter', sans-serif;
      font-size: 14px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border); color: #fff; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .header-search::placeholder { color: var(--text-muted); }
    .header-search:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
    .control-bar {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      margin:0 auto;
      width:100%;
      max-width:1180px;
      min-height:34px;
      flex-wrap:nowrap;
      overflow:visible;
    }
    .admin-toolbar { display:flex; justify-content:center; align-items:center; gap:6px; margin:0; flex-wrap:nowrap; }
    .admin-toolbar a {
      min-height:34px;
    }
    .admin-toolbar .admin-action {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 12px !important;
      border-radius:18px !important;
      color:#eef5ff !important;
      background:
        linear-gradient(rgba(19,19,25,.94),rgba(19,19,25,.94)) padding-box,
        var(--accent-gradient) border-box !important;
      border:2px solid transparent !important;
      box-shadow:none !important;
      font-size:13px;
      line-height:1;
    }
    .admin-toolbar .admin-action:hover,
    .admin-toolbar .admin-action:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box !important;
      color:#fff !important;
      outline:none;
    }
    .admin-icon-button {
      display:grid !important;
      place-items:center;
      width:34px;
      height:34px;
      min-height:34px !important;
      padding:0 !important;
      line-height:0;
      flex:0 0 34px;
      color:#eef5ff !important;
      background:
        linear-gradient(rgba(19,19,25,.94),rgba(19,19,25,.94)) padding-box,
        var(--accent-gradient) border-box !important;
      border:2px solid transparent !important;
    }
    .admin-icon-button svg {
      display:block;
      width:17px;
      height:17px;
      margin:0;
      transform:none;
    }
    .control-separator {
      width:1px;
      height:24px;
      flex:0 0 1px;
      background:linear-gradient(to bottom, transparent, rgba(255,255,255,.28), transparent);
      margin:0 2px;
    }
    .catalog-rail {
      width:100%;
      max-width:1180px;
      margin:6px auto 0;
      min-width:0;
    }
    .catalog-rail.is-empty {
      display:none;
      margin:0;
    }
    main { padding:14px 20px 40px; max-width:1180px; margin:0 auto; }
    
    .mode-tabs { display:flex; justify-content:center; align-items:center; gap:6px; margin:0; width:auto; flex-wrap:nowrap; }
    .mode-tab {
      padding:7px 16px; min-height:34px; border-radius:20px;
      background:
        linear-gradient(rgba(31,31,37,.96),rgba(31,31,37,.96)) padding-box,
        var(--accent-gradient) border-box;
      border:2px solid transparent;
      color:#eef3ff; cursor:pointer; font-weight:700; white-space:nowrap;
      font-size:13px; line-height:1; transition:filter .16s,transform .16s,color .16s;
    }
    .mode-tab:hover, .mode-tab:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; outline:none; filter:brightness(1.06);
    }
    .mode-tab.active {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; border-color:transparent; box-shadow:0 4px 18px rgba(22,104,255,.2);
    }
    .player-select {
      display:none;
      height:34px;
      min-height:34px;
      min-width:0;
      max-width:118px;
      padding:0 24px 0 10px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.18);
      background:#141418;
      color:#e8e8ec;
      font-family:'Inter',sans-serif;
      font-size:12px;
      font-weight:700;
      line-height:normal;
      outline:none;
      cursor:pointer;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .player-select option { color:#e8e8ec; background:#141418; font:inherit; }
    .player-select:focus { border-color:var(--accent); }
    .player-choice-overlay {
      display:none;
      position:fixed;
      inset:0;
      z-index:130;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(12px);
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .player-choice-sheet {
      width:min(430px,100%);
      background:#15151a;
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      padding:22px;
      box-shadow:0 24px 70px rgba(0,0,0,.55);
    }
    .player-choice-sheet h3 { margin:0 0 6px; font:800 22px/1.2 'Outfit',sans-serif; }
    .player-choice-sheet p { margin:0 0 16px; color:var(--text-muted); font-size:13px; }
    .player-choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .player-choice-grid button {
      min-height:46px;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
    .player-choice-grid button:hover { border-color:var(--accent); background:rgba(22,104,255,.16); }
    .player-choice-grid .wide { grid-column:1/-1; }
    .tabs {
      display:flex; gap:10px; margin:0; overflow-x:auto; overflow-y:hidden;
      padding:2px 0 3px; white-space:nowrap; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; overscroll-behavior-inline:contain;
      scroll-padding-inline:16px;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      padding:10px 20px; border-radius:20px;
      background:
        linear-gradient(rgba(31,31,37,.96),rgba(31,31,37,.96)) padding-box,
        var(--accent-gradient) border-box;
      border:2px solid transparent; color:#eef3ff; cursor:pointer; font-weight:700;
      transition:filter .16s,transform .16s,color .16s; white-space:nowrap;
    }
    .tab:hover, .tab:focus-visible {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; outline:none; filter:brightness(1.06);
    }
    .tab.active {
      background:var(--accent-gradient) padding-box,var(--accent-gradient) border-box;
      color:#fff; border-color:transparent; box-shadow:0 4px 18px rgba(22,104,255,.2);
    }
    
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; width:100%; }
    .content-state {
      grid-column:1 / -1;
      min-height:calc(100dvh - 245px);
      display:grid;
      place-items:center;
      padding:28px 20px 90px;
      text-align:center;
      color:var(--text-muted);
      font:600 1.5rem/1.35 'Inter',sans-serif;
      letter-spacing:-.01em;
    }
    .content-state.error { color:#d6e3ff; }
    @supports not (height:100dvh) {
      .content-state { min-height:calc(100vh - 245px); }
    }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow); z-index: 10; }
    .poster-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
    .vod-card {
      background:transparent; border:0; border-radius:0; overflow:visible;
      display:flex; flex-direction:column; gap:8px;
    }
    .vod-card:hover { transform:none; box-shadow:none; border-color:transparent; }
    .vod-card .poster-container {
      aspect-ratio:2/3; border-radius:12px; border:3px solid transparent;
      background:var(--card-bg); box-shadow:0 7px 20px rgba(0,0,0,.24);
      transition:border-color .16s, transform .16s, box-shadow .16s;
    }
    .vod-card:hover .poster-container, .vod-card:focus-visible .poster-container {
      border-color:var(--accent); transform:scale(1.02);
      box-shadow:0 10px 28px rgba(0,0,0,.38);
    }
    .vod-card:hover .poster { transform:none; }
    .vod-card:focus-visible { outline:none; }
    .vod-card .background { display:none; }
    .vod-card .poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; padding:0; }
    .vod-card .info {
      position:static; padding:0 3px; background:none; min-height:38px;
    }
    .vod-card:hover .info { padding:0 3px; }
    .vod-card .desc { display:block; margin-top:3px; font-size:.74rem; color:var(--text-muted); line-height:1.25; }
    .vod-card .title {
      font-size:1rem; margin:0; color:var(--text); text-shadow:none;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;
    }
    .progress-track { width:100%; height:3px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12); margin-top:6px; }
    .progress-fill { height:100%; background:var(--accent); border-radius:inherit; }
    .background { width: 100%; height: 100%; object-fit: cover; filter: blur(20px) brightness(0.5); transform: scale(1.2); transition: all 0.4s; }
    .card:hover .background { filter: blur(15px) brightness(0.7); transform: scale(1.1); }
    .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; padding: 10px; transition: transform 0.4s; }
    .card:hover .poster { transform: scale(1.05); }
    .logo { position: absolute; top: 15px; left: 15px; width: 48px; height: 48px; z-index: 3; border-radius: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); object-fit: contain; padding: 6px; border: 1px solid rgba(255,255,255,0.1); }
    .live-badge { position: absolute; top: 15px; right: 15px; z-index: 3; background: var(--accent); color: white; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(22, 104, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(22, 104, 255, 0); } }
    .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 20px 20px 20px; z-index: 3; background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 60%, transparent 100%); transition: all 0.4s; }
    .card:hover .info { padding-bottom: 25px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .desc { font-size: 0.85rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    
    #player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 100; flex-direction: column; }
    .player-brand { position:absolute; top:24px; left:28px; z-index:102; display:flex; align-items:center; gap:10px; padding:7px 12px 7px 8px; border-radius:14px; background:rgba(8,10,18,.58); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(14px); font:800 15px/1 'Outfit',sans-serif; letter-spacing:.01em; box-shadow:0 8px 28px rgba(0,0,0,.28); pointer-events:none; }
    .player-brand img { width:32px; height:32px; border-radius:8px; display:block; }
    .player-brand span { background:linear-gradient(90deg,#fff 10%,#36d8ff 62%,#7857ff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #close-btn { position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 30px; cursor: pointer; z-index: 101; font-weight: 600; }
    #video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    video { width: 100%; max-width: 1400px; max-height: 85vh; border-radius: 16px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }    
    .loader { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    #playback-message { display:none; position:absolute; max-width:520px; padding:20px 24px; text-align:center; color:var(--text-muted); }
    #playback-message strong { display:block; color:var(--text); font-size:1.05rem; margin-bottom:6px; }
    #details-overlay {
      display:none;
      position:fixed;
      inset:0;
      z-index:90;
      min-height:100dvh;
      background:rgba(0,0,0,.85);
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      overflow:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding:48px 20px calc(48px + env(safe-area-inset-bottom, 0px));
    }
    .details-shell {
      max-width:1050px;
      margin:0 auto;
      background:rgba(18,18,22,.985);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:24px;
      box-shadow:0 24px 80px rgba(0,0,0,.42);
    }
    .details-head { display:grid; grid-template-columns:180px 1fr; gap:24px; }
    .details-head img { width:180px; aspect-ratio:2/3; object-fit:cover; border-radius:12px; background:#202027; }
    .details-head h2 { margin:0 0 10px; font:800 28px/1.15 'Outfit',sans-serif; }
    .details-head p { color:var(--text-muted); margin:0; white-space:pre-line; }
    .details-close { float:right; background:#292930; color:#fff; border:0; border-radius:10px; padding:9px 13px; cursor:pointer; }
    .season-control { display:none; margin-top:22px; align-items:center; gap:10px; }
    .season-control label { color:var(--text-muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .season-select {
      min-height:38px;
      padding:0 34px 0 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:#1c1c22;
      color:#fff;
      font-family:'Inter',sans-serif;
      font-size:13px;
      font-weight:700;
      line-height:normal;
      outline:none;
    }
    .season-select:focus { border-color:var(--accent); }
    .episode-list { margin-top:14px; display:grid; gap:9px; }
    .episode-btn { width:100%; text-align:left; background:#1c1c22; border:1px solid var(--card-border); color:#fff; border-radius:10px; padding:12px 14px; cursor:pointer; }
    .episode-btn:hover { border-color:var(--accent); background:#222633; }
    @media(max-width:650px){
      .top-header { padding:12px 8px 7px; }
      header { padding:6px 8px; }
      .header-row { gap:8px; }
      .brand img { width: 42px; height: 42px; }
      .header-search { padding: 10px 13px; font-size: 14px; }
      main { padding: 14px 12px 32px; }
      .control-bar { gap:4px; margin-top:8px; justify-content:center; }
      .admin-toolbar { gap:3px; min-width:0; }
      .admin-toolbar .admin-action { padding:5px 7px !important; min-height:30px; font-size:10.5px; }
      .admin-icon-button { width:30px; height:30px; min-height:30px !important; flex-basis:30px; }
      .admin-icon-button svg { width:15px; height:15px; }
      .control-separator { height:20px; margin:0 1px; }
      .mode-tabs { gap:3px; min-width:0; }
      .mode-tab { padding:6px 9px; min-height:30px; font-size:11px; }
      .player-select { height:30px; min-height:30px; max-width:92px; padding:0 20px 0 7px; font-size:11px; }
      .catalog-rail { margin-top:5px; }
      .tabs { gap:7px; }
      .tab { padding:8px 13px; font-size:12px; }
      .vod-card { gap:6px; }
      .vod-card .info { min-height:34px; }
      .vod-card .title { font-size:.88rem; }
      .vod-card .desc { font-size:.68rem; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      .content-state {
        min-height:calc(100dvh - 224px);
        padding:24px 16px 82px;
        font-size:1.42rem;
      }
      .card { border-radius:14px; }
      .poster { padding:6px; }
      .logo { top:8px; left:8px; width:34px; height:34px; border-radius:8px; padding:4px; }
      .live-badge { top:8px; right:8px; font-size:.62rem; padding:3px 7px; }
      .info { padding:22px 10px 9px; }
      .card:hover .info { padding-bottom:9px; }
      .title { font-size:.93rem; margin-bottom:0; }
      .desc { display:none; }
      .details-head{grid-template-columns:1fr}.details-head img{width:130px}.details-shell{padding:18px}
    }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX" crossorigin="anonymous"></script>
</head>
<body>

  <div class="top-header">
    <div class="header-row">
      <div class="brand">
        <img src="/aioplay-brand.webp" alt="AIOPlay">
      </div>
      <input type="text" id="searchInput" class="header-search" placeholder="Search matches…" aria-label="Search">
      <div class="header-actions">
        <button type="button" id="signOutBtn" title="Sign out of this browser" aria-label="Sign out" style="display: none; align-items: center; justify-content: center; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; cursor: pointer; padding: 0;">
          <svg height="18" width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </div>

  <header>
    <div class="control-bar">
      <div class="admin-toolbar">
        <a href="/dashboard" class="admin-only admin-icon-button" title="Dashboard — caches, warming and health" aria-label="Dashboard" style="border-radius:50%;text-decoration:none;transition:all .2s;">
          <svg height="17" width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </a>
        <a href="/services" class="admin-only admin-action" style="text-decoration:none;font-weight:700;">Services</a>
        <a href="/configure" class="admin-only admin-action" style="text-decoration:none;font-weight:700;font-family:'Outfit',sans-serif;">Configure</a>
      </div>
      <div class="admin-only control-separator" aria-hidden="true"></div>
      <div class="mode-tabs" id="modeTabs"></div>
      <div class="control-separator vod-player-control" id="vodPlayerSeparator" aria-hidden="true" style="display:none"></div>
      <select id="vodPlayerSelect" class="player-select vod-player-control" aria-label="VOD playback player" title="VOD playback player">
        <option value="internal">AIOPlay</option>
        <option value="ask">Ask</option>
        <option value="vlc">VLC</option>
        <option value="outplayer">Outplayer</option>
        <option value="strexo">Strexo</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div class="catalog-rail">
      <div class="tabs" id="tabs" aria-label="Channels and catalogs">
        <div style="color:var(--text-muted);">Loading catalogs...</div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <div id="details-overlay">
    <div class="details-shell">
      <button type="button" class="details-close" onclick="closeDetails()">Close</button>
      <div class="details-head">
        <img id="detailsPoster" alt="">
        <div>
          <h2 id="detailsTitle"></h2>
          <p id="detailsDescription"></p>
        </div>
      </div>
      <div class="season-control" id="seasonControl">
        <label for="seasonSelect">Season</label>
        <select id="seasonSelect" class="season-select" aria-label="Season"></select>
      </div>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>

  <div id="player-choice-overlay" class="player-choice-overlay">
    <div class="player-choice-sheet">
      <h3>Open with</h3>
      <p>Choose where to play this VOD stream.</p>
      <div class="player-choice-grid">
        <button type="button" onclick="chooseVodPlayer('internal')">AIOPlay</button>
        <button type="button" onclick="chooseVodPlayer('vlc')">VLC</button>
        <button type="button" onclick="chooseVodPlayer('outplayer')">Outplayer</button>
        <button type="button" onclick="chooseVodPlayer('strexo')">Strexo</button>
        <button type="button" class="wide" onclick="closeVodPlayerChoice()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="player-overlay">
    <div class="player-brand" aria-label="AIOPlay"><img src="/aioplay-brand.webp" alt=""><span>AIOPlay</span></div>
    <button id="close-btn" onclick="closePlayer()">Close Player</button>

    <div id="video-container">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div>Loading stream...</div>
      </div>
      <div id="playback-message"><strong>Unable to start playback</strong><span>There are no working streams for this event right now.</span></div>
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    let hls = null;
    let bootstrap = null;
    let currentItems = [];
    let currentMode = 'sports';
    let currentVodType = '';
    let currentPlaybackSession = null;
    let currentPlaybackKind = 'sport_event';
    let playbackGeneration = 0;
    let requestingFallback = false;
    let pendingVodPlayback = null;
    let searchTimer = null;
    let currentProgressContext = null;
    let lastProgressSyncAt = 0;
    let sharedProgressItems = [];

    const grid = () => document.getElementById('grid');
    const tabs = () => document.getElementById('tabs');
    const VOD_PLAYER_KEY = 'aioplay.vodPlayer';
    const STREXO_TEMPLATE_KEY = 'aioplay.strexoTemplate';
    const CUSTOM_TEMPLATE_KEY = 'aioplay.customPlayerTemplate';

    function setCatalogRailVisible(visible) {
      const rail = document.querySelector('.catalog-rail');
      if (!rail) return;
      rail.classList.toggle('is-empty', !visible);
    }

    function setGridState(message, error = false) {
      const host = grid();
      host.innerHTML = '';
      const state = document.createElement('div');
      state.className = 'content-state' + (error ? ' error' : '');
      state.textContent = message;
      host.appendChild(state);
    }

    function vodPlayerPreference() {
      const value = localStorage.getItem(VOD_PLAYER_KEY) || 'internal';
      return ['internal', 'ask', 'vlc', 'outplayer', 'strexo', 'custom'].includes(value)
        ? value
        : 'internal';
    }

    function ensurePlayerTemplate(kind) {
      const key = kind === 'strexo' ? STREXO_TEMPLATE_KEY : CUSTOM_TEMPLATE_KEY;
      const existing = localStorage.getItem(key);
      if (existing && existing.includes('{url}')) return existing;
      const label = kind === 'strexo' ? 'Strexo' : 'custom player';
      const suggested = kind === 'strexo' ? 'strexo://play?url={url}' : 'player://play?url={url}';
      const value = window.prompt(
        'Enter the ' + label + ' URL template. Use {url} where the encoded playback URL should go.',
        suggested
      );
      if (!value || !value.includes('{url}')) return '';
      localStorage.setItem(key, value.trim());
      return value.trim();
    }

    function initVodPlayerControl() {
      const select = document.getElementById('vodPlayerSelect');
      if (!select) return;
      select.value = vodPlayerPreference();
      select.addEventListener('change', () => {
        let value = select.value;
        if ((value === 'strexo' || value === 'custom') && !ensurePlayerTemplate(value)) {
          value = 'ask';
          select.value = value;
        }
        localStorage.setItem(VOD_PLAYER_KEY, value);
      });
    }

    function buildExternalPlayerUrl(kind, streamUrl) {
      const encoded = encodeURIComponent(streamUrl);
      if (kind === 'vlc') {
        return 'vlc-x-callback://x-callback-url/stream?url=' + encoded;
      }
      if (kind === 'outplayer') {
        return 'outplayer://x-callback-url/play?url=' + encoded;
      }
      if (kind === 'strexo' || kind === 'custom') {
        const template = ensurePlayerTemplate(kind);
        if (!template) return '';
        return template
          .replaceAll('{url}', encoded)
          .replaceAll('{rawUrl}', streamUrl);
      }
      return streamUrl;
    }

    function triggerExternalPlayer(kind, streamUrl) {
      const playerUrl = buildExternalPlayerUrl(kind, streamUrl);
      if (!playerUrl) return false;
      const anchor = document.createElement('a');
      anchor.href = playerUrl;
      anchor.rel = 'noopener';
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      return true;
    }

    function setVodPlayerControlsVisible(visible) {
      document.querySelectorAll('.vod-player-control').forEach(el => {
        el.style.display = visible ? 'block' : 'none';
      });
    }

    function safeImageUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const u = new URL(raw, location.origin);
        return ['http:', 'https:'].includes(u.protocol) ? u.toString() : '';
      } catch (_) {
        return '';
      }
    }

    function setActiveTab(el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) {
        el.classList.add('active');
        const rail = tabs();
        if (rail) {
          const left = el.offsetLeft - Math.max(12, (rail.clientWidth - el.offsetWidth) / 2);
          rail.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
        }
      }
    }

    function setActiveMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(el => {
        const active = el.dataset.mode === mode;
        el.classList.toggle('active', active);
        if (active) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }
      });
      const search = document.getElementById('searchInput');
      search.value = '';
      search.placeholder = mode === 'sports'
        ? 'Search matches…'
        : (mode === 'continue' ? 'Search Continue Watching…' : 'Search VOD…');
      setVodPlayerControlsVisible(mode === 'vod' || mode === 'continue');
    }

    async function initContent() {
      try {
        bootstrap = await (await fetch('/api/v1/bootstrap')).json();
        try {
          const account = await (await fetch('/api/v1/account')).json();
          bootstrap.accountUser = account && account.user ? account.user : null;
          if (bootstrap.accountUser) {
            const progressResponse = await fetch('/api/v1/progress', { cache: 'no-store' });
            if (progressResponse.ok) {
              const progressBody = await progressResponse.json();
              sharedProgressItems = Array.isArray(progressBody.items) ? progressBody.items : [];
            }
          }
        } catch (_) {
          bootstrap.accountUser = null;
          sharedProgressItems = [];
        }
        buildModes();
        const sports = bootstrap.services && bootstrap.services.sports && bootstrap.services.sports.enabled;
        const vod = bootstrap.services && bootstrap.services.vod && bootstrap.services.vod.enabled;
        if (sports) await loadMode('sports');
        else if (vod) await loadMode('vod');
        else setGridState('No content services are enabled.');
      } catch (err) {
        console.error('Failed to bootstrap app', err);
        setGridState('Could not load the application.', true);
      }
    }

    function buildModes() {
      const host = document.getElementById('modeTabs');
      host.innerHTML = '';
      const add = (mode, label) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mode-tab';
        btn.dataset.mode = mode;
        btn.textContent = label;
        btn.onclick = () => loadMode(mode);
        host.appendChild(btn);
      };

      if (bootstrap.services?.sports?.enabled) add('sports', 'Live');
      if (bootstrap.services?.vod?.enabled) add('vod', 'VOD');
      if (bootstrap.services?.vod?.enabled && bootstrap.accountUser) add('continue', 'Continue Watching');
    }

    async function loadMode(mode) {
      setActiveMode(mode);
      currentItems = [];
      setCatalogRailVisible(mode !== 'continue');
      tabs().innerHTML = mode === 'continue'
        ? ''
        : '<div style="color:var(--text-muted);">Loading catalogs...</div>';
      grid().innerHTML = '';

      if (mode === 'sports') return loadSportsTabs();
      if (mode === 'continue') return loadContinueWatching();
      return loadVodTabs();
    }

    async function loadSportsTabs() {
      setCatalogRailVisible(true);
      try {
        const data = await (await fetch('/api/v1/sports/catalogs')).json();
        tabs().innerHTML = '';
        let first = null;
        for (const catalog of data.catalogs || []) {
          if (catalog.type !== 'tv') continue;
          const tab = document.createElement('div');
          tab.className = 'tab';
          tab.textContent = String(catalog.name || catalog.id).replace('nuvio ', '').replace('Nuvio ', '');
          tab.onclick = () => loadSportsCatalog(catalog.id, tab);
          tabs().appendChild(tab);
          if (!first) first = { catalog, tab };
        }
        if (first) await loadSportsCatalog(first.catalog.id, first.tab);
      } catch (err) {
        console.error(err);
        tabs().innerHTML = '<div style="color:var(--accent);">Failed to load sports catalogs.</div>';
      }
    }

    async function loadVodTabs() {
      setCatalogRailVisible(true);
      try {
        const data = await (await fetch('/api/v1/vod/catalogs')).json();
        tabs().innerHTML = '';

        let first = null;
        for (const catalog of data.catalogs || []) {
          const tab = document.createElement('div');
          tab.className = 'tab';
          tab.textContent = catalog.name || catalog.id;
          tab.onclick = () => loadVodCatalog(catalog, tab);
          tabs().appendChild(tab);
          if (!first) first = { catalog, tab };
        }

        if (first) await loadVodCatalog(first.catalog, first.tab);
        else setGridState('No VOD catalogs are available.');
      } catch (err) {
        console.error(err);
        tabs().innerHTML = '<div style="color:var(--accent);">Failed to load VOD catalogs.</div>';
      }
    }

    async function loadContinueWatching() {
      setCatalogRailVisible(false);
      tabs().innerHTML = '';
      currentVodType = '';
      setGridState('Loading Continue Watching…');
      try {
        const res = await fetch('/api/v1/progress?continue=1', { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Progress failed');

        const continueRows = Array.isArray(data.items) ? data.items : [];
        for (const row of continueRows) {
          const key = progressIdentityKey(row);
          const index = sharedProgressItems.findIndex(existing => progressIdentityKey(existing) === key);
          if (index >= 0) sharedProgressItems[index] = row;
          else sharedProgressItems.push(row);
        }

        currentItems = continueRows.map(row => ({
          id: row.videoId || row.contentId,
          type: row.contentType === 'series' ? 'episode' : 'movie',
          name: row.name || 'Untitled',
          description: row.contentType === 'series'
            ? [
                row.season != null && row.episode != null ? ('S' + row.season + ' E' + row.episode) : '',
                row.episodeTitle || ''
              ].filter(Boolean).join(' · ')
            : '',
          poster: row.poster,
          background: row.backdrop,
          logo: row.logo,
          _progress: row
        }));
        renderGrid(currentItems);
      } catch (err) {
        console.error(err);
        currentItems = [];
        setGridState('Could not load Continue Watching.', true);
      }
    }

    async function loadSportsCatalog(catalogId, tab) {
      setActiveTab(tab);
      setGridState('Fetching matches…');
      try {
        const res = await fetch('/api/v1/sports/catalog/' + encodeURIComponent(catalogId));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Catalog failed');
        currentItems = data.metas || [];
        renderGrid(currentItems);
      } catch (err) {
        console.error(err);
        setGridState('Failed to load this sports catalog.', true);
      }
    }

    async function loadVodCatalog(catalog, tab) {
      setActiveTab(tab);
      currentVodType = String(catalog.type || '').toLowerCase();
      setGridState('Loading titles…');
      try {
        const url = '/api/v1/vod/catalog/' + encodeURIComponent(catalog.type) + '/' + encodeURIComponent(catalog.id);
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Catalog failed');
        currentItems = data.metas || data.metasDetailed || [];
        renderGrid(currentItems);
      } catch (err) {
        console.error(err);
        setGridState('Failed to load this VOD catalog.', true);
      }
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      const raw = e.target.value.trim();
      clearTimeout(searchTimer);

      if (currentMode === 'sports' || currentMode === 'continue') {
        const query = raw.toLowerCase();
        renderGrid(currentItems.filter(meta =>
          String(meta.name || '').toLowerCase().includes(query) ||
          String(meta.description || '').toLowerCase().includes(query)
        ));
        return;
      }

      if (!raw) {
        renderGrid(currentItems);
        return;
      }
      if (raw.length < 2) return;

      searchTimer = setTimeout(async () => {
        setGridState('Searching…');
        try {
          const url = '/api/v1/vod/search?q=' + encodeURIComponent(raw);
          const res = await fetch(url);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Search failed');
          renderGrid(data.metas || []);
        } catch (err) {
          console.error(err);
          setGridState('Search is temporarily unavailable.', true);
        }
      }, 350);
    });

    function makeImage(src, className, alt = '') {
      const img = document.createElement('img');
      img.className = className;
      img.alt = alt;
      img.loading = 'lazy';
      const safe = safeImageUrl(src);
      if (safe) img.src = safe;
      else img.style.display = 'none';
      return img;
    }

    function renderGrid(metas) {
      const host = grid();
      host.innerHTML = '';
      if (!Array.isArray(metas) || metas.length === 0) {
        setGridState('Nothing to show here right now.');
        return;
      }

      for (const meta of metas) {
        const card = document.createElement('div');
        card.className = 'card';

        card.tabIndex = 0;
        card.onkeydown = event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            card.click();
          }
        };

        if (currentMode === 'sports') {
          card.onclick = () => fetchAndPlay(meta.id, 'sport_event', '');
        } else {
          card.classList.add('vod-card');
          const vodType = String(meta.type || currentVodType || 'movie').toLowerCase();
          if (currentMode === 'continue' && meta._progress) {
            card.onclick = () => {
              const row = meta._progress;
              return fetchAndPlay(
                row.videoId || row.contentId,
                row.contentType === 'series' ? 'episode' : 'movie',
                row.contentType === 'series' ? 'series' : 'movie',
                row
              );
            };
          } else {
            card.onclick = vodType === 'series'
              ? () => openSeries(meta)
              : () => fetchAndPlay(meta.id, 'movie', 'movie', progressContextForMovie(meta));
          }
        }

        const posterBox = document.createElement('div');
        posterBox.className = 'poster-container';
        if (currentMode === 'sports') {
          posterBox.appendChild(makeImage(meta.background || meta.poster, 'background', ''));
          posterBox.appendChild(makeImage(meta.poster, 'poster', meta.name || ''));
        } else {
          posterBox.appendChild(makeImage(meta.poster || meta.background, 'poster', meta.name || ''));
        }

        if (currentMode === 'sports' && meta.logo && meta.logo !== meta.poster) {
          posterBox.appendChild(makeImage(meta.logo, 'logo', ''));
        }

        const name = String(meta.name || '');
        if (currentMode === 'sports' && name.includes('🔴')) {
          const badge = document.createElement('div');
          badge.className = 'live-badge';
          badge.textContent = 'LIVE';
          posterBox.appendChild(badge);
        }

        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = name.replace('🔴 [LIVE] ', '');
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = String(meta.description || '');
        info.append(title, desc);

        if (meta._progress) {
          const track = document.createElement('div');
          track.className = 'progress-track';
          const fill = document.createElement('div');
          fill.className = 'progress-fill';
          const pct = Number(meta._progress.progressPercent);
          const fallbackPct = Number(meta._progress.duration) > 0
            ? (Number(meta._progress.position || 0) / Number(meta._progress.duration)) * 100
            : 0;
          fill.style.width = Math.max(0, Math.min(100, Number.isFinite(pct) ? pct : fallbackPct)) + '%';
          track.appendChild(fill);
          info.appendChild(track);
        }

        card.append(posterBox, info);
        host.appendChild(card);
      }
    }

    function progressIdentityKey(row) {
      const type = String(row?.contentType || '').toLowerCase();
      const series = type === 'series' || type === 'tv' || type === 'episode';
      if (!series) return 'movie|' + String(row?.contentId || '');
      const season = row?.season == null ? null : String(row.season);
      const episode = row?.episode == null ? null : String(row.episode);
      const videoId = String(row?.videoId || '');
      if (season !== null && episode !== null) {
        return 'series|' + String(row?.contentId || '') + '|' + season + '|' + episode;
      }
      return 'series|' + String(row?.contentId || '') + '|video|' + videoId;
    }

    function cachedMovieProgress(contentId) {
      return sharedProgressItems.find(row =>
        String(row.contentType || '').toLowerCase() === 'movie' &&
        String(row.contentId || '') === String(contentId || '')
      ) || null;
    }

    function cachedEpisodeProgress(meta, video) {
      const contentId = String(meta?.id || '');
      const videoId = String(video?.id || '');
      const season = video?.season == null ? null : Number(video.season);
      const episode = video?.episode == null ? null : Number(video.episode);
      return sharedProgressItems.find(row => {
        const type = String(row.contentType || '').toLowerCase();
        if (type !== 'series' && type !== 'tv' && type !== 'episode') return false;
        if (String(row.contentId || '') !== contentId) return false;
        if (season != null && episode != null) {
          return Number(row.season) === season && Number(row.episode) === episode;
        }
        return String(row.videoId || '') === videoId;
      }) || null;
    }

    function progressContextForMovie(meta) {
      const existing = cachedMovieProgress(meta.id);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'movie',
        name: meta.name || existing?.name || 'Movie',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: meta.id,
        season: null,
        episode: null,
        episodeTitle: null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    function progressContextForEpisode(meta, video) {
      const existing = cachedEpisodeProgress(meta, video);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'series',
        name: meta.name || existing?.name || 'Series',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: video.id,
        season: Number.isFinite(Number(video.season)) ? Number(video.season) : null,
        episode: Number.isFinite(Number(video.episode)) ? Number(video.episode) : null,
        episodeTitle: video.title || video.name || existing?.episodeTitle || null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    async function syncCurrentProgress(force = false, completed = false) {
      const row = currentProgressContext;
      if (!row) return;
      const video = document.getElementById('video');
      const now = Date.now();
      if (!force && now - lastProgressSyncAt < 10000) return;

      const durationMs = Number.isFinite(video.duration) && video.duration > 0
        ? Math.round(video.duration * 1000)
        : Number(row.duration || 0);
      let positionMs = Number.isFinite(video.currentTime) && video.currentTime > 0
        ? Math.round(video.currentTime * 1000)
        : Number(row.position || 0);

      if (completed && durationMs > 0) positionMs = durationMs;
      if (positionMs <= 0 && Number(row.position || 0) <= 0) return;

      const next = {
        ...row,
        position: Math.max(0, positionMs),
        duration: Math.max(0, durationMs),
        progressPercent: completed
          ? 100
          : (durationMs > 0 ? Math.max(0, Math.min(100, (positionMs / durationMs) * 100)) : Number(row.progressPercent || 0)),
        lastWatched: now,
        source: 'aioplay_web'
      };
      currentProgressContext = next;
      lastProgressSyncAt = now;
      const nextKey = progressIdentityKey(next);
      const existingIndex = sharedProgressItems.findIndex(row => progressIdentityKey(row) === nextKey);
      if (existingIndex >= 0) sharedProgressItems[existingIndex] = next;
      else sharedProgressItems.unshift(next);

      try {
        await fetch('/api/v1/progress', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: next }),
          keepalive: force
        });
      } catch (_) {}
    }

    function applyResumePosition(video) {
      const row = currentProgressContext;
      if (!row || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const resumeSeconds = Number(row.position || 0) / 1000;
      if (resumeSeconds <= 0) return;
      if (resumeSeconds >= video.duration * 0.90) return;
      if (Math.abs(video.currentTime - resumeSeconds) > 2) {
        try { video.currentTime = Math.min(resumeSeconds, Math.max(0, video.duration - 2)); } catch (_) {}
      }
    }

    async function openSeries(preview) {
      const overlay = document.getElementById('details-overlay');
      const list = document.getElementById('episodeList');
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      overlay.style.display = 'block';
      seasonControl.style.display = 'none';
      seasonSelect.innerHTML = '';
      seasonSelect.onchange = null;
      document.getElementById('detailsTitle').textContent = preview.name || 'Series';
      document.getElementById('detailsDescription').textContent = preview.description || '';
      const poster = document.getElementById('detailsPoster');
      const image = safeImageUrl(preview.poster);
      poster.src = image || '';
      poster.style.display = image ? 'block' : 'none';
      list.innerHTML = '<div style="color:var(--text-muted);">Loading episodes...</div>';

      try {
        const res = await fetch('/api/v1/vod/meta/series/' + encodeURIComponent(preview.id));
        const body = await res.json();
        if (!res.ok || !body.meta) throw new Error(body.error || 'Metadata failed');

        const meta = body.meta;
        document.getElementById('detailsTitle').textContent = meta.name || preview.name || 'Series';
        document.getElementById('detailsDescription').textContent = meta.description || preview.description || '';
        const metaPoster = safeImageUrl(meta.poster || preview.poster);
        poster.src = metaPoster || '';
        poster.style.display = metaPoster ? 'block' : 'none';

        const videos = Array.isArray(meta.videos) ? meta.videos.filter(v => v && v.id) : [];
        videos.sort((a, b) =>
          (Number(a.season) || 0) - (Number(b.season) || 0) ||
          (Number(a.episode) || 0) - (Number(b.episode) || 0)
        );

        if (!videos.length) {
          list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available in metadata for this title.</div>';
          return;
        }

        const seasons = [...new Set(videos.map(video => Number(video.season) || 0))].sort((a, b) => a - b);
        const defaultSeason = seasons.find(season => season > 0) ?? seasons[0];

        for (const season of seasons) {
          const option = document.createElement('option');
          option.value = String(season);
          option.textContent = season > 0 ? ('Season ' + season) : 'Specials';
          seasonSelect.appendChild(option);
        }

        const renderSeason = season => {
          list.innerHTML = '';
          const selected = videos.filter(video => (Number(video.season) || 0) === season);

          if (!selected.length) {
            list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available for this season.</div>';
            return;
          }

          for (const video of selected) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'episode-btn';
            const ep = Number(video.episode) || 0;
            const prefix = ep ? ('E' + ep + ' · ') : '';
            button.textContent = prefix + (video.title || video.name || ('Episode ' + (ep || '')));
            button.onclick = async () => {
              closeDetails();
              await fetchAndPlay(
                video.id,
                'episode',
                'series',
                progressContextForEpisode(meta, video)
              );
            };
            list.appendChild(button);
          }
        };

        seasonSelect.value = String(defaultSeason);
        seasonSelect.onchange = () => renderSeason(Number(seasonSelect.value) || 0);
        seasonControl.style.display = 'flex';
        renderSeason(defaultSeason);
      } catch (err) {
        console.error(err);
        seasonControl.style.display = 'none';
        list.innerHTML = '<div style="color:var(--accent);">Could not load episodes.</div>';
      }
    }

    function closeDetails() {
      document.getElementById('details-overlay').style.display = 'none';
      document.getElementById('episodeList').innerHTML = '';
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      if (seasonControl) seasonControl.style.display = 'none';
      if (seasonSelect) {
        seasonSelect.innerHTML = '';
        seasonSelect.onchange = null;
      }
    }

    function showPlaybackLoading(text = 'Loading stream...') {
      const loader = document.getElementById('loader');
      const message = document.getElementById('playback-message');
      const video = document.getElementById('video');
      loader.style.display = 'flex';
      const line = loader.querySelector('div:last-child');
      if (line) line.textContent = text;
      message.style.display = 'none';
      video.style.opacity = '0';
    }

    function showPlaybackFailure() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('playback-message').style.display = 'block';
      document.getElementById('video').style.opacity = '0';
    }

    async function fetchAndPlay(id, contentType, stremioType, progressContext = null) {
      await closePlayer(false);
      currentProgressContext = progressContext;
      lastProgressSyncAt = 0;
      const generation = ++playbackGeneration;
      currentPlaybackKind = contentType;
      document.getElementById('player-overlay').style.display = 'flex';
      showPlaybackLoading('Finding a working stream...');

      try {
        const payload = { contentType, id };
        if (stremioType) payload.stremioType = stremioType;

        const res = await fetch('/api/v1/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return;

        if (!res.ok || !data.ok || !data.playback) {
          showPlaybackFailure();
          return;
        }

        currentPlaybackSession = data.sessionId || null;
        const isVod = contentType !== 'sport_event' && contentType !== 'live_channel' && contentType !== 'sport';
        const preference = isVod ? vodPlayerPreference() : 'internal';

        if (isVod && preference === 'ask') {
          pendingVodPlayback = {
            target: data.playback,
            generation
          };
          document.getElementById('player-choice-overlay').style.display = 'flex';
          showPlaybackLoading('Choose a player…');
          return;
        }

        if (isVod && preference !== 'internal') {
          const opened = await openCurrentVodInExternalPlayer(preference, generation);
          if (opened) return;
        }

        await playOpaqueTarget(data.playback, generation);
      } catch (err) {
        console.error('Playback start failed', err);
        if (generation === playbackGeneration) showPlaybackFailure();
      }
    }

    function closeVodPlayerChoice() {
      pendingVodPlayback = null;
      document.getElementById('player-choice-overlay').style.display = 'none';
      closePlayer();
    }

    async function chooseVodPlayer(kind) {
      const pending = pendingVodPlayback;
      pendingVodPlayback = null;
      document.getElementById('player-choice-overlay').style.display = 'none';
      if (!pending || pending.generation !== playbackGeneration) return;

      if (kind === 'internal') {
        await playOpaqueTarget(pending.target, pending.generation);
        return;
      }

      const opened = await openCurrentVodInExternalPlayer(kind, pending.generation);
      if (!opened && pending.generation === playbackGeneration) {
        await playOpaqueTarget(pending.target, pending.generation);
      }
    }

    async function openCurrentVodInExternalPlayer(kind, generation) {
      if (generation !== playbackGeneration || !currentPlaybackSession) return false;
      if ((kind === 'strexo' || kind === 'custom') && !ensurePlayerTemplate(kind)) {
        return false;
      }

      try {
        const session = currentPlaybackSession;
        const res = await fetch(
          '/api/v1/playback/' + encodeURIComponent(session) + '/external',
          { method: 'POST' }
        );
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return true;
        if (!res.ok || !data.ok || !data.url) {
          console.warn('External playback bridge unavailable', data.error || res.status);
          return false;
        }

        const launched = triggerExternalPlayer(kind, data.url);
        if (!launched) return false;

        currentPlaybackSession = null;
        requestingFallback = false;
        currentProgressContext = null;
        lastProgressSyncAt = 0;
        playbackGeneration++;
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('playback-message').style.display = 'none';
        stopVideoEngine();
        fetch('/api/v1/playback/' + encodeURIComponent(session), { method: 'DELETE' }).catch(() => {});
        return true;
      } catch (err) {
        console.error('External playback failed', err);
        return false;
      }
    }

    async function requestNextPlayback(generation) {
      if (generation !== playbackGeneration || requestingFallback) return;
      if (!currentPlaybackSession) {
        showPlaybackFailure();
        return;
      }

      requestingFallback = true;
      showPlaybackLoading('Trying another stream...');
      stopVideoEngine();

      try {
        const res = await fetch('/api/v1/playback/' + encodeURIComponent(currentPlaybackSession) + '/next', {
          method: 'POST'
        });
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return;

        if (!res.ok || !data.ok || !data.playback) {
          currentPlaybackSession = null;
          showPlaybackFailure();
          return;
        }

        await playOpaqueTarget(data.playback, generation);
      } catch (err) {
        console.error('Playback fallback failed', err);
        if (generation === playbackGeneration) showPlaybackFailure();
      } finally {
        requestingFallback = false;
      }
    }

    async function playOpaqueTarget(target, generation) {
      if (generation !== playbackGeneration || !target) return;

      // Sports still has a few signed web-player fallbacks. VOD never receives
      // external targets: its gateway accepts only in-player media URLs.
      if (target.kind === 'external') {
        const popup = window.open(target.url, '_blank', 'noopener,noreferrer');
        if (popup) await closePlayer();
        else window.location.assign(target.url);
        return;
      }

      const url = target.url;
      if (!url) return requestNextPlayback(generation);

      const video = document.getElementById('video');
      showPlaybackLoading('Starting playback...');
      if (currentProgressContext) {
        video.addEventListener('loadedmetadata', () => applyResumePosition(video), { once: true });
      }
      const useHls = currentPlaybackKind === 'sport_event' || /\.m3u8(?:$|[?#])/i.test(url);

      if (useHls && Hls.isSupported()) {
        stopVideoEngine();
        hls = new Hls({
          maxBufferLength: 30,
          xhrSetup: xhr => {
            for (const [key, value] of Object.entries(target.requestHeaders || {})) {
              try { xhr.setRequestHeader(key, String(value)); } catch (_) {}
            }
          }
        });
        let started = false;

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (generation !== playbackGeneration) return;
          started = true;
          document.getElementById('loader').style.display = 'none';
          video.style.opacity = '1';
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (generation !== playbackGeneration || !data || !data.fatal) return;
          if (!started || data.type === Hls.ErrorTypes.NETWORK_ERROR || data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            requestNextPlayback(generation);
          }
        });

        hls.loadSource(url);
        hls.attachMedia(video);
        return;
      }

      stopVideoEngine();
      const loaded = () => {
        if (generation !== playbackGeneration) return;
        document.getElementById('loader').style.display = 'none';
        video.style.opacity = '1';
        video.play().catch(() => {});
      };
      const failed = () => requestNextPlayback(generation);
      video.addEventListener('loadedmetadata', loaded, { once: true });
      video.addEventListener('error', failed, { once: true });
      video.src = url;
      video.load();
    }

    function stopVideoEngine() {
      const video = document.getElementById('video');
      if (hls) {
        hls.destroy();
        hls = null;
      }
      try { video.pause(); } catch (_) {}
      video.removeAttribute('src');
      video.load();
    }

    async function closePlayer(invalidate = true) {
      const session = currentPlaybackSession;
      if (currentProgressContext) {
        await syncCurrentProgress(true, false);
      }
      currentPlaybackSession = null;
      requestingFallback = false;
      pendingVodPlayback = null;
      currentProgressContext = null;
      lastProgressSyncAt = 0;
      const chooser = document.getElementById('player-choice-overlay');
      if (chooser) chooser.style.display = 'none';
      if (invalidate) playbackGeneration++;

      document.getElementById('player-overlay').style.display = 'none';
      document.getElementById('playback-message').style.display = 'none';
      stopVideoEngine();

      if (session) {
        try {
          await fetch('/api/v1/playback/' + encodeURIComponent(session), { method: 'DELETE' });
        } catch (_) {}
      }
    }

    const progressVideo = document.getElementById('video');
    progressVideo.addEventListener('timeupdate', () => {
      if (currentProgressContext && !progressVideo.paused) syncCurrentProgress(false, false);
    });
    progressVideo.addEventListener('pause', () => {
      if (currentProgressContext && !progressVideo.ended) syncCurrentProgress(true, false);
    });
    progressVideo.addEventListener('ended', () => {
      if (currentProgressContext) syncCurrentProgress(true, true);
    });

    initVodPlayerControl();
    initContent();
  </script>
<script>
  // Account state controls the small amount of chrome that differs by role.
  // Content and playback remain identical for every user.
  (async () => {
    const signOut = document.getElementById('signOutBtn');
    try {
      const gate = await (await fetch('/api/site/auth')).json();
      if (gate.authenticated && signOut) {
        signOut.style.display = 'inline-flex';
        signOut.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
          location.href = '/login';
        });
      }
      const isAdmin = !!(gate.user && gate.user.role === 'admin');
      document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = isAdmin ? '' : 'none';
      });
    } catch (_) {
      document.querySelectorAll('.admin-only').forEach(el => { el.style.display = 'none'; });
    }
  })();
</script>
</body>
