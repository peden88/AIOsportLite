    async function applySearch(raw, { persist = true } = {}) {
      const clean = String(raw || '').trim();
      setSearchContextVisible(
        !!clean || document.activeElement === document.getElementById('searchInput'),
        clean ? ('Results for “' + clean + '”') : 'Recent searches'
      );

      if (currentMode === 'sports' || currentMode === 'continue') {
        const query = clean.toLowerCase();
        const filtered = currentItems.filter(meta =>
          String(meta.name || '').toLowerCase().includes(query) ||
          String(meta.description || '').toLowerCase().includes(query)
        );
        renderGrid(filtered);
        if (clean.length >= 2) rememberSearch(clean);
        if (persist) persistUiState();
        return;
      }

      if (!clean) {
        if (currentCatalogState?.kind === 'vod') {
          const active = [...document.querySelectorAll('.tab')].find(tab => tab.classList.contains('active'));
          const catalog = {
            id:currentCatalogState.id,
            type:currentCatalogState.type,
            name:currentCatalogState.name
          };
          await loadVodCatalog(catalog, active, { push:false });
        } else {
          renderGrid(currentItems);
        }
        if (persist) persistUiState();
        return;
      }
      if (clean.length < 2) {
        if (persist) persistUiState();
        return;
      }

      beginGridTransition({ posterMode:true });
      try {
        const url = '/api/v1/vod/search?q=' + encodeURIComponent(clean) +
          (searchType ? ('&type=' + encodeURIComponent(searchType)) : '');
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Search failed');
        const results = [...(data.metas || [])].sort((a, b) =>
          progressMatchScore(b) - progressMatchScore(a)
        );
        document.getElementById('searchContextTitle').textContent =
          results.length + (results.length === 1 ? ' result' : ' results') +
          ' for “' + clean + '”';
        rememberSearch(clean);
        renderGrid(results);
      } catch (err) {
        console.error(err);
        setGridState('Search is temporarily unavailable.', true, () =>
          applySearch(clean, { persist:false })
        );
      }
      if (persist) persistUiState();
    }

    function makeImage(src, className, alt = '', options = {}) {
      const img = document.createElement('img');
      img.className = className + ' progressive-image';
      img.alt = alt;
      img.loading = options.loading || 'lazy';
      img.decoding = 'async';
      if (options.fetchPriority) img.fetchPriority = options.fetchPriority;
      const safe = safeImageUrl(src);
      if (safe) {
        const reveal = () => img.classList.add('is-loaded');
        img.addEventListener('load', reveal, { once:true });
        img.addEventListener('error', () => { img.style.display = 'none'; }, { once:true });
        img.src = safe;
        if (img.complete && img.naturalWidth > 0) reveal();
      } else {
        img.style.display = 'none';
      }
      return img;
    }

    function setProgressiveImage(img, src) {
      if (!img) return;
      const safe = safeImageUrl(src);
      img.classList.add('progressive-image');
      img.classList.remove('is-loaded');
      if (!safe) {
        img.removeAttribute('src');
        img.style.display = 'none';
        return;
      }
      img.style.display = 'block';
      const reveal = () => img.classList.add('is-loaded');
      img.addEventListener('load', reveal, { once:true });
      img.addEventListener('error', () => { img.style.display = 'none'; }, { once:true });
      img.src = safe;
      if (img.complete && img.naturalWidth > 0) reveal();
    }

    function focusCardInDirection(card, key) {
      const cards = [...grid().querySelectorAll('.card')].filter(node => node.offsetParent !== null);
      if (!cards.length) return false;
      const from = card.getBoundingClientRect();
      const fx = from.left + from.width / 2;
      const fy = from.top + from.height / 2;
      const direction = {
        ArrowLeft:[-1,0],
        ArrowRight:[1,0],
        ArrowUp:[0,-1],
        ArrowDown:[0,1]
      }[key];
      if (!direction) return false;

      let best = null;
      let bestScore = Infinity;
      for (const candidate of cards) {
        if (candidate === card) continue;
        const rect = candidate.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = cx - fx;
        const dy = cy - fy;
        if (direction[0] < 0 && dx >= -4) continue;
        if (direction[0] > 0 && dx <= 4) continue;
        if (direction[1] < 0 && dy >= -4) continue;
        if (direction[1] > 0 && dy <= 4) continue;

        const primary = direction[0] !== 0 ? Math.abs(dx) : Math.abs(dy);
        const secondary = direction[0] !== 0 ? Math.abs(dy) : Math.abs(dx);
        const score = primary + secondary * 2.4;
        if (score < bestScore) {
          bestScore = score;
          best = candidate;
        }
      }
      if (!best) return false;
      best.focus({ preventScroll:true });
      best.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
      return true;
    }

    function renderGrid(metas) {
      const host = grid();
      host.innerHTML = '';
      host.className = 'grid ' + (currentMode === 'sports' ? 'live-grid' : 'vod-grid');
      if (!Array.isArray(metas) || metas.length === 0) {
        setGridState('Nothing to show here right now.');
        return;
      }

      updateHero(metas[0]);

      for (const [metaIndex, meta] of metas.entries()) {
        const card = document.createElement('div');
        card.className = 'card' + (currentMode === 'sports' ? ' live-card' : '');
        card.dataset.contentId = String(meta.id || '');
        card.dataset.contentKey = cardIdentity(meta);

        card.tabIndex = 0;
        card.addEventListener('mouseenter', () => rememberCard(card, meta));
        card.addEventListener('focus', () => {
          const coarseLive = currentMode === 'sports' &&
            window.matchMedia?.('(hover:none), (pointer:coarse)')?.matches === true;
          if (coarseLive) {
            lastActiveCard = card;
          } else {
            rememberCard(card, meta);
            persistUiState();
          }
        });
        card.addEventListener('pointerdown', event => {
          lastActiveCard = card;
          if (currentMode !== 'sports' && event.pointerType !== 'mouse') {
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
              longPressedCards.add(card);
              showQuickActions(card, meta);
            }, 560);
          }
        });
        ['pointerup','pointercancel','pointerleave'].forEach(eventName => {
          card.addEventListener(eventName, () => clearTimeout(longPressTimer));
        });
        card.addEventListener('contextmenu', event => {
          if (currentMode === 'sports') return;
          event.preventDefault();
          showQuickActions(card, meta);
        });
        card.onkeydown = event => {
          if (event.target !== card) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            card.click();
            return;
          }
          if (focusCardInDirection(card, event.key)) {
            event.preventDefault();
          }
        };
        card.addEventListener('click', event => {
          if (!longPressedCards.has(card)) return;
          longPressedCards.delete(card);
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);

        if (currentMode === 'sports') {
          card.onclick = () => fetchAndPlay(meta.id, 'sport_event', '', null, card);
        } else {
          card.classList.add('vod-card');
          const vodType = String(meta.type || currentVodType || 'movie').toLowerCase();
          if (currentMode === 'continue' && meta._progress) {
            card.onclick = () => {
              const row = meta._progress;
              return fetchAndPlay(
                row.videoId || row.contentId,
                row.contentType === 'series' ? 'episode' : 'movie',
                row.contentType === 'series' ? 'series' : 'movie',
                row,
                card
              );
            };
          } else {
            card.onclick = vodType === 'series'
              ? () => openSeries(meta, card)
              : () => openMovie(meta, card);
          }
        }

        const posterBox = document.createElement('div');
        posterBox.className = 'poster-container';
        if (currentMode === 'sports') {
          const eager = metaIndex < 10;
          const priority = metaIndex < 4 ? 'high' : undefined;
          posterBox.appendChild(makeImage(
            meta.background || meta.poster,
            'background',
            '',
            { loading:eager ? 'eager' : 'lazy', fetchPriority:priority }
          ));
          posterBox.appendChild(makeImage(
            meta.poster,
            'poster',
            meta.name || '',
            { loading:eager ? 'eager' : 'lazy', fetchPriority:priority }
          ));
        } else {
          posterBox.appendChild(makeImage(meta.poster || meta.background, 'poster', meta.name || ''));
        }

        if (currentMode === 'sports' && meta.logo && meta.logo !== meta.poster) {
          posterBox.appendChild(makeImage(
            meta.logo,
            'logo',
            '',
            { loading:metaIndex < 10 ? 'eager' : 'lazy' }
          ));
        }

        const name = String(meta.name || '');
        if (currentMode === 'sports' && name.includes('🔴')) {
          const badge = document.createElement('div');
          badge.className = 'live-badge';
          badge.textContent = 'LIVE';
          posterBox.appendChild(badge);
        }

        if (currentMode !== 'sports') {
          if (meta._progress?.upNext || meta._progress?.source === 'aioplay_up_next') {
            const upNext = document.createElement('div');
            upNext.className = 'up-next-badge';
            upNext.textContent = 'UP NEXT';
            posterBox.appendChild(upNext);
          }

          const watchRow = meta._progress || (
            normalizedVodType(meta) === 'movie'
              ? cachedMovieProgress(meta.id)
              : cachedSeriesProgress(meta.id)
          );
          const watchPct = Number(watchRow?.progressPercent || 0);
          if (normalizedVodType(meta) === 'movie' && watchPct >= 90) {
            const watched = document.createElement('div');
            watched.className = 'watched-badge';
            watched.title = 'Watched';
            watched.textContent = '✓';
            posterBox.appendChild(watched);
          }

          const quick = document.createElement('button');
          quick.type = 'button';
          quick.className = 'card-quick-trigger';
          quick.setAttribute('aria-label', 'Title actions');
          quick.textContent = '⋯';
          quick.onclick = event => {
            event.preventDefault();
            event.stopPropagation();
            showQuickActions(quick, meta);
          };
          posterBox.appendChild(quick);
        }

        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = name.replace('🔴 [LIVE] ', '');
        const metaLine = document.createElement('div');
        metaLine.className = 'card-meta-line';
        cardMetadataLabels(meta).forEach(label => {
          const span = document.createElement('span');
          span.textContent = label;
          metaLine.appendChild(span);
        });

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = String(meta.description || '');
        info.append(title);
        if (currentMode !== 'sports' && metaLine.childElementCount) {
          info.appendChild(metaLine);
        }
        info.appendChild(desc);

        const progressRow = meta._progress || (
          currentMode !== 'sports' && normalizedVodType(meta) === 'movie'
            ? cachedMovieProgress(meta.id)
            : null
        );
        if (progressRow) {
          if (meta._progress) {
            const continuity = continuityLabel(meta._progress);
            if (continuity) {
              const badge = document.createElement('div');
              badge.className = 'continuity-badge';
              badge.textContent = continuity;
              info.appendChild(badge);
            }
          }
          const pct = Number(progressRow.progressPercent);
          const fallbackPct = Number(progressRow.duration) > 0
            ? (Number(progressRow.position || 0) / Number(progressRow.duration)) * 100
            : 0;
          const resolvedPct = Math.max(0, Math.min(100, Number.isFinite(pct) ? pct : fallbackPct));
          if (resolvedPct > 0 && resolvedPct < 90) {
            const track = document.createElement('div');
            track.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = 'progress-fill';
            fill.style.width = resolvedPct + '%';
            track.appendChild(fill);
            info.appendChild(track);
          }
        }

        card.append(posterBox, info);
        host.appendChild(card);
        observeCardMetadata(card, meta);

        if (
          String(savedUiState()?.focusedKey || '') === card.dataset.contentKey ||
          (
            !savedUiState()?.focusedKey &&
            String(savedUiState()?.focusedId || '') === card.dataset.contentId
          )
        ) {
          lastActiveCard = card;
        }
      }
      finishGridTransition();
    }

    function progressIdentityKey(row) {
      const type = String(row?.contentType || '').toLowerCase();
      const series = type === 'series' || type === 'tv' || type === 'episode';
      if (!series) return 'movie|' + String(row?.contentId || '');
      const season = row?.season == null ? null : String(row.season);
      const episode = row?.episode == null ? null : String(row.episode);
      const videoId = String(row?.videoId || '');
      if (season !== null && episode !== null) {
        return 'series|' + String(row?.contentId || '') + '|' + season + '|' + episode;
      }
      return 'series|' + String(row?.contentId || '') + '|video|' + videoId;
    }

    function cachedMovieProgress(contentId) {
      return sharedProgressItems.find(row =>
        String(row.contentType || '').toLowerCase() === 'movie' &&
        String(row.contentId || '') === String(contentId || '')
      ) || null;
    }

    function cachedSeriesProgress(contentId) {
      return sharedProgressItems
        .filter(row =>
          ['series','tv','episode'].includes(String(row.contentType || '').toLowerCase()) &&
          String(row.contentId || '') === String(contentId || '')
        )
        .sort((a, b) => Number(b.lastWatched || 0) - Number(a.lastWatched || 0))[0] || null;
    }

    function cachedEpisodeProgress(meta, video) {
      const contentId = String(meta?.id || '');
      const videoId = String(video?.id || '');
      const season = video?.season == null ? null : Number(video.season);
      const episode = video?.episode == null ? null : Number(video.episode);
      return sharedProgressItems.find(row => {
        const type = String(row.contentType || '').toLowerCase();
        if (type !== 'series' && type !== 'tv' && type !== 'episode') return false;
        if (String(row.contentId || '') !== contentId) return false;
        if (season != null && episode != null) {
          return Number(row.season) === season && Number(row.episode) === episode;
        }
        return String(row.videoId || '') === videoId;
      }) || null;
    }

    function progressContextForMovie(meta) {
      const existing = cachedMovieProgress(meta.id);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'movie',
        name: meta.name || existing?.name || 'Movie',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: meta.id,
        season: null,
        episode: null,
        episodeTitle: null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    function progressContextForEpisode(meta, video) {
      const existing = cachedEpisodeProgress(meta, video);
      return {
        ...(existing || {}),
        contentId: meta.id,
        contentType: 'series',
        name: meta.name || existing?.name || 'Series',
        poster: meta.poster || existing?.poster || null,
        backdrop: meta.background || existing?.backdrop || null,
        logo: meta.logo || existing?.logo || null,
        videoId: video.id,
        season: Number.isFinite(Number(video.season)) ? Number(video.season) : null,
        episode: Number.isFinite(Number(video.episode)) ? Number(video.episode) : null,
        episodeTitle: video.title || video.name || existing?.episodeTitle || null,
        position: Number(existing?.position || 0),
        duration: Number(existing?.duration || 0),
        progressPercent: Number(existing?.progressPercent || 0),
        lastWatched: Number(existing?.lastWatched || Date.now()),
        source: 'aioplay_web'
      };
    }

    async function syncCurrentProgress(force = false, completed = false) {
      const row = currentProgressContext;
      if (!row) return;
      const video = document.getElementById('video');
      const now = Date.now();
      if (!force && now - lastProgressSyncAt < 10000) return;

      const durationMs = Number.isFinite(video.duration) && video.duration > 0
        ? Math.round(video.duration * 1000)
        : Number(row.duration || 0);
      let positionMs = Number.isFinite(video.currentTime) && video.currentTime > 0
        ? Math.round(video.currentTime * 1000)
        : Number(row.position || 0);

      if (completed && durationMs > 0) positionMs = durationMs;
      if (positionMs <= 0 && Number(row.position || 0) <= 0) return;

      const next = {
        ...row,
        position: Math.max(0, positionMs),
        duration: Math.max(0, durationMs),
        progressPercent: completed
          ? 100
          : (durationMs > 0 ? Math.max(0, Math.min(100, (positionMs / durationMs) * 100)) : Number(row.progressPercent || 0)),
        lastWatched: now,
        source: 'aioplay_web'
      };
      currentProgressContext = next;
      lastProgressSyncAt = now;
      const nextKey = progressIdentityKey(next);
      const existingIndex = sharedProgressItems.findIndex(row => progressIdentityKey(row) === nextKey);
      if (existingIndex >= 0) sharedProgressItems[existingIndex] = next;
      else sharedProgressItems.unshift(next);

      try {
        await fetch('/api/v1/progress', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: next }),
          keepalive: force
        });
      } catch (_) {}
    }

    function applyResumePosition(video) {
      const row = currentProgressContext;
      if (!row || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const resumeSeconds = Number(row.position || 0) / 1000;
      if (resumeSeconds <= 0) return;
      if (resumeSeconds >= video.duration * 0.90) return;
      if (Math.abs(video.currentTime - resumeSeconds) > 2) {
        try { video.currentTime = Math.min(resumeSeconds, Math.max(0, video.duration - 2)); } catch (_) {}
      }
    }

    function fillDetailsMeta(meta) {
      const host = document.getElementById('detailsMeta');
      if (!host) return;
      host.innerHTML = '';
      cardMetadataLabels(meta).forEach(label => {
        const span = document.createElement('span');
        span.textContent = label;
        host.appendChild(span);
      });
    }

    function setDetailsTitleArt(meta) {
      const logo = document.getElementById('detailsLogo');
      const copy = document.getElementById('detailsCopy');
      if (!logo || !copy) return;

      const artwork = safeImageUrl(
        meta?.logo ||
        meta?.titleLogo ||
        meta?.titleArt ||
        meta?.clearLogo
      );

      if (!artwork) {
        logo.hidden = true;
        logo.removeAttribute('src');
        logo.classList.remove('is-loaded');
        copy.classList.remove('has-title-art');
        return;
      }

      logo.hidden = false;
      copy.classList.add('has-title-art');
      setProgressiveImage(logo, artwork);
    }

    function setDetailsBackdrop(meta) {
      const backdrop = document.getElementById('detailsBackdrop');
      if (!backdrop) return;

      const primary = safeImageUrl(
        meta?.background ||
        meta?.backdrop ||
        meta?.backdropUrl
      );
      const fallback = safeImageUrl(meta?.poster);
      const artwork = primary || fallback;
      const token = ++detailsBackdropToken;

      if (!artwork) {
        backdrop.classList.remove('is-visible', 'poster-fallback');
        backdrop.style.backgroundImage = '';
        return;
      }

      const preload = new Image();
      preload.onload = () => {
        if (token !== detailsBackdropToken) return;
        backdrop.style.backgroundImage =
          'url("' + artwork.replace(/"/g, '%22') + '")';
        backdrop.classList.toggle('poster-fallback', !primary);
        backdrop.classList.add('is-visible');
      };
      preload.onerror = () => {
        if (token !== detailsBackdropToken) return;
        backdrop.classList.remove('is-visible', 'poster-fallback');
        backdrop.style.backgroundImage = '';
      };
      preload.src = artwork;
    }

    function mountedViewMatchesSnapshot(snapshot) {
      if (!snapshot || snapshot.mode !== currentMode) return false;

      const expected = snapshot.catalog || null;
      const mounted = currentCatalogState || null;
      if (!!expected !== !!mounted) return false;
      if (expected && mounted) {
        if (String(expected.kind || '') !== String(mounted.kind || '')) return false;
        if (String(expected.id || '') !== String(mounted.id || '')) return false;
        if (String(expected.type || '') !== String(mounted.type || '')) return false;
      }

      const currentSearch = document.getElementById('searchInput')?.value || '';
      if (String(snapshot.search || '') !== String(currentSearch)) return false;
      if (String(snapshot.searchType || '') !== String(searchType || '')) return false;
      return grid().childElementCount > 0;
    }

    function configureMovieHeroAction(meta) {
      const slot = document.getElementById('detailsHeroAction');
      const play = document.getElementById('detailsMoviePlay');
      const label = document.getElementById('detailsMoviePlayLabel');
      if (!slot || !play || !label || !meta?.id) return;

      const progress = cachedMovieProgress(meta.id);
      const resume = !!(
        progress &&
        Number(progress.progressPercent || 0) > 0 &&
        Number(progress.progressPercent || 0) < 90
      );

      slot.hidden = false;
      label.textContent = resume ? 'Resume' : 'Play';
      play.setAttribute('aria-label', resume ? 'Resume movie' : 'Play movie');
      play.title = resume ? 'Resume' : 'Play';
      play.onclick = () => fetchAndPlay(
        currentDetailsMeta?.id || meta.id,
        'movie',
        'movie',
        resume
          ? progress
          : progressContextForMovie(currentDetailsMeta || meta),
        document.getElementById('detailsPoster')
      );
    }

    function prepareDetailsShell(preview, type) {
      const overlay = document.getElementById('details-overlay');
      const list = document.getElementById('episodeList');
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      const actions = document.getElementById('detailsActions');
      const heroAction = document.getElementById('detailsHeroAction');
      const heroPlay = document.getElementById('detailsMoviePlay');
      document.body.classList.add('details-open');
      overlay.style.display = 'block';
      seasonControl.style.display = 'none';
      seasonSelect.innerHTML = '';
      seasonSelect.onchange = null;
      actions.innerHTML = '';
      if (heroAction) heroAction.hidden = true;
      if (heroPlay) heroPlay.onclick = null;
      currentDetailsMeta = { ...preview, type };
      document.getElementById('detailsTitle').textContent = preview.name || (type === 'movie' ? 'Movie' : 'Series');
      document.getElementById('detailsDescription').textContent = preview.description || '';
      setDetailsTitleArt(preview);
      setDetailsBackdrop(preview);
      fillDetailsMeta(preview);
      const poster = document.getElementById('detailsPoster');
      setProgressiveImage(poster, preview.poster || preview.background);
      list.innerHTML = type === 'series'
        ? '<div style="color:var(--text-muted);">Loading episodes...</div>'
        : '';
    }

    async function openMovie(preview, sourceElement = null) {
      const source = sourceElement?.querySelector?.('.poster-container') || sourceElement;
      await withSharedTransition(
        source,
        async () => prepareDetailsShell(preview, 'movie'),
        () => document.getElementById('detailsPoster')
      );
      persistUiState({ push:true, overlay:'details' });
      configureMovieHeroAction(currentDetailsMeta);

      const meta = await loadMetaFor({ ...preview, type:'movie' }) || preview;
      currentDetailsMeta = { ...preview, ...meta, type:'movie' };
      document.getElementById('detailsTitle').textContent = currentDetailsMeta.name || preview.name || 'Movie';
      document.getElementById('detailsDescription').textContent = currentDetailsMeta.description || preview.description || '';
      setDetailsTitleArt(currentDetailsMeta);
      setDetailsBackdrop(currentDetailsMeta);
      fillDetailsMeta(currentDetailsMeta);
      const poster = document.getElementById('detailsPoster');
      setProgressiveImage(poster, currentDetailsMeta.poster || preview.poster);
      configureMovieHeroAction(currentDetailsMeta);

      const actions = document.getElementById('detailsActions');
      const progress = cachedMovieProgress(currentDetailsMeta.id);
      if (progress && Number(progress.progressPercent || 0) > 0) {
        const restart = document.createElement('button');
        restart.type = 'button';
        restart.textContent = 'Restart';
        restart.onclick = () => fetchAndPlay(
          currentDetailsMeta.id,
          'movie',
          'movie',
          { ...progress, position:0, progressPercent:0 },
          document.getElementById('detailsPoster')
        );
        actions.appendChild(restart);
      }
    }

    async function openSeries(preview, sourceElement = null) {
      const previousDetailsId = currentDetailsMeta?.id || currentDetailsMeta?.contentId || '';
      if (String(previousDetailsId) !== String(preview.id || '')) {
        currentDetailsSeason = null;
        currentDetailsEpisodeId = '';
      }
      const type = 'series';
      const cacheKey = type + '|' + preview.id;
      const list = document.getElementById('episodeList');
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      const source = sourceElement?.querySelector?.('.poster-container') || sourceElement;
      await withSharedTransition(
        source,
        async () => prepareDetailsShell(preview, 'series'),
        () => document.getElementById('detailsPoster')
      );
      persistUiState({ push:true, overlay:'details' });
      const poster = document.getElementById('detailsPoster');

      try {
        let meta = vodMetaCache.get(cacheKey) || null;
        if (!meta) {
          const res = await fetch('/api/v1/vod/meta/series/' + encodeURIComponent(preview.id));
          const body = await res.json();
          if (!res.ok || !body.meta) throw new Error(body.error || 'Metadata failed');
          meta = body.meta;
          vodMetaCache.set(cacheKey, meta);
        }
        currentDetailsMeta = { ...preview, ...meta, type:'series' };
        document.getElementById('detailsTitle').textContent = meta.name || preview.name || 'Series';
        document.getElementById('detailsDescription').textContent = meta.description || preview.description || '';
        setDetailsTitleArt(currentDetailsMeta);
        setDetailsBackdrop(currentDetailsMeta);
        fillDetailsMeta(currentDetailsMeta);
        setProgressiveImage(poster, meta.poster || preview.poster);

        const videos = Array.isArray(meta.videos) ? meta.videos.filter(v => v && v.id) : [];
        videos.sort((a, b) =>
          (Number(a.season) || 0) - (Number(b.season) || 0) ||
          (Number(a.episode) || 0) - (Number(b.episode) || 0)
        );

        if (!videos.length) {
          list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available in metadata for this title.</div>';
          return;
        }

        const seasons = [...new Set(videos.map(video => Number(video.season) || 0))].sort((a, b) => a - b);
        const defaultSeason = seasons.find(season => season > 0) ?? seasons[0];

        for (const season of seasons) {
          const option = document.createElement('option');
          option.value = String(season);
          option.textContent = season > 0 ? ('Season ' + season) : 'Specials';
          seasonSelect.appendChild(option);
        }

        const renderSeason = season => {
          list.innerHTML = '';
          setupEpisodeRail(list);
          const selected = videos.filter(video => (Number(video.season) || 0) === season);

          if (!selected.length) {
            list.innerHTML = '<div style="color:var(--text-muted);">No episodes are available for this season.</div>';
            return;
          }

          selected.forEach((video, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'episode-btn';
            button.dataset.videoId = String(video.id);

            const watchedProgress = cachedEpisodeProgress(meta, video);
            const progressPercent = Number(watchedProgress?.progressPercent || 0);
            if (progressPercent >= 90) {
              button.classList.add('is-watched');
            }

            const ep = Number(video.episode) || 0;
            const seasonNumber = Number(video.season) || season;
            const episodeTitle = video.title || video.name || ('Episode ' + (ep || index + 1));
            const code = ep ? ('E' + ep) : ('EP ' + (index + 1));
            button.setAttribute(
              'aria-label',
              (seasonNumber > 0 ? ('Season ' + seasonNumber + ', ') : '') +
              code + ', ' + episodeTitle
            );

            const thumb = document.createElement('div');
            thumb.className = 'episode-thumb';
            const thumbnailUrl =
              video.thumbnail ||
              video.background ||
              video.poster ||
              video.image ||
              meta.background ||
              meta.backdrop ||
              meta.poster;
            thumb.appendChild(makeImage(
              thumbnailUrl,
              'episode-image',
              episodeTitle,
              {
                loading:index < 4 ? 'eager' : 'lazy',
                fetchPriority:index < 2 ? 'high' : undefined
              }
            ));

            const number = document.createElement('span');
            number.className = 'episode-number';
            number.textContent = code;
            thumb.appendChild(number);

            if (progressPercent >= 90) {
              const watched = document.createElement('span');
              watched.className = 'episode-watched';
              watched.title = 'Watched';
              watched.textContent = '✓';
              thumb.appendChild(watched);
            } else if (progressPercent > 0) {
              const track = document.createElement('div');
              track.className = 'episode-progress-track';
              const fill = document.createElement('div');
              fill.className = 'episode-progress-fill';
              fill.style.width = Math.max(0, Math.min(100, progressPercent)) + '%';
              track.appendChild(fill);
              thumb.appendChild(track);
            }

            const copy = document.createElement('div');
            copy.className = 'episode-copy';

            const title = document.createElement('div');
            title.className = 'episode-title';
            title.textContent = code + ' · ' + episodeTitle;
            copy.appendChild(title);

            const overviewText = String(video.overview || video.description || '').trim();
            if (overviewText) {
              const overview = document.createElement('div');
              overview.className = 'episode-overview';
              overview.textContent = overviewText;
              copy.appendChild(overview);
            }

            button.append(thumb, copy);

            button.addEventListener('keydown', event => {
              if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
              const sibling = event.key === 'ArrowLeft'
                ? button.previousElementSibling
                : button.nextElementSibling;
              if (!(sibling instanceof HTMLElement)) return;
              event.preventDefault();
              sibling.focus({ preventScroll:true });
              sibling.scrollIntoView({
                block:'nearest',
                inline:'center',
                behavior:'smooth'
              });
            });

            button.onclick = async () => {
              currentDetailsEpisodeId = String(video.id);
              currentDetailsSeason = Number(video.season) || 0;
              await fetchAndPlay(
                video.id,
                'episode',
                'series',
                progressContextForEpisode(meta, video),
                thumb
              );
            };

            list.appendChild(button);
          });

          restoreDetailsEpisodeFocus();
        };

        const selectedSeason = currentDetailsSeason != null && seasons.includes(Number(currentDetailsSeason))
          ? Number(currentDetailsSeason)
          : defaultSeason;
        seasonSelect.value = String(selectedSeason);
        seasonSelect.onchange = () => {
          currentDetailsSeason = Number(seasonSelect.value) || 0;
          renderSeason(currentDetailsSeason);
          persistUiState({ overlay:'details' });
        };
        seasonControl.style.display = 'flex';
        renderSeason(selectedSeason);
        restoreDetailsEpisodeFocus();
      } catch (err) {
        console.error(err);
        seasonControl.style.display = 'none';
        list.innerHTML = '<div style="color:var(--accent);">Could not load episodes.</div>';
      }
    }

    let detailsDismissPromise = null;

    function reducedMotionActive() {
      if (document.documentElement.classList.contains('force-motion')) return false;
      if (document.documentElement.classList.contains('reduce-motion')) return true;
      return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;
    }

    function animateDetailsDismiss() {
      const overlay = document.getElementById('details-overlay');
      if (!overlay || overlay.style.display !== 'block') return Promise.resolve();
      if (detailsDismissPromise) return detailsDismissPromise;

      // Keep the underlying catalog dimmed while Details fades away. This
      // avoids the double-exposure/ghosting seen on mobile Safari. Once the
      // overlay is hidden, closeDetails() removes details-open and the cached
      // catalog itself eases from 28% back to full opacity.
      overlay.classList.add('details-fading');

      detailsDismissPromise = new Promise(resolve => {
        setTimeout(resolve, reducedMotionActive() ? 0 : 165);
      }).finally(() => {
        detailsDismissPromise = null;
      });
      return detailsDismissPromise;
    }

    function closeDetails({ restoreFocus = true, persist = true } = {}) {
      document.body.classList.remove('details-open');
      const overlay = document.getElementById('details-overlay');
      const shell = overlay?.querySelector('.details-shell');
      if (overlay) {
        overlay.classList.remove('details-fading');
        overlay.style.display = 'none';
      }
      if (shell) {
        shell.classList.remove(
          'details-dragging',
          'details-dismissing',
          'details-snap-back'
        );
        shell.style.transform = '';
        shell.style.opacity = '';
      }

      document.getElementById('episodeList').innerHTML = '';
      document.getElementById('detailsActions').innerHTML = '';
      document.getElementById('detailsMeta').innerHTML = '';
      const heroAction = document.getElementById('detailsHeroAction');
      const heroPlay = document.getElementById('detailsMoviePlay');
      if (heroAction) heroAction.hidden = true;
      if (heroPlay) heroPlay.onclick = null;
      const seasonControl = document.getElementById('seasonControl');
      const seasonSelect = document.getElementById('seasonSelect');
      if (seasonControl) seasonControl.style.display = 'none';
      if (seasonSelect) {
        seasonSelect.innerHTML = '';
        seasonSelect.onchange = null;
      }
      if (persist) persistUiState();
      if (restoreFocus) restoreLastCardFocus();
    }

    async function closeDetailsFromUi() {
      const overlay = document.getElementById('details-overlay');
      if (!overlay || overlay.style.display !== 'block') return;
      const historyOwned = history.state?.aioplay?.overlay === 'details';

      await animateDetailsDismiss();
      closeDetails({
        restoreFocus:true,
        persist:!historyOwned
      });

      if (historyOwned) {
        history.back();
      }
    }

    function showPlaybackLoading(text = 'Loading stream...') {
      const loader = document.getElementById('loader');
      const message = document.getElementById('playback-message');
      const video = document.getElementById('video');
      loader.style.display = 'flex';
      const line = loader.querySelector('div:last-child');
      if (line) line.textContent = text;
      message.style.display = 'none';
      video.style.opacity = '0';
    }

    function showPlaybackFailure(detail = '') {
      document.getElementById('loader').style.display = 'none';
      const message = document.getElementById('playback-message');
      message.style.display = 'block';
      const span = message.querySelector('span');
      if (span) span.textContent = detail || 'There are no working streams for this event right now.';
      document.getElementById('video').style.opacity = '0';
    }

    function stopPlaybackHeartbeat() {
      if (playbackHeartbeatTimer) {
        clearInterval(playbackHeartbeatTimer);
        playbackHeartbeatTimer = null;
      }
    }

    function startPlaybackHeartbeat(sessionId, generation) {
      stopPlaybackHeartbeat();
      if (!sessionId) return;
      const beat = async () => {
        if (generation !== playbackGeneration || currentPlaybackSession !== sessionId) return;
        try {
          const res = await fetch(
            '/api/v1/playback/' + encodeURIComponent(sessionId) + '/heartbeat',
            { method: 'POST' }
          );
          if (res.ok) return;
          const data = await res.json().catch(() => ({}));
          if (generation !== playbackGeneration) return;
          stopPlaybackHeartbeat();
          currentPlaybackSession = null;
          stopVideoEngine();
          showPlaybackFailure(data.error || 'This playback session is no longer active.');
        } catch (_) {
          // A transient network error should not tear down playback. The server
          // lease itself expires if heartbeats genuinely stop.
        }
      };
      playbackHeartbeatTimer = setInterval(beat, 30000);
    }

    async function fetchAndPlay(
      id,
      contentType,
      stremioType,
      progressContext = null,
      sourceElement = null
    ) {
      const priorReturnToDetails = playerReturnToDetails;
      const preservePlayerOrigin = sourceElement?.id === 'playerBackdrop';
      await closePlayer(false, { returnToOrigin:false });
      currentProgressContext = progressContext;
      lastProgressSyncAt = 0;
      const generation = ++playbackGeneration;
      currentPlaybackKind = contentType;
      const matchingItem = currentItems.find(item => String(item.id) === String(id));
      const playbackMeta = progressContext
        ? {
            ...(matchingItem || {}),
            ...progressContext,
            background: progressContext.backdrop || matchingItem?.background,
            parentName: progressContext.name || matchingItem?.name
          }
        : (matchingItem || { id, name: String(id) });
      setPlayerPresentation(playbackMeta, contentType);
      const detailsWasOpen = document.getElementById('details-overlay').style.display === 'block';
      playerReturnToDetails = detailsWasOpen ||
        (preservePlayerOrigin ? priorReturnToDetails : false);
      const transitionSource = sourceElement?.querySelector?.('.poster-container') || sourceElement;
      await withSharedTransition(
        transitionSource,
        async () => {
          if (detailsWasOpen) {
            document.body.classList.remove('details-open');
            document.getElementById('details-overlay').style.display = 'none';
          }
          document.getElementById('player-overlay').style.display = 'flex';
          document.body.classList.add('player-open');
        },
        () => document.getElementById('playerBackdrop')
      );
      persistUiState({ push:true, overlay:'player' });
      showPlayerHud(true);
      showPlaybackLoading('Finding a working stream...');
      prepareNextEpisode(progressContext);

      try {
        const payload = {
          contentType,
          id,
          title: (progressContext && progressContext.episodeTitle)
            || (progressContext && progressContext.name)
            || (matchingItem && matchingItem.name)
            || id
        };
        if (progressContext) {
          payload.parentId = progressContext.contentType === 'series'
            ? (progressContext.contentId || '')
            : '';
          payload.parentName = progressContext.contentType === 'series'
            ? (progressContext.name || '')
            : '';
          payload.season = progressContext.season ?? null;
          payload.episode = progressContext.episode ?? null;
          payload.episodeTitle = progressContext.episodeTitle || '';
        }
        if (stremioType) payload.stremioType = stremioType;

        const res = await fetch('/api/v1/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return;

        if (!res.ok || !data.ok || !data.playback) {
          showPlaybackFailure(data.error || '');
          return;
        }

        currentPlaybackSession = data.sessionId || null;
        setPlayerPresentation(currentPlaybackMeta, contentType);
        startPlaybackHeartbeat(currentPlaybackSession, generation);
        const isVod = contentType !== 'sport_event' && contentType !== 'live_channel' && contentType !== 'sport';
        const preference = isVod ? vodPlayerPreference() : 'internal';

        if (isVod && preference === 'ask') {
          pendingVodPlayback = {
            target: data.playback,
            generation
          };
          document.getElementById('player-choice-overlay').style.display = 'flex';
          showPlaybackLoading('Choose a player…');
          return;
        }

        if (isVod && preference !== 'internal') {
          const opened = await openCurrentVodInExternalPlayer(preference, generation);
          if (opened) return;
        }

        await playOpaqueTarget(data.playback, generation);
      } catch (err) {
        console.error('Playback start failed', err);
        if (generation === playbackGeneration) showPlaybackFailure();
      }
    }

    function closeVodPlayerChoice() {
      pendingVodPlayback = null;
      document.getElementById('player-choice-overlay').style.display = 'none';
      closePlayer();
    }

    async function chooseVodPlayer(kind) {
      const pending = pendingVodPlayback;
      pendingVodPlayback = null;
      document.getElementById('player-choice-overlay').style.display = 'none';
      if (!pending || pending.generation !== playbackGeneration) return;

      if (kind === 'internal') {
        await playOpaqueTarget(pending.target, pending.generation);
        return;
      }

      const opened = await openCurrentVodInExternalPlayer(kind, pending.generation);
      if (!opened && pending.generation === playbackGeneration) {
        await playOpaqueTarget(pending.target, pending.generation);
      }
    }

    async function openCurrentVodInExternalPlayer(kind, generation) {
      if (generation !== playbackGeneration || !currentPlaybackSession) return false;
      if ((kind === 'strexo' || kind === 'custom') && !ensurePlayerTemplate(kind)) {
        return false;
      }

      try {
        const session = currentPlaybackSession;
        const res = await fetch(
          '/api/v1/playback/' + encodeURIComponent(session) + '/external',
          { method: 'POST' }
        );
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return true;
        if (!res.ok || !data.ok || !data.url) {
          console.warn('External playback bridge unavailable', data.error || res.status);
          return false;
        }

        const launched = triggerExternalPlayer(kind, data.url);
        if (!launched) return false;

        stopPlaybackHeartbeat();
        currentPlaybackSession = null;
        requestingFallback = false;
        currentProgressContext = null;
        lastProgressSyncAt = 0;
        playbackGeneration++;
        document.getElementById('player-overlay').style.display = 'none';
        document.body.classList.remove('player-open');
        document.getElementById('playback-message').style.display = 'none';
        stopVideoEngine();
        // The external-player bridge now owns the lease and keeps it alive from
        // the proxied media traffic. Do not DELETE the session here.
        return true;
      } catch (err) {
        console.error('External playback failed', err);
        return false;
      }
    }

    async function requestNextPlayback(generation) {
      if (generation !== playbackGeneration || requestingFallback) return;
      if (!currentPlaybackSession) {
        showPlaybackFailure();
        return;
      }

      requestingFallback = true;
      showPlayerHud(true);
      showPlaybackLoading('Switching source…');
      stopVideoEngine();

      try {
        const res = await fetch('/api/v1/playback/' + encodeURIComponent(currentPlaybackSession) + '/next', {
          method: 'POST'
        });
        const data = await res.json().catch(() => ({}));
        if (generation !== playbackGeneration) return;

        if (!res.ok || !data.ok || !data.playback) {
          stopPlaybackHeartbeat();
          currentPlaybackSession = null;
          showPlaybackFailure(data.error || '');
          return;
        }

        await playOpaqueTarget(data.playback, generation);
      } catch (err) {
        console.error('Playback fallback failed', err);
        if (generation === playbackGeneration) showPlaybackFailure();
      } finally {
        requestingFallback = false;
      }
    }

    async function playOpaqueTarget(target, generation) {
      if (generation !== playbackGeneration || !target) return;

      // Sports still has a few signed web-player fallbacks. VOD never receives
      // external targets: its gateway accepts only in-player media URLs.
      if (target.kind === 'external') {
        const popup = window.open(target.url, '_blank', 'noopener,noreferrer');
        if (popup) await closePlayer();
        else window.location.assign(target.url);
        return;
      }

      const url = target.url;
      if (!url) return requestNextPlayback(generation);

      const video = document.getElementById('video');
      showPlaybackLoading('Starting playback...');
      if (currentProgressContext) {
        video.addEventListener('loadedmetadata', () => applyResumePosition(video), { once: true });
      }
      const useHls = currentPlaybackKind === 'sport_event' || /\.m3u8(?:$|[?#])/i.test(url);

      if (useHls && Hls.isSupported()) {
        stopVideoEngine();
        hls = new Hls({
          maxBufferLength: 30,
          xhrSetup: xhr => {
            for (const [key, value] of Object.entries(target.requestHeaders || {})) {
              try { xhr.setRequestHeader(key, String(value)); } catch (_) {}
            }
          }
        });
        let started = false;

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (generation !== playbackGeneration) return;
          started = true;
          document.getElementById('loader').style.display = 'none';
          video.style.opacity = '1';
          showPlayerHud(false);
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (generation !== playbackGeneration || !data || !data.fatal) return;
          if (!started || data.type === Hls.ErrorTypes.NETWORK_ERROR || data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            requestNextPlayback(generation);
          }
        });

        hls.loadSource(url);
        hls.attachMedia(video);
        return;
      }

      stopVideoEngine();
      const loaded = () => {
        if (generation !== playbackGeneration) return;
        document.getElementById('loader').style.display = 'none';
        video.style.opacity = '1';
        showPlayerHud(false);
        video.play().catch(() => {});
      };
      const failed = () => requestNextPlayback(generation);
      video.addEventListener('loadedmetadata', loaded, { once: true });
      video.addEventListener('error', failed, { once: true });
      video.src = url;
      video.load();
    }

    function stopVideoEngine() {
      const video = document.getElementById('video');
      if (hls) {
        hls.destroy();
        hls = null;
      }
      try { video.pause(); } catch (_) {}
      video.removeAttribute('src');
      video.load();
    }

    async function closePlayer(invalidate = true, { returnToOrigin = true } = {}) {
      const session = currentPlaybackSession;
      if (currentProgressContext) {
        await syncCurrentProgress(true, false);
      }
      stopPlaybackHeartbeat();
      currentPlaybackSession = null;
      requestingFallback = false;
      pendingVodPlayback = null;
      currentProgressContext = null;
      currentPlaybackMeta = null;
      currentNextEpisode = null;
      lastProgressSyncAt = 0;
      clearTimeout(playerHudTimer);
      const nextUp = document.getElementById('playerNextUp');
      if (nextUp) nextUp.hidden = true;
      const chooser = document.getElementById('player-choice-overlay');
      if (chooser) chooser.style.display = 'none';
      if (invalidate) playbackGeneration++;

      const overlay = document.getElementById('player-overlay');
      overlay.classList.remove('mini');
      document.getElementById('miniPlayerBar').hidden = true;
      overlay.style.display = 'none';
      document.body.classList.remove('player-open');
      document.getElementById('playback-message').style.display = 'none';
      document.getElementById('playerBackdrop').style.backgroundImage = '';
      stopVideoEngine();

      if (returnToOrigin && playerReturnToDetails && currentDetailsMeta) {
        document.body.classList.add('details-open');
        document.getElementById('details-overlay').style.display = 'block';
        persistUiState({ overlay:'details' });
        restoreDetailsEpisodeFocus();
      } else if (returnToOrigin) {
        persistUiState();
        restoreLastCardFocus();
      }
      if (returnToOrigin) playerReturnToDetails = false;

      if (session) {
        try {
          await fetch('/api/v1/playback/' + encodeURIComponent(session), { method: 'DELETE' });
        } catch (_) {}
      }
    }

    function closePlayerFromUi() {
      const overlay = document.getElementById('player-overlay');
      if (overlay?.classList.contains('mini')) {
        closePlayer();
        return;
      }
      if (history.state?.aioplay?.overlay === 'player') {
        history.back();
      } else {
        closePlayer();
      }
    }

    const progressVideo = document.getElementById('video');
    progressVideo.addEventListener('timeupdate', () => {
      updatePlayerTimeline(progressVideo);
      updateNextUpVisibility(progressVideo);
      if (currentProgressContext && !progressVideo.paused) syncCurrentProgress(false, false);
    });
    progressVideo.addEventListener('loadedmetadata', () => {
      updatePlayerTimeline(progressVideo);
      renderPlayerTimelineMarkers(progressVideo);
    });
    progressVideo.addEventListener('pause', () => {
      showPlayerHud(true);
      if (currentProgressContext && !progressVideo.ended) syncCurrentProgress(true, false);
    });
    progressVideo.addEventListener('play', () => showPlayerHud(false));
    progressVideo.addEventListener('ended', async () => {
      showPlayerHud(true);
      if (currentProgressContext) {
        await syncCurrentProgress(true, true);
      }
      if (currentMode === 'continue') {
        loadContinueWatching({ push:false });
      }
    });

    const playerOverlay = document.getElementById('player-overlay');
    ['mousemove', 'pointerdown', 'touchstart'].forEach(eventName => {
      playerOverlay.addEventListener(eventName, () => showPlayerHud(false), { passive: true });
    });
    document.getElementById('playerMinimize').addEventListener('click', minimizePlayer);
    document.getElementById('miniExpand').addEventListener('click', expandPlayer);
    document.getElementById('miniClose').addEventListener('click', () => closePlayerFromUi());
    document.getElementById('playerSwitchSource').addEventListener('click', () => {
      if (currentPlaybackSession && !requestingFallback) {
        requestNextPlayback(playbackGeneration);
      }
    });
    document.getElementById('playerNextUp').addEventListener('click', async () => {
      const next = currentNextEpisode;
      if (!next) return;
      await fetchAndPlay(
        next.video.id,
        'episode',
        'series',
        next.progress,
        document.getElementById('playerBackdrop')
      );
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (document.getElementById('player-choice-overlay').style.display === 'flex') {
          closeVodPlayerChoice();
        } else if (document.getElementById('player-overlay').style.display === 'flex') {
          closePlayerFromUi();
        } else if (document.getElementById('details-overlay').style.display === 'block') {
          closeDetailsFromUi();
        } else if (document.getElementById('searchInput').value) {
          event.preventDefault();
          document.getElementById('searchInput').value = '';
          setSearchType('', { rerun:false });
          applySearch('');
        } else if (document.getElementById('searchContext') && !document.getElementById('searchContext').hidden) {
          setSearchContextVisible(false);
          document.getElementById('searchInput').blur();
        }
      } else if (
        event.key === '/' &&
        document.getElementById('player-overlay').style.display !== 'flex' &&
        document.getElementById('details-overlay').style.display !== 'block'
      ) {
        event.preventDefault();
        document.getElementById('searchInput')?.focus();
      }
    });

    let statePersistTimer = null;
    window.addEventListener('scroll', () => {
      clearTimeout(statePersistTimer);
      statePersistTimer = setTimeout(() => persistUiState(), 120);
    }, { passive:true });
    window.addEventListener('pagehide', () => persistUiState());

    document.addEventListener('pointerdown', event => {
      const menu = document.getElementById('quickActions');
      if (!menu || menu.hidden) return;
      if (!menu.contains(event.target) && !event.target.closest?.('.card-quick-trigger')) {
        hideQuickActions();
      }
    });

    window.addEventListener('popstate', async event => {
      const snapshot = event.state?.aioplay || savedUiState();
      restoringUiState = true;
      hideQuickActions();

      const activePlayer = document.getElementById('player-overlay');
      if (
        activePlayer.style.display === 'flex' &&
        !activePlayer.classList.contains('mini')
      ) {
        await closePlayer(true, { returnToOrigin:false });
      }

      const detailsOverlay = document.getElementById('details-overlay');
      const detailsWasOpen = detailsOverlay.style.display === 'block';
      const sameMountedView = mountedViewMatchesSnapshot(snapshot);

      // Details and Player are overlays over the existing catalog. If browser
      // Back only changes the overlay state, never rebuild the grid underneath:
      // the same poster elements, decoded images, scroll position and focus
      // remain resident and can be revealed immediately.
      if (detailsWasOpen && snapshot?.overlay !== 'details') {
        await animateDetailsDismiss();
        closeDetails({ restoreFocus:false, persist:false });
      }

      if (!sameMountedView && snapshot?.mode) {
        await loadMode(snapshot.mode, { snapshot, push:false });
        const search = document.getElementById('searchInput');
        search.value = snapshot.search || '';
        setSearchType(snapshot.searchType || '', { rerun:false });
        if (snapshot.search) await applySearch(snapshot.search, { persist:false });
        restoreGridPosition(snapshot);
      } else if (sameMountedView) {
        restoreGridPosition(snapshot);
      }

      if (snapshot?.overlay === 'details' && currentDetailsMeta) {
        document.body.classList.add('details-open');
        detailsOverlay.style.display = 'block';
        setDetailsTitleArt(currentDetailsMeta);
        setDetailsBackdrop(currentDetailsMeta);
        restoreDetailsEpisodeFocus();
      }

      restoringUiState = false;
    });

    document.getElementById('motionToggle').addEventListener('click', toggleMotionPreference);
    applyMotionPreference();
    initCatalogRailGestures();
    initDetailsSwipeDismiss();
    initMobileScrollNavigation();

    const timelineTrack = document.querySelector('.player-timeline-track');
    timelineTrack?.addEventListener('click', event => {
      const video = document.getElementById('video');
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      const rect = timelineTrack.getBoundingClientRect();
      const fraction = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      video.currentTime = fraction * video.duration;
      updatePlayerTimeline(video);
    });

    initVodPlayerControl();
    initContent();
  </script>
<script>
  // Account state controls the small amount of chrome that differs by role.
  // Content and playback remain identical for every user.
  (async () => {
    const signOut = document.getElementById('signOutBtn');
    try {
      const gate = await (await fetch('/api/site/auth')).json();
      if (gate.authenticated && signOut) {
        signOut.style.display = 'inline-flex';
        signOut.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
          location.href = '/login';
        });
      }
      const isAdmin = !!(gate.user && gate.user.role === 'admin');
      document.querySelectorAll('.admin-only').forEach(el => {
        if (isAdmin) {
          const visibleDisplay = el.classList.contains('control-separator')
            ? 'block'
            : (el.tagName === 'A' ? 'inline-flex' : 'flex');
          el.style.setProperty('display', visibleDisplay, 'important');
        } else {
          el.style.setProperty('display', 'none', 'important');
        }
      });
    } catch (_) {
      document.querySelectorAll('.admin-only').forEach(el => { el.style.display = 'none'; });
    }
  })();
</script>
