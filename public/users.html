<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIOPlay — Users</title>
<link rel="icon" type="image/webp" href="/aioplay-brand.webp">
<style>
:root{--bg:#0a0a0c;--panel:#151518;--panel2:#1d1d22;--line:#2c2c33;--text:#f4f4f5;--dim:#a1a1aa;--accent:#1668ff;--bad:#ff7075;--good:#67d391}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1050px;margin:0 auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:11px}.brand h1{font-size:22px;margin:0}.brand p{color:var(--dim);margin:2px 0 0}
a{color:#9fc2ff;text-decoration:none}.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}h2{font-size:16px;margin:0 0 16px}
label{display:block;color:var(--dim);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;margin:13px 0 6px}
input,select,button{font:inherit}input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
button{border:0;border-radius:9px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#2b2b32}button.danger{background:#6e292c}button:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{min-height:20px;margin-top:12px;color:var(--bad)}
.user{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px}.userhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-weight:750}.meta{color:var(--dim);font-size:12px;margin-top:3px}.pill{padding:3px 8px;border-radius:99px;background:#2a2a31;color:var(--dim);font-size:11px}.pill.on{color:var(--good)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.row input,.row select{margin:0}.empty{color:var(--dim);padding:10px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}}
</style>
<style id="admin-bottom-nav-style">body{padding-bottom:64px!important}.admin-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:4px;background:#0a0e13;border-top:1px solid rgba(255,255,255,.08)}.admin-bottom-nav a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 4px;border-radius:9px;color:#9ca6af;text-decoration:none;font-weight:700}.admin-bottom-nav a.active{background:#34404b;color:#f3f5f7}@media(max-width:650px){.admin-bottom-nav a{font-size:11px;min-height:46px}}</style><style id="admin-console-unified">
:root{--bg:#0a0e13;--panel:#11161d;--panel2:#171d25;--line:rgba(255,255,255,.08);--text:#f3f5f7;--dim:#9ca6af;--accent:#9aadb5;--good:#7fa58b;--bad:#d78383}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 10%,rgba(113,133,155,.12),transparent 34%),linear-gradient(135deg,#0a0e13 0%,#11161d 52%,#171920 100%);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom))!important}
.console-header{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 max(20px,calc((100vw - 1100px)/2));background:rgba(10,14,19,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.console-header img{width:36px;height:36px;border-radius:9px;object-fit:cover}.console-header h1{margin:0;font-size:17px;font-weight:750}.console-header .console-subtitle{margin-left:auto;color:var(--dim);font-size:13px}
main{width:100%;max-width:1100px!important;margin:0 auto!important;padding:24px 20px 40px!important}
.card,.panel{background:rgba(17,22,29,.86)!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:0 14px 42px rgba(0,0,0,.15)!important}
.admin-bottom-nav,.admin-tabs{position:fixed!important;left:0;right:0;bottom:0;z-index:100;display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:2px!important;margin:0!important;padding:4px 4px calc(4px + env(safe-area-inset-bottom))!important;background:rgba(10,14,19,.96)!important;border-top:1px solid var(--line)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.admin-bottom-nav a,.admin-tabs a,.admin-tabs button{display:flex!important;align-items:center!important;justify-content:center!important;min-height:48px!important;padding:6px 4px!important;border:0!important;border-radius:9px!important;background:transparent!important;color:var(--dim)!important;text-decoration:none!important;font:700 13px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;text-align:center!important}
.admin-bottom-nav .active,.admin-tabs .active{background:#34404b!important;color:var(--text)!important}
@media(max-width:650px){.console-header{height:58px;padding:0 16px}.console-header img{width:32px;height:32px}.console-header h1{font-size:16px}.console-header .console-subtitle{display:none}main{padding:18px 16px 30px!important}.admin-bottom-nav a,.admin-tabs a,.admin-tabs button{font-size:11px!important;min-height:46px!important}}
</style></head>
<body>
<header class="console-header"><img src="/aioplay-brand.webp" alt=""><h1>Users</h1><span class="console-subtitle">Accounts and access</span></header>
<main>
  <div class="grid">
    <section class="card">
      <h2>Create user</h2>
      <form id="createForm">
        <label for="newUsername">Username</label>
        <input id="newUsername" autocomplete="off" required minlength="3" maxlength="32">
        <label for="newDisplay">Display name</label>
        <input id="newDisplay" autocomplete="off" maxlength="60">
        <label for="newPassword">Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" required minlength="8">
        <label for="newRole">Role</label>
        <select id="newRole"><option value="user">User</option><option value="admin">Administrator</option></select>
        <label for="newStreams">Concurrent streams</label>
        <select id="newStreams">
          <option value="1" selected>1 active stream</option>
          <option value="2">2 active streams</option>
          <option value="3">3 active streams</option>
        </select>
        <label style="text-transform:none;letter-spacing:0;font-size:13px"><input id="newStreamPicker" type="checkbox" style="width:auto;margin-right:8px">Enable diagnostic AIOStreams picker</label>
        <button type="submit" style="margin-top:16px;width:100%">Create user</button>
        <div class="msg" id="createMsg"></div>
      </form>
    </section>

    <section class="card">
      <h2>Accounts</h2>
      <div id="users"><div class="empty">Loading…</div></div>
      <div class="msg" id="listMsg"></div>
    </section>
  </div>
</main>
<script>
const usersEl=document.getElementById('users');
const listMsg=document.getElementById('listMsg');
const createMsg=document.getElementById('createMsg');

async function api(url,opts={}){
  const res=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});
  const body=res.status===204?{}:await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.error||('Request failed ('+res.status+')'));
  return body;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

async function load(){
  listMsg.textContent='';
  try{
    const {users}=await api('/api/v1/admin/users');
    if(!users.length){usersEl.innerHTML='<div class="empty">No accounts.</div>';return;}
    usersEl.innerHTML=users.map(u=>`
      <div class="user" data-id="${esc(u.id)}">
        <div class="userhead">
          <div><div class="name">${esc(u.displayName)} <span style="color:var(--dim);font-weight:500">@${esc(u.username)}</span></div>
          <div class="meta">Created ${new Date(u.createdAt).toLocaleString()}</div></div>
          <span class="pill ${u.enabled?'on':''}">${u.enabled?'Enabled':'Disabled'}</span>
        </div>
        <div class="row">
          <select class="role"><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option></select>
          <select class="streamLimit" aria-label="Concurrent streams">
            <option value="1" ${Number(u.maxConcurrentStreams||1)===1?'selected':''}>1 active stream</option>
            <option value="2" ${Number(u.maxConcurrentStreams||1)===2?'selected':''}>2 active streams</option>
            <option value="3" ${Number(u.maxConcurrentStreams||1)===3?'selected':''}>3 active streams</option>
          </select>
        </div>
        <label style="text-transform:none;letter-spacing:0;font-size:13px"><input class="streamPicker" type="checkbox" style="width:auto;margin-right:8px" ${u.streamPickerEnabled?'checked':''}>Enable diagnostic AIOStreams picker</label>
        <div class="row">
          <input class="display" value="${esc(u.displayName)}" maxlength="60" aria-label="Display name">
          <input class="password" type="password" minlength="8" placeholder="New password (optional)" autocomplete="new-password">
        </div>
        <div class="actions">
          <button class="save">Save changes</button>
          <button class="secondary toggle">${u.enabled?'Disable account':'Enable account'}</button>
          <button class="secondary revoke">Sign out all devices</button>
        </div>
      </div>`).join('');

    document.querySelectorAll('.user').forEach(row=>{
      const id=row.dataset.id;
      row.querySelector('.save').onclick=async()=>{
        const payload={
          role:row.querySelector('.role').value,
          displayName:row.querySelector('.display').value,
          maxConcurrentStreams:Number(row.querySelector('.streamLimit').value),
          streamPickerEnabled:row.querySelector('.streamPicker').checked
        };
        const pw=row.querySelector('.password').value;
        if(pw)payload.password=pw;
        await change(id,payload);
      };
      row.querySelector('.toggle').onclick=async()=>{
        const enabled=row.querySelector('.pill').textContent!=='Enabled';
        await change(id,{enabled});
      };
      row.querySelector('.revoke').onclick=async()=>{
        try{await api('/api/v1/admin/users/'+encodeURIComponent(id)+'/sessions',{method:'DELETE'});listMsg.textContent='All sessions for that account were revoked.';}
        catch(e){listMsg.textContent=e.message;}
      };
    });
  }catch(e){usersEl.innerHTML='';listMsg.textContent=e.message;}
}
async function change(id,payload){
  listMsg.textContent='';
  try{await api('/api/v1/admin/users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(payload)});await load();}
  catch(e){listMsg.textContent=e.message;}
}
document.getElementById('createForm').onsubmit=async e=>{
  e.preventDefault();createMsg.textContent='';
  try{
    await api('/api/v1/admin/users',{method:'POST',body:JSON.stringify({
      username:document.getElementById('newUsername').value.trim(),
      displayName:document.getElementById('newDisplay').value.trim(),
      password:document.getElementById('newPassword').value,
      role:document.getElementById('newRole').value,
      maxConcurrentStreams:Number(document.getElementById('newStreams').value),
      streamPickerEnabled:document.getElementById('newStreamPicker').checked
    })});
    e.target.reset();await load();
  }catch(err){createMsg.textContent=err.message;}
};
load();
</script>
<nav class="admin-bottom-nav" aria-label="Admin console"><a href="/services">Services</a><a href="/analytics">Analytics</a><a href="/users" class="active">Users</a><a href="/dashboard">Dashboard</a><a href="/dashboard#collections">Collections editor</a></nav></body>
</html>
