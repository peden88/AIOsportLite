name: Publish Downloads Only image

on:
  push:
    branches:
      - feature/downloads-only
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: downloads-only-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/feature/downloads-only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads-only branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The feature branch currently has an outdated package-lock.json (sharp is missing).
      # Match the existing Dockerfile's npm install until the lockfile is regenerated.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/peden88/aiosportlite
          tags: |
            type=raw,value=downloads-only
            type=sha,format=short,prefix=

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=downloads-only
          cache-to: type=gha,mode=max,scope=downloads-only
