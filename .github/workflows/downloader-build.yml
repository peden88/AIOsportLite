name: Downloader build and tests
on:
  push:
    branches: [feature/downloads-only]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Downloader JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/services/DownloadSelections.js
          node --check public/downloader.js
      - name: Download selection tests
        run: node tests/download-selections.test.js
      - name: Existing test suite
        run: npm test
      - name: Build bundled server
        run: npm run build
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/peden88/aioplay-downloader:feature
          cache-from: type=gha
          cache-to: type=gha,mode=max
