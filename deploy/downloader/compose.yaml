services:
  aioplay-downloader:
    container_name: aioplay-downloader
    image: ghcr.io/peden88/aioplay-downloader:feature\n    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "7000"
      NODE_ENV: production
      DOWNLOADER_ONLY: "true"
      DATA_DIR: /data
      TZ: ${TZ:-Europe/London}
      ADDON_URL: ${ADDON_URL}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      ALLOW_OPEN_ACCESS: "false"
      SPORTS_ENABLED: "false"
      VOD_ENABLED: "true"
      AIOMETADATA_MANIFEST_URL: ${AIOMETADATA_MANIFEST_URL}
      AIOSTREAMS_MANIFEST_URL: ${AIOSTREAMS_MANIFEST_URL}
      AIOSTREAMS_WEB_MANIFEST_URL: ${AIOSTREAMS_MANIFEST_URL}
      NUVIO_COLLECTIONS_URL: ${NUVIO_COLLECTIONS_URL:-}
      COLLECTIONS_TTL_MS: ${COLLECTIONS_TTL_MS:-3600000}
    volumes:
      - aioplay-downloader-data:/data
      # Place your COLLECTIONS.json at /opt/aioplay/collections/COLLECTIONS.json on the VPS
      - /opt/aioplay/collections/COLLECTIONS.json:/data/COLLECTIONS.json:ro
    networks:
      - pangolin_frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  aioplay-downloader-data:

networks:
  pangolin_frontend:
    external: true
