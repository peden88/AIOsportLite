services:
  aiosportlite:
    build: .
    container_name: aiosportlite
    ports:
      - "7000:7000"
    # Everything in .env reaches the app: account bootstrap credentials, service
    # registry URLs, ADDON_URL, ADMIN_TOKEN and the rest of .env.example. Optional, so the stack still starts without one.
    # Needs Docker Compose v2.24 or newer.
    env_file:
      - path: .env
        required: false
    environment:
      # The port inside the container. To use another port on your machine,
      # change the left-hand side of "7000:7000" above instead.
      - PORT=7000
      # Kickoff times for viewers who have not picked a timezone in /configure
      - TZ=${TZ:-America/New_York}
      # Also taken from the shell or a stack's own variables, for setups with
      # no .env file beside this one (Portainer, CI, exported variables).
      - ADDON_URL=${ADDON_URL:-}
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-admin}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      - APP_ADMIN_DISPLAY_NAME=${APP_ADMIN_DISPLAY_NAME:-Administrator}
      - AUTH_KEY=${AUTH_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - SPORTS_ENABLED=${SPORTS_ENABLED:-true}
      - VOD_ENABLED=${VOD_ENABLED:-false}
      - AIOMETADATA_MANIFEST_URL=${AIOMETADATA_MANIFEST_URL:-}
      - AIOSTREAMS_MANIFEST_URL=${AIOSTREAMS_MANIFEST_URL:-}
      - LINK_SECRET=${LINK_SECRET:-}
      # Where saved profiles are written. The volume below is what makes them
      # outlive a rebuild.
      - DATA_DIR=/data
    volumes:
      - aiosportlite-data:/data
    restart: unless-stopped

volumes:
  aiosportlite-data:
